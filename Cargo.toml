[package]
name = "gdscheck"
# When bumping: also update the tag in README.md's image URL
version = "0.1.2"
edition = "2024"
authors = ["Daniel Schultz <dnltz@aesc-silicon.de>"]
description = "Open-source DRC (Design Rule Check) engine for GDSII layouts."
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/aesc-silicon/gdscheck"
keywords = ["gds", "eda", "vlsi", "drc", "layout"]
categories = ["command-line-utilities", "science"]
include = [
    "src/**/*.rs",
    "build.rs",
    "pdks/**/*.yml",
    "gen/**/*.rs",
    "/README.md",
    "/LICENSE",
]

[dev-dependencies]
rstest = "0.23"

# The tests run optimized: the suite is geometry over two thousand layouts at three
# tile sizes, and unoptimized it took the CI runner 170 minutes at the 7 µm tile
# where the release build takes a minute.  No LTO and the default codegen units, so
# the fifteen test binaries still build in parallel and incrementally; the debug
# assertions stay on.
[profile.test]
opt-level = 3

[profile.release]
opt-level = 3        # maximum optimization
lto = true           # link-time optimization across crates
codegen-units = 1    # single codegen unit for better LTO
strip = true         # strip debug symbols from binary

# The release build with its symbols and line tables, for a profiler:
# `cargo build --profile profiling`, then `samply record target/profiling/gdscheck ...`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[[bin]]
name = "gdscheck"
path = "src/main.rs"

[features]
dev-tools = []

[[bin]]
name = "gen-testdata"
path = "gen/main.rs"
required-features = ["dev-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
gds21 = "3.0.0-pre.2"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
flate2 = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
rayon = "1"
i_overlay = "4.5.1"
