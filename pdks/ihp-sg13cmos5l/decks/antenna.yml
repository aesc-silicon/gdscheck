rules:
  - id: Ant.a
    check: antenna_ratio
    layers: [AntPolyField]
    value: 200.0
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      antenna_net_of: GatPoly
      level: Activ
  - id: Ant.b
    check: antenna_ratio
    layers: [Metal1, Metal2, Metal3, Metal4, TopMetal1]
    value: 200.0
    params:
      diode: without
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      diode_1: AntDiode
      diode_1_net_of: Activ
  - id: Ant.c
    check: antenna_ratio
    layers: [Cont]
    value: 20.0
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      level: Activ
  - id: Ant.d
    check: antenna_ratio
    layers: [Via1, Via2, Via3, TopVia1]
    value: 20.0
    params:
      diode: without
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      diode_1: AntDiode
      diode_1_net_of: Activ
  - id: Ant.e
    check: antenna_ratio
    layers: [Metal1, Metal2, Metal3, Metal4, TopMetal1]
    value: 20000.0
    params:
      diode: with
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      diode_1: AntDiode
      diode_1_net_of: Activ
  - id: Ant.f
    check: antenna_ratio
    layers: [Via1, Via2, Via3, TopVia1]
    value: 500.0
    params:
      diode: with
    layer_params:
      gate: GatPolyOverActiv
      gate_net_of: GatPoly
      diode_1: AntDiode
      diode_1_net_of: Activ
  - id: Ant.g
    check: min_area
    layers: [AntDantenna, AntDpantenna]
    value: 0.16
    params:
      net: connected
    layer_params:
      connected: GatPolyOverActiv
      connected_net_of: GatPoly
      net_of: Activ
  - id: Ant.h
    check: forbidden
    layers: [AntHError]
    value: 0.0
  - id: Ant.i
    check: forbidden
    layers: [AntIError]
    value: 0.0
