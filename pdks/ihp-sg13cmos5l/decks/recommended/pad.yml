rules:
  - id: Pad.aR
    check: min_width
    layers: [PassivDfpad]
    value: 30.00
  - id: Pad.bR
    check: min_space
    layers: [PassivDfpad]
    value: 8.40
  - id: Pad.dR
    check: forbidden
    layers: [PadDRBad]
    value: 0.0
  - id: Pad.d1R
    check: forbidden
    layers: [PadD1RBad]
    value: 0.0
  - id: Pad.gR
    check: min_enclosure
    layers: [Metal4Dfpad, TopVia1]
