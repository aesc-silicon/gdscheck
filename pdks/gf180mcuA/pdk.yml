# GlobalFoundries 180 nm MCU (gf180mcu), variant A: 3 metal layers, 30K top metal,
# MIM option A.  Upstream ships one KLayout deck for every variant and selects
# behaviour from those three options at run time; this is the variant-A projection
# of it, sharing every variant-independent deck with gf180mcuD and overriding only
# what the three options change.
#
# The stack is where most of that lands.  `top_metal` and its neighbours are aliases
# in the base PDK, so re-pointing them at Metal3 / Metal2 / Via2 / Via1 moves every
# rule written against the top of the stack down two levels at once.
#
# The antenna deck is absent.  Its rules read a net by prefix of the connect graph, and
# the only antenna fixtures upstream ships are variant E - so a variant-A antenna deck
# could be written but not measured, and an unmeasured net-aware rule is worse than none.
name: GlobalFoundries GF180MCU (variant A)
version: "0.1"
extends: ../gf180mcuD/pdk.yml

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every deck
  - name: core
    path: suites/core.yml
    description: Geometric DRC - main minus antenna and density
  - name: density
    path: suites/density.yml
    description: Global coverage checks
  - name: recommended
    path: suites/recommended.yml
    description: Guidance the foundry documents but does not check

decks:
  - name: acute
    path: ../gf180mcuD/decks/acute.yml
    description: Angles that are not a multiple of 45 degrees
  - name: comp
    path: ../gf180mcuD/decks/comp.yml
    description: Active area (COMP)
  - name: contact
    path: ../gf180mcuD/decks/contact.yml
    description: Contact
  - name: cup
    path: decks/cup.yml
    description: Cu pillar
  - name: density
    path: decks/density.yml
    description: Global layer density (COMP, Poly2, Metal)
  - name: dnwell
    path: ../gf180mcuD/decks/dnwell.yml
    description: Deep N-well
  - name: drc_bjt
    path: ../gf180mcuD/decks/drc_bjt.yml
    description: BJT geometry
  - name: dualgate
    path: ../gf180mcuD/decks/dualgate.yml
    description: Dual gate oxide (5/6 V devices)
  - name: dummy_comp
    path: ../gf180mcuD/decks/dummy_comp.yml
    description: COMP dummy fill
  - name: dummy_exclude
    path: ../gf180mcuD/decks/dummy_exclude.yml
    description: Dummy-fill exclude marker
  - name: dummy_metal
