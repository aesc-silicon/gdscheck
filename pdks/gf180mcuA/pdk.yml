connectivity:
  # ORDERED, and shorter than the base PDK's: the antenna deck reads a net by *prefix*
  # of this list, so the metal stack has to end where the variant's does.  Steps 0-10
  # are the pre-metal net and are identical to variant D's.
  # ORDERED.  The antenna deck selects a net by *prefix* of this list - the stack as it
  # exists partway through processing - so the index of every step is load-bearing and
  # the order mirrors the antenna rules' own connect phases: gates and diffusions
  # first, then the wells, then the metal stack one level at a time.  Inserting a step
  # shifts every level above it; tests/pdk_integrity.rs pins the list so that breaks
  # loudly.  Indices are noted where an antenna rule names them.
  - connector: contact           # 0
    layers: [poly2_drawn]
  - connector: contact           # 1
    layers: [ncomp_con]
  - connector: contact           # 2
    layers: [pcomp_con]
  - connector: contact           # 3
    layers: [natcomp_con]
  # Well ties and device bodies: the tap diffusion is the connector between the well
  # and the contacted active it straps.  These sit ahead of the metal stack because
  # upstream's antenna phases have the wells connected from the contact level up.
  - connector: ntap              # 4
    layers: [nwell, nw_lv, nw_mv, ncomp_con]
  # `dnwell` itself is listed beside `dnwell_n` so the deep well has a net of its own:
  # DN.2a/DN.2b are the same-potential/different-potential spacing pair, and without the
  # drawn layer in the graph neither can resolve one.
  - connector: ntap_dn           # 5
    layers: [dnwell_n, ncomp_con, dnwell]
  - connector: ptap              # 6
    layers: [lvpwell, lvpwell_dn_lv, lvpwell_dn_mv, pcomp_con]
  - connector: mvsd_tap          # 7
    layers: [mvsd, ncomp_con]
  - connector: ntap              # 8
    layers: [nwell, mvsd]
  - connector: mvpsd_tap         # 9
    layers: [mvpsd, pcomp_con]
  - connector: contact           # 10 - end of the pre-metal net (ANT.8)
    layers: [metal1_drawn]
  - connector: via1              # 11
    layers: [metal1_drawn]
  - connector: via1              # 12
    layers: [metal2_drawn]
  - connector: via2              # 13
    layers: [metal2_drawn]
  # MIM option A ties the cap plate in at the Via2 phase (`connect(via2, fusetop)` in
  # antenna.rb), one level below where option B does.
  - connector: via2              # 14
    layers: [fusetop]
  - connector: via2              # 15
    layers: [metal3_drawn]
  - connector: mimcap_top_tap    # 16
    layers: [fusetop, metal3_drawn]

virtual_layers:
  # The 3LM stack.  These four names are what every top-of-stack rule is written
  # against, so overriding them here re-points the whole family at once.
  - name: top_metal
    op: union
    mode: lazy
    layers: [metal3]
  - name: topmin1_metal
    op: union
    mode: lazy
    layers: [metal2]
  - name: top_via
    op: union
    mode: lazy
    layers: [via2]
  - name: topmin1_via
    op: union
    mode: lazy
    layers: [via1]
  # MIM.9 measures via spacing over the top plate on the vias *clipped* to it, where
  # option B selects the vias lying wholly inside it.
  - name: top_via_and_fusetop
    op: intersection
    mode: lazy
    layers: [top_via, fusetop]
  # MT30.1b: a line is "long" if any of its own edges runs 1000 um or more.
  - name: top_metal_long_line
    op: interacting
    mode: lazy
    layers: [top_metal, top_metal_long_edges]
  # MT30.5 forbids a via outside the top metal outright, which no enclosure margin can
  # measure - there is nothing to measure between.
  - name: top_via_not_in_top_metal
    op: not_inside
    mode: lazy
    layers: [top_via, top_metal]

edge_layers:
  - name: top_metal.edges
    op: edges
    layers: [top_metal]
  - name: top_metal_long_edges
    op: with_length
    min: 1000.0
    layers: [top_metal.edges]
