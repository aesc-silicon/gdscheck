# ASAP7, the 7 nm predictive FinFET PDK from Arizona State University and ARM (release
# 1p7).  The rules are the design rule manual's (asap7_drm_201207a.pdf); the foundry-style
# Calibre deck is not public, so the manual is the reference, with the KLayout port at
# github.com/laurentc2/ASAP7_for_KLayout read alongside it for what each rule measures.
#
# Layouts are drawn at the real 7 nm scale on a 0.25 nm grid (4000 DBU per um), the way
# the standard-cell libraries ship; an older layout drawn 4x up for Calibre must be
# scaled first.
#
# Most layers route one way, and the manual words their rules so: "minimum horizontal
# width of WELL", "minimum vertical spacing of ACTIVE".  Those rules read `facing: x`
# (vertical walls, a horizontal span) or `facing: y`.  A via "enclosed on two opposite
# sides" is `sides: opposite`.  Each deck's header lists the rules of its section it
# does not check, and why.
name: ASAP7
version: "1p7"

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every deck
  - name: feol
    path: suites/feol.yml
    description: Front end and middle of line, through V0 (a standard cell)
  - name: beol
    path: suites/beol.yml
    description: Routing stack, M1 to the pad

