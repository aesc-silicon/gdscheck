# V1, the via from M1 to M2 (DRM section 3.13).  V1.M1.EN.1's "5 & 2" requires
# 5 nm on one side and 2 nm on its opposite side, on the same axis.
#
# Not checked: V1.S.3 and V1.S.4 (see V1.S.2).
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V1.W.1
    check: min_width
    layers: [V1NoSram]
    value: 0.018
  - id: V1.S.1
    check: min_space
    layers: [V1NoSram]
    value: 0.018
  # The loosest of the corner-to-corner spacings V1.S.2-4, which differ by
  # whether each via has a 5 nm M2 end-cap: that is not told apart here, so a
  # pair between 23 and 30 nm corner to corner is not read.
  - id: V1.S.2
    check: min_space
    layers: [V1NoSram]
    value: 0.023
    params:
      facing: none
  - id: V1.M1.EN.1
    check: min_enclosure
    layers: [M1, V1NoSram]
    value: 0.005
    params:
      sides: opposite
      opposite_value: 0.002
  - id: V1.M2.EN.2
    check: min_enclosure
    layers: [M2, V1NoSram]
    value: 0.005
    params:
      sides: any
  - id: V1.AUX.1
    check: forbidden
    layers: [V1NoSram, M1]
    value: 0.0
    params:
      op: uncovered
  - id: V1.AUX.1
    check: forbidden
    layers: [V1NoSram, M2]
    value: 0.0
    params:
      op: uncovered
  - id: V1.M2.AUX.2
    check: max_enclosure
    layers: [M2, V1NoSram]
    value: 0.0
    params:
      sides: opposite
