# V8, the via from M8 to M9 (DRM section 3.19).  A V8 is a 40 x 40, 40 x 120 or
# 120 x 40 nm rectangle: its short side exactly 40 nm, its long side one of the two.
rules:
  - id: V8.W.1
    check: exact_dim
    layers: [V8]
    value: 0.04
  - id: V8.W.1
    check: forbidden
    layers: [V8BadLength]
    value: 0.0
  - id: V8.W.1
    check: forbidden
    layers: [V8NotRect]
    value: 0.0
  - id: V8.S.1
    check: min_space
    layers: [V8]
    value: 0.057
  - id: V8.M8.EN.1
    check: min_enclosure
    layers: [M8, V8]
    value: 0.02
    params:
      sides: opposite
  - id: V8.M9.EN.2
    check: min_enclosure
    layers: [M9, V8]
    value: 0.02
    params:
      sides: opposite
  - id: V8.AUX.1
    check: forbidden
    layers: [V8, M8]
    value: 0.0
    params:
      op: uncovered
  - id: V8.AUX.1
    check: forbidden
    layers: [V8, M9]
    value: 0.0
    params:
      op: uncovered
