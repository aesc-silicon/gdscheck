# M7 (DRM section 3.16).  M7 routes vertically: its width across the track and the space
# between tracks read the walls facing across x, its length and the tip-to-tip
# space those facing across y.
#
# The routing grid and tracks: AUX.1 reads every vertical edge on the 32 nm grid, and
# AUX.2 and W.4 read a wire's centre on the tracks, two widths apart - a minimum-width
# wire lies on one, and a wider wire spans an odd number of them, which is the same wire
# centred on one.  The manual sets the grid's offset per design and defaults it to 0; a
# design routed on other tracks sets `offset` on AUX.1 to its grid's, and on AUX.2 and
# W.4 to its tracks' centreline, the grid's offset plus half a width.
#
# Two wires on adjacent tracks - their long walls facing across x with nothing routable
# between, under three widths (96 nm) - that run alongside at all run alongside for S.5's
# 44 nm, and their tips on one side are aligned or S.4's 40 nm apart (DRM fig. 3.16.2(d)).
# Two that do not run alongside are S.3's corner.  Neither is in the ASAP7 tech LEF
# (`asap7_tech_1x_201209.lef`, and LambdaPDK's copy of it), whose M7 states no
# parallel-run or tip-stagger rule between adjacent tracks: `tech_lef: absent` says so
# beside their counts, so a routed design's markers read as a gap in the router's
# rules rather than a router that broke one it knew.
#
# Not checked: M7.AUX.4, a wide wire's outside edge on a track's edge.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: M7.W.1
    check: min_width
    layers: [M7NoSram]
    value: 0.032
    params:
      facing: x
  - id: M7.W.2
    check: max_width
    layers: [M7NoSram]
    value: 0.64
    params:
      # Apply facing even when the perpendicular dimension is smaller.
      span: any
      facing: x
  - id: M7.W.3
    check: forbidden
    layers: [M7EvenWidthEdges]
    value: 0.0
  - id: M7.W.4
    check: offtrack
    layers: [M7Wide]
    value: 0.064
    params:
      facing: x
      offset: 0.016
  - id: M7.W.5
    check: min_width
    layers: [M7NoSram]
    value: 0.044
    params:
      facing: y
  - id: M7.S.1
    check: min_space
    layers: [M7NoSram]
    value: 0.032
    params:
      facing: x
  - id: M7.S.1
    check: min_notch
    layers: [M7NoSram]
    value: 0.032
    params:
      facing: x
  - id: M7.S.2
    check: min_space
    layers: [M7NoSram]
    value: 0.04
    params:
      facing: y
  - id: M7.S.2
    check: min_notch
    layers: [M7NoSram]
    value: 0.04
    params:
      facing: y
  # Two tips on adjacent tracks that share no run face each other nowhere.
  - id: M7.S.3
    check: min_space
    layers: [M7NoSram]
    value: 0.04
    params:
      facing: none
  - id: M7.S.4
    check: min_tip_stagger
    layers: [M7NoSram]
    value: 0.04
    params:
      facing: x
      within: 0.096
    tech_lef: absent
  - id: M7.S.5
    check: min_track_run
    layers: [M7NoSram]
    value: 0.044
    params:
      facing: x
      within: 0.096
    tech_lef: absent
  - id: M7.AUX.1
    check: offgrid
    layers: [M7NoSram]
    value: 0.032
    params:
      facing: x
      offset: 0.0
  - id: M7.AUX.2
    check: offtrack
    layers: [M7Track]
    value: 0.064
    params:
      facing: x
      offset: 0.016
  - id: M7.AUX.3
    check: forbidden
    layers: [M7Bent]
    value: 0.0
