# M7 (DRM section 3.16).  M7 routes vertically: its width across the track and the space
# between tracks read the walls facing across x, its length and the tip-to-tip
# space those facing across y.
#
# Not checked: M7.W.3 and M7.W.4, a width that is an even multiple of the minimum;
# M7.S.4 and M7.S.5, the tip-to-tip space and the run two lines on adjacent tracks share;
# and M7.AUX.1, M7.AUX.2 and M7.AUX.4, the routing grid and tracks, which the manual
# places by an offset set per design.
rules:
  - id: M7.W.1
    check: min_width
    layers: [M7]
    value: 0.032
    params:
      facing: x
  - id: M7.W.2
    check: max_width
    layers: [M7]
    value: 0.64
    params:
      # Apply facing even when the perpendicular dimension is smaller.
      span: any
      facing: x
  - id: M7.W.5
    check: min_width
    layers: [M7]
    value: 0.044
    params:
      facing: y
  - id: M7.S.1
    check: min_space
    layers: [M7]
    value: 0.032
    params:
      facing: x
  - id: M7.S.1
    check: min_notch
    layers: [M7]
    value: 0.032
    params:
      facing: x
  - id: M7.S.2
    check: min_space
    layers: [M7]
    value: 0.04
    params:
      facing: y
  - id: M7.S.2
    check: min_notch
    layers: [M7]
    value: 0.04
    params:
      facing: y
  # Two tips on adjacent tracks that share no run face each other nowhere.
  - id: M7.S.3
    check: min_space
    layers: [M7]
    value: 0.04
    params:
      facing: none
  - id: M7.AUX.3
    check: forbidden
    layers: [M7Bent]
    value: 0.0
