# SDT, the source/drain trench (DRM section 3.8).
#
# SDT.ACTIVE.OV.1 measures the actual intersection: AUX.2 allows the trench to
# extend beyond ACTIVE, so its own height does not guarantee 27 nm of overlap.
# An absent or touching-only ACTIVE is rejected by SDT.ACTIVE.AUX.3.
# SDT.LISD.OV.2 is implied by full LISD containment (SDT.LISD.AUX.4) and SDT.W.2.
# SDT.W.3 reads every vertical edge of ordinary SDT against the whole multiples of 27 nm,
# as ACTIVE.W.2 does.
# SRAM SDT is exempt from ordinary edge alignment and LISD containment. Both
# explicit SRAM overlaps need their own checks, including absent or touching-only
# references: an empty intersection has no width to measure.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: SDT.W.1
    check: min_width
    layers: [SdtNoSram]
    value: 0.024
    params:
      facing: x
  - id: SDT.W.2
    check: min_width
    layers: [SdtNoSram]
    value: 0.027
    params:
      facing: y
  - id: SDT.W.3
    check: forbidden
    layers: [SdtW3Off]
    value: 0.0
  - id: SDT.ACTIVE.OV.1
    check: min_width
    layers: [SdtNoSramOnActive]
    value: 0.027
    params:
      facing: y
  - id: SRAM.SDT.W.4
    check: min_width
    layers: [SdtSram]
    value: 0.017
    params:
      facing: y
  - id: SRAM.SDT.ACTIVE.OV.3
    check: min_width
    layers: [SdtSramOnActive]
    value: 0.017
    params:
      facing: y
  - id: SRAM.SDT.ACTIVE.OV.3
    check: forbidden
    layers: [SdtSramOffActive]
    value: 0.0
  - id: SRAM.SDT.LISD.OV.4
    check: min_width
    layers: [SdtSramOnLisd]
    value: 0.017
    params:
      facing: y
  - id: SRAM.SDT.LISD.OV.4
    check: forbidden
    layers: [SdtSramOffLisd]
    value: 0.0
  - id: SDT.S.1
    check: min_space
    layers: [SdtNoSram]
    value: 0.03
    params:
      facing: x
  - id: SDT.S.1
    check: min_notch
    layers: [SdtNoSram]
    value: 0.03
    params:
      facing: x
  - id: SDT.GATE.S.2
    check: min_space
    layers: [SdtNoSram, GateNoSram]
    value: 0.005
    params:
      facing: x
  - id: SDT.GATE.AUX.1
    check: forbidden
    layers: [SdtOnGate]
    value: 0.0
  - id: SDT.ACTIVE.AUX.2
    check: forbidden
    layers: [SdtHEdgesOffActive]
    value: 0.0
  - id: SDT.ACTIVE.AUX.3
    check: forbidden
    layers: [SdtOffActive]
    value: 0.0
  - id: SDT.LISD.AUX.4
    check: forbidden
    layers: [SdtNoSram, LISD]
    value: 0.0
    params:
      op: uncovered
