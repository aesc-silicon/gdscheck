# M5 (DRM section 3.14).  M5 routes vertically: its width across the track and the space
# between tracks read the walls facing across x, its length and the tip-to-tip
# space those facing across y.
#
# Not checked: M5.W.3 and M5.W.4, a width that is an even multiple of the minimum;
# M5.S.4 and M5.S.5, the tip-to-tip space and the run two lines on adjacent tracks share;
# and M5.AUX.1, M5.AUX.2 and M5.AUX.4, the routing grid and tracks, which the manual
# places by an offset set per design.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: M5.W.1
    check: min_width
    layers: [M5NoSram]
    value: 0.024
    params:
      facing: x
  - id: M5.W.2
    check: max_width
    layers: [M5NoSram]
    value: 0.48
    params:
      # Apply facing even when the perpendicular dimension is smaller.
      span: any
      facing: x
  - id: M5.W.5
    check: min_width
    layers: [M5NoSram]
    value: 0.044
    params:
      facing: y
  - id: M5.S.1
    check: min_space
    layers: [M5NoSram]
    value: 0.024
    params:
      facing: x
  - id: M5.S.1
    check: min_notch
    layers: [M5NoSram]
    value: 0.024
    params:
      facing: x
  - id: M5.S.2
    check: min_space
    layers: [M5NoSram]
    value: 0.04
    params:
      facing: y
  - id: M5.S.2
    check: min_notch
    layers: [M5NoSram]
    value: 0.04
    params:
      facing: y
  # Two tips on adjacent tracks that share no run face each other nowhere.
  - id: M5.S.3
    check: min_space
    layers: [M5NoSram]
    value: 0.04
    params:
      facing: none
  - id: M5.AUX.3
    check: forbidden
    layers: [M5Bent]
    value: 0.0
