# V2, the via from M2 to M3 (DRM section 3.13).
#
# Corner spacing reads the end-cap at the two corners forming the gap.
# S.1 checks the 18 nm minimum only; its 27 nm unaligned parallel-track case
# still needs track-aware classification.
# SRAM applicability: see hardening/asap7/sram-scope.tsv and the PDK documentation.
rules:
  - id: V2.W.1
    check: min_width
    layers: [V2NoSram]
    value: 0.018
  - id: V2.S.1
    check: min_space
    layers: [V2NoSram]
    value: 0.018
  - id: V2.S.2
    check: min_space
    layers: [V2NoSram]
    value: 0.023
    layer_params:
      corner_cover: M3Endcap5
    params:
      facing: none
      covered_corners: 2
  - id: V2.S.3
    check: min_space
    layers: [V2NoSram]
    value: 0.030
    layer_params:
      corner_cover: M3Endcap5
    params:
      facing: none
      covered_corners: 0
  - id: V2.S.4
    check: min_space
    layers: [V2NoSram]
    value: 0.027
    layer_params:
      corner_cover: M3Endcap5
    params:
      facing: none
      covered_corners: 1
  - id: V2.M2.EN.1
    check: min_enclosure
    layers: [M2, V2NoSram]
    value: 0.005
    params:
      sides: opposite
  - id: V2.M3.EN.2
    check: min_enclosure
    layers: [M3, V2NoSram]
    value: 0.005
    params:
      sides: any
  - id: V2.AUX.1
    check: forbidden
    layers: [V2NoSram, M2]
    value: 0.0
    params:
      op: uncovered
  - id: V2.AUX.1
    check: forbidden
    layers: [V2NoSram, M3]
    value: 0.0
    params:
      op: uncovered
  - id: V2.M3.AUX.2
    check: max_enclosure
    layers: [M3, V2NoSram]
    value: 0.0
    params:
      sides: opposite
