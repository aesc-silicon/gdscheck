# V2, the via from M2 to M3 (DRM section 3.13).  V1.M1.EN.1's "5 & 2" is read as two
# rules under one id: 2 nm on a pair of opposite sides, and 5 nm on one side.
#
# Not checked: V2.S.3 and V2.S.4 (see V2.S.2).
# SRAM applicability: see hardening/asap7/sram-scope.tsv and the PDK documentation.
rules:
  - id: V2.W.1
    check: min_width
    layers: [V2NoSram]
    value: 0.018
  - id: V2.S.1
    check: min_space
    layers: [V2NoSram]
    value: 0.018
  # The loosest of the corner-to-corner spacings V2.S.2-4, which differ by
  # whether each via has a 5 nm M3 end-cap: that is not told apart here, so a
  # pair between 23 and 30 nm corner to corner is not read.
  - id: V2.S.2
    check: min_space
    layers: [V2NoSram]
    value: 0.023
    params:
      facing: none
  - id: V2.M2.EN.1
    check: min_enclosure
    layers: [M2, V2NoSram]
    value: 0.005
    params:
      sides: opposite
  - id: V2.M3.EN.2
    check: min_enclosure
    layers: [M3, V2NoSram]
    value: 0.005
    params:
      sides: any
  - id: V2.AUX.1
    check: forbidden
    layers: [V2NoSram, M2]
    value: 0.0
    params:
      op: uncovered
  - id: V2.AUX.1
    check: forbidden
    layers: [V2NoSram, M3]
    value: 0.0
    params:
      op: uncovered
  - id: V2.M3.AUX.2
    check: max_enclosure
    layers: [M3, V2NoSram]
    value: 0.0
    params:
      sides: opposite
