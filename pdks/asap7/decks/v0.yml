# V0, the via from LIG and LISD to M1 (DRM section 3.11).
#
# A "(5 & 5) | (5 & 0)" enclosure - 5 nm on two opposite sides, or on one - is 5 nm on
# one side at least, `sides: any`; "the same width as M1" is a pair of opposite sides
# flush with the wire, `max_enclosure` of nothing on `sides: opposite`.
#
# Not checked: V0.LIG.AUX.2 (the local LIG length direction).
# S.1 checks the 18 nm minimum only; its 27 nm unaligned parallel-track case
# still needs track-aware classification.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V0.W.1
    check: min_width
    layers: [V0NoSram]
    value: 0.018
  - id: V0.S.1
    check: min_space
    layers: [V0NoSram]
    value: 0.018
  - id: V0.S.2
    check: min_space
    layers: [V0NoSram]
    value: 0.023
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 2
  - id: V0.S.3
    check: min_space
    layers: [V0NoSram]
    value: 0.030
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 0
  - id: V0.S.4
    check: min_space
    layers: [V0NoSram]
    value: 0.027
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 1
  - id: V0.M1.EN.1
    check: min_enclosure
    layers: [M1, V0NoSram]
    value: 0.005
    params:
      sides: any
  - id: V0.LISD.EN.2
    check: min_enclosure
    layers: [LISD, V0OnLisdOnly]
    value: 0.003
    params:
      sides: opposite
  # Read the actual overlap, allowing the remainder of the via to protrude.
  # The clipped side has zero margin; the two lateral sides must both reach 3 nm.
  - id: V0.LISD.EN.3
    check: min_enclosure
    layers: [LISD, V0PartialLisdArea]
    value: 0.003
    params:
      sides: opposite
  # The via reaches 1 nm past an LIG narrower than itself on the two sides the LIG
  # runs through.  Only the LIG walls inside the via are read, and a via flush with
  # the end of a wider LIG - which the libraries draw - has none but the flush one.
  - id: V0.LIG.EN.4
    check: min_enclosure
    layers: [V0OnLigOffLisd, LIG]
    value: 0.001
    params:
      interacting_only: 1
      skip_coincident: 1
  - id: V0.LIG.A.1
    check: min_area
    layers: [V0OnLigArea]
    value: 0.000288
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffM1]
    value: 0.0
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffLisdLig]
    value: 0.0
  - id: V0.M1.AUX.3
    check: max_enclosure
    layers: [M1, V0NoSram]
    value: 0.0
    params:
      sides: opposite
