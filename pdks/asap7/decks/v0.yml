# V0, the via from LIG and LISD to M1 (DRM section 3.11).
#
# A "(5 & 5) | (5 & 0)" enclosure - 5 nm on two opposite sides, or on one - is 5 nm on
# one side at least, `sides: any`; "the same width as M1" is a pair of opposite sides
# flush with the wire, `max_enclosure` of nothing on `sides: opposite`.
#
# Not checked: V0.S.3 and V0.S.4 (see V0.S.2); V0.LISD.EN.3, the enclosure of a V0 only
# partly on its LISD; and V0.LIG.AUX.2.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V0.W.1
    check: min_width
    layers: [V0NoSram]
    value: 0.018
  - id: V0.S.1
    check: min_space
    layers: [V0NoSram]
    value: 0.018
  # The loosest of the corner-to-corner spacings V0.S.2-4, which differ by
  # whether each via has a 5 nm M1 end-cap: that is not told apart here, so a
  # pair between 23 and 30 nm corner to corner is not read.
  - id: V0.S.2
    check: min_space
    layers: [V0NoSram]
    value: 0.023
    params:
      facing: none
  - id: V0.M1.EN.1
    check: min_enclosure
    layers: [M1, V0NoSram]
    value: 0.005
    params:
      sides: any
  - id: V0.LISD.EN.2
    check: min_enclosure
    layers: [LISD, V0OnLisdOnly]
    value: 0.003
    params:
      sides: opposite
  # The via reaches 1 nm past an LIG narrower than itself on the two sides the LIG
  # runs through.  Only the LIG walls inside the via are read, and a via flush with
  # the end of a wider LIG - which the libraries draw - has none but the flush one.
  - id: V0.LIG.EN.4
    check: min_enclosure
    layers: [V0OnLigOffLisd, LIG]
    value: 0.001
    params:
      interacting_only: 1
      skip_coincident: 1
  - id: V0.LIG.A.1
    check: min_area
    layers: [V0OnLigArea]
    value: 0.000288
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffM1]
    value: 0.0
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffLisdLig]
    value: 0.0
  - id: V0.M1.AUX.3
    check: max_enclosure
    layers: [M1, V0NoSram]
    value: 0.0
    params:
      sides: opposite
