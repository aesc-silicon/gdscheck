# V0, the via from LIG and LISD to M1 (DRM section 3.11).
#
# A "(5 & 5) | (5 & 0)" enclosure - 5 nm on two opposite sides, or on one - is 5 nm on
# one side at least, `sides: any`; "the same width as M1" is a pair of opposite sides
# flush with the wire, `max_enclosure` of nothing on `sides: opposite`.
#
# Against the tech LEF (LambdaPDK `asap7_tech.lef`, the ASAP7 1x tech LEF): `LAYER V0`
# states only its width and spacing, nothing of V0.M1.AUX.3's M1 as wide as the via
# (absent) - so a router's M1 pad landing over a cell's V0 may widen it.
#
# V0.LIG.AUX.2 - no V0 edge along the LIG may lie inside or touch it - asks, by DRM
# figure 3.11.2(c), that the V0 cross its LIG: then the V0 off the LIG is two pieces,
# one either side, whichever way the LIG runs.
# S.1 reads vias that face each other, on one track or on neighbouring tracks
# overlapping in projection: 18 nm. Vias on neighbouring tracks that don't overlap
# meet corner to corner, which S.2-S.4 read by end-cap (23/30/27 nm); S.1's 27 nm
# for that case is S.4's value.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V0.W.1
    check: min_width
    layers: [V0NoSram]
    value: 0.018
  - id: V0.S.1
    check: min_space
    layers: [V0NoSram]
    value: 0.018
  - id: V0.S.2
    check: min_space
    layers: [V0NoSram]
    value: 0.023
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 2
  - id: V0.S.3
    check: min_space
    layers: [V0NoSram]
    value: 0.030
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 0
  - id: V0.S.4
    check: min_space
    layers: [V0NoSram]
    value: 0.027
    layer_params:
      corner_cover: M1Endcap5
    params:
      facing: none
      covered_corners: 1
  - id: V0.M1.EN.1
    check: min_enclosure
    layers: [M1, V0NoSram]
    value: 0.005
    params:
      sides: any
  - id: V0.LISD.EN.2
    check: min_enclosure
    layers: [LISD, V0OnLisdOnly]
    value: 0.003
    params:
      sides: opposite
  # Read the actual overlap, allowing the remainder of the via to protrude.
  # The clipped side has zero margin; the two lateral sides must both reach 3 nm.
  - id: V0.LISD.EN.3
    check: min_enclosure
    layers: [LISD, V0PartialLisdArea]
    value: 0.003
    params:
      sides: opposite
  # The via reaches 1 nm past an LIG narrower than itself on the two sides the LIG
  # runs through.  Only the LIG walls inside the via are read, and a via flush with
  # the end of a wider LIG - which the libraries draw - has none but the flush one.
  - id: V0.LIG.EN.4
    check: min_enclosure
    layers: [V0OnLigOffLisd, LIG]
    value: 0.001
    params:
      interacting_only: 1
      skip_coincident: 1
  - id: V0.LIG.A.1
    check: min_area
    layers: [V0OnLigArea]
    value: 0.000288
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffM1]
    value: 0.0
  - id: V0.AUX.1
    check: forbidden
    layers: [V0OffLisdLig]
    value: 0.0
  - id: V0.LIG.AUX.2
    check: forbidden
    layers: [V0NotCrossingLig]
    value: 0.0
  - id: V0.M1.AUX.3
    check: max_enclosure
    layers: [M1, V0NoSram]
    value: 0.0
    params:
      sides: opposite
    tech_lef: absent
