# M9 (DRM section 3.18).  The width grows with the line's length: a `length` of just under
# 400, 1200 and 1800 nm binds the wall pairs running at least that far.  The spacings
# M9.S.1-3 depend on the lengths of the two facing edges and read edge layers (see
# `virtual_layers` in pdk.yml); M9.S.4-8 on the width of the wider line, the `width` gate
# set a DBU under each bound so that it reads "at least".
rules:
  - id: M9.W.1
    check: min_width
    layers: [M9]
    value: 0.04
  - id: M9.W.2
    check: min_width
    layers: [M9]
    value: 0.06
    params:
      length: 0.39975
  - id: M9.W.3
    check: min_width
    layers: [M9]
    value: 0.08
    params:
      length: 1.19975
  - id: M9.W.4
    check: min_width
    layers: [M9]
    value: 0.12
    params:
      length: 1.79975
  - id: M9.W.5
    check: max_width
    layers: [M9]
    value: 2.0
  - id: M9.S.1
    check: min_space
    layers: [M9.long, M9.long]
    value: 0.04
  - id: M9.S.2
    check: min_space
    layers: [M9.short, M9.long]
    value: 0.043
  - id: M9.S.3
    check: min_space
    layers: [M9.short, M9.short]
    value: 0.046
  - id: M9.S.4
    check: min_space
    layers: [M9]
    value: 0.06
    params:
      width: 0.05975
  - id: M9.S.5
    check: min_space
    layers: [M9]
    value: 0.08
    params:
      width: 0.07975
  - id: M9.S.6
    check: min_space
    layers: [M9]
    value: 0.12
    params:
      width: 0.11975
  - id: M9.S.7
    check: min_space
    layers: [M9]
    value: 0.5
    params:
      width: 0.49975
  - id: M9.S.8
    check: min_space
    layers: [M9]
    value: 1.0
    params:
      width: 0.99975
  - id: M9.A.1
    check: min_area
    layers: [M9]
    value: 0.00752
  - id: M9.L.1
    check: min_edge_length
    layers: [M9.edges]
    value: 0.04
