# M6 (DRM section 3.16).  M6 routes horizontally: its width across the track and the space
# between tracks read the walls facing across y, its length and the tip-to-tip
# space those facing across x.
#
# Not checked: M6.W.3 and M6.W.4, a width that is an even multiple of the minimum;
# M6.S.4 and M6.S.5, the tip-to-tip space and the run two lines on adjacent tracks share;
# and M6.AUX.1, M6.AUX.2 and M6.AUX.4, the routing grid and tracks, which the manual
# places by an offset set per design.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: M6.W.1
    check: min_width
    layers: [M6NoSram]
    value: 0.032
    params:
      facing: y
  - id: M6.W.2
    check: max_width
    layers: [M6NoSram]
    value: 0.64
    params:
      # Apply facing even when the perpendicular dimension is smaller.
      span: any
      facing: y
  - id: M6.W.5
    check: min_width
    layers: [M6NoSram]
    value: 0.044
    params:
      facing: x
  - id: M6.S.1
    check: min_space
    layers: [M6NoSram]
    value: 0.032
    params:
      facing: y
  - id: M6.S.1
    check: min_notch
    layers: [M6NoSram]
    value: 0.032
    params:
      facing: y
  - id: M6.S.2
    check: min_space
    layers: [M6NoSram]
    value: 0.04
    params:
      facing: x
  - id: M6.S.2
    check: min_notch
    layers: [M6NoSram]
    value: 0.04
    params:
      facing: x
  # Two tips on adjacent tracks that share no run face each other nowhere.
  - id: M6.S.3
    check: min_space
    layers: [M6NoSram]
    value: 0.04
    params:
      facing: none
  - id: M6.AUX.3
    check: forbidden
    layers: [M6Bent]
    value: 0.0
