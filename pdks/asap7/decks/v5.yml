# V5, the via from M5 to M6 (DRM section 3.15).  V5.S.1, V5.S.2 and V5.S.3 - the
# same net, different nets, corner to corner - share one value, so one rule reads them all
# under V5.S.2.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V5.W.1
    check: exact_dim
    layers: [V5NoSram]
    value: 0.024
  - id: V5.S.2
    check: min_space
    layers: [V5NoSram]
    value: 0.033
  - id: V5.M5.EN.1
    check: min_enclosure
    layers: [M5, V5NoSram]
    value: 0.011
    params:
      sides: opposite
  - id: V5.M6.EN.2
    check: min_enclosure
    layers: [M6, V5NoSram]
    value: 0.011
    params:
      sides: opposite
  - id: V5.AUX.1
    check: forbidden
    layers: [V5NoSram, M5]
    value: 0.0
    params:
      op: uncovered
  - id: V5.AUX.1
    check: forbidden
    layers: [V5NoSram, M6]
    value: 0.0
    params:
      op: uncovered
  - id: V5.M6.AUX.2
    check: max_enclosure
    layers: [M6, V5NoSram]
    value: 0.0
    params:
      sides: opposite
