# NSELECT, PSELECT and the threshold-adjust layers SLVT, LVT and SRAMVT (DRM section 3.7).
# The manual states each rule for NSELECT and applies it to the other four layers; the
# ids here carry the layer each one reads.  An enclosure or extension reads the ACTIVE or
# GATE the layer covers, so a p-device outside NSELECT is PSELECT's business.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: NSELECT.W.1
    check: min_width
    layers: [NselectNoSram]
    value: 0.108
    params:
      facing: x
  - id: NSELECT.W.2
    check: min_width
    layers: [NselectNoSram]
    value: 0.054
    params:
      facing: y
  - id: NSELECT.ACTIVE.EN.1
    check: min_enclosure
    layers: [NSELECT, ActiveNoSram]
    value: 0.046
    params:
      facing: x
      interacting_only: 1
  - id: NSELECT.ACTIVE.EN.2
    check: min_enclosure
    layers: [NSELECT, ActiveNoSram]
    value: 0.027
    params:
      facing: y
      interacting_only: 1
  - id: SRAM.NSELECT.ACTIVE.EN.3
    check: min_enclosure
    layers: [NSELECT, ActiveSram]
    value: 0.0135
    params:
      facing: x
      interacting_only: 1
  - id: SRAM.NSELECT.ACTIVE.EN.4
    check: min_enclosure
    layers: [NSELECT, ActiveSram]
    value: 0.0135
    params:
      facing: y
      interacting_only: 1
  - id: NSELECT.GATE.EX.1
    check: min_enclosure
    layers: [NSELECT, GateNoCutNoSram]
    value: 0.007
    params:
      facing: x
      interacting_only: 1
