# M3 (DRM section 3.12).  The side, tip and tip-to-tip spacings read edge layers sorted
# by length (see `virtual_layers` in pdk.yml); M3.S.6 is the corner-to-corner space, read on
# the pairs that face each other nowhere under it.
#
# SRAM exemption (DRM convention 7): skip whole M3 polygons with positive-area overlap
# with SRAMDRC. Edge-only and point-only contact remain checked. Spacing is measured
# when neither polygon overlaps the marker.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: M3.W.1
    check: min_width
    layers: [M3NoSram]
    value: 0.018
  - id: M3.S.1
    check: min_space
    layers: [M3NoSram.long, M3NoSram.long]
    value: 0.018
  - id: M3.S.2
    check: min_space
    layers: [M3NoSram.short, M3NoSram.long]
    value: 0.025
  - id: M3.S.3
    check: min_space
    layers: [M3NoSram.mid, M3NoSram.mid]
    value: 0.027
  - id: M3.S.4
    check: min_space
    layers: [M3NoSram.tiny, M3NoSram.tiny]
    value: 0.031
  - id: M3.S.5
    check: min_space
    layers: [M3NoSram.mid, M3NoSram.tiny]
    value: 0.031
  - id: M3.S.6
    check: min_space
    layers: [M3NoSram]
    value: 0.02
    params:
      facing: none
  - id: M3.A.1
    check: min_area
    layers: [M3NoSram]
    value: 0.000504
