# The rules the ASAP7 tech LEF states more weakly than the manual, at the LEF's value:
# what a router driven by it keeps.  The `openroad` suite reads these in place of the
# manual's M1.S.6 and V6.S.2 (`tech_lef: weaker` in their decks); no other suite does.
#
# M1.S.6.LEF is M1's `LEF58_CORNERSPACING CONVEXCORNER CORNERONLY 0.01 WIDTH 0.018
# SPACING 0.018`, 18 nm corner to corner where the manual asks 20.  V6.S.2.LEF is V6's
# `LEF58_SPACINGTABLE ... DEFAULT 0.034`, 34 nm between cuts where the manual asks 45.
# SRAM applicability: as the rules they stand in for.
rules:
  - id: M1.S.6.LEF
    check: min_space
    layers: [M1NoSram]
    value: 0.018
    params:
      facing: none
  - id: V6.S.2.LEF
    check: min_space
    layers: [V6NoSram]
    value: 0.034
