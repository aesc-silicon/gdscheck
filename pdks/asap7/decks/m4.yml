# M4 (DRM section 3.14).  M4 routes horizontally: its width across the track and the space
# between tracks read the walls facing across y, its length and the tip-to-tip
# space those facing across x.
#
# The routing grid and tracks: AUX.1 reads every horizontal edge on the 24 nm grid, and
# AUX.2 and W.4 read a wire's centre on the tracks, two widths apart - a minimum-width
# wire lies on one, and a wider wire spans an odd number of them, which is the same wire
# centred on one.  The manual sets the grid's offset per design and defaults it to 0; a
# design routed on other tracks sets `offset` on AUX.1 to its grid's, and on AUX.2 and
# W.4 to its tracks' centreline, the grid's offset plus half a width.
#
# Two wires on adjacent tracks - their long walls facing across y with nothing routable
# between, under three widths (72 nm) - that run alongside at all run alongside for S.5's
# 44 nm, and their tips on one side are aligned or S.4's 40 nm apart (DRM fig. 3.14.2(d)).
# Two that do not run alongside are S.3's corner.
#
# Not checked: M4.AUX.4, a wide wire's outside edge on a track's edge.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: M4.W.1
    check: min_width
    layers: [M4NoSram]
    value: 0.024
    params:
      facing: y
  - id: M4.W.2
    check: max_width
    layers: [M4NoSram]
    value: 0.48
    params:
      # Apply facing even when the perpendicular dimension is smaller.
      span: any
      facing: y
  - id: M4.W.3
    check: forbidden
    layers: [M4EvenWidthEdges]
    value: 0.0
  - id: M4.W.4
    check: offtrack
    layers: [M4Wide]
    value: 0.048
    params:
      facing: y
      offset: 0.012
  - id: M4.W.5
    check: min_width
    layers: [M4NoSram]
    value: 0.044
    params:
      facing: x
  - id: M4.S.1
    check: min_space
    layers: [M4NoSram]
    value: 0.024
    params:
      facing: y
  - id: M4.S.1
    check: min_notch
    layers: [M4NoSram]
    value: 0.024
    params:
      facing: y
  - id: M4.S.2
    check: min_space
    layers: [M4NoSram]
    value: 0.04
    params:
      facing: x
  - id: M4.S.2
    check: min_notch
    layers: [M4NoSram]
    value: 0.04
    params:
      facing: x
  # Two tips on adjacent tracks that share no run face each other nowhere.
  - id: M4.S.3
    check: min_space
    layers: [M4NoSram]
    value: 0.04
    params:
      facing: none
  - id: M4.S.4
    check: min_tip_stagger
    layers: [M4NoSram]
    value: 0.04
    params:
      facing: y
      within: 0.072
  - id: M4.S.5
    check: min_track_run
    layers: [M4NoSram]
    value: 0.044
    params:
      facing: y
      within: 0.072
  - id: M4.AUX.1
    check: offgrid
    layers: [M4NoSram]
    value: 0.024
    params:
      facing: y
      offset: 0.0
  - id: M4.AUX.2
    check: offtrack
    layers: [M4Track]
    value: 0.048
    params:
      facing: y
      offset: 0.012
  - id: M4.AUX.3
    check: forbidden
    layers: [M4Bent]
    value: 0.0
