# V3, the via from M3 to M4 (DRM section 3.13).
#
# Corner spacing reads the end-cap at the two corners forming the gap.
# S.1 reads vias that face each other, on one track or on neighbouring tracks
# overlapping in projection: 18 nm. Vias on neighbouring tracks that don't overlap
# meet corner to corner, which S.2-S.4 read by end-cap (23/30/27 nm); S.1's 27 nm
# for that case is S.4's value.
# SRAM applicability: see docs/source/pdks/asap7.rst.
rules:
  - id: V3.W.1
    check: min_width
    layers: [V3NoSram]
    value: 0.018
  - id: V3.S.1
    check: min_space
    layers: [V3NoSram]
    value: 0.018
  - id: V3.S.2
    check: min_space
    layers: [V3NoSram]
    value: 0.023
    layer_params:
      corner_cover: M4Endcap5
    params:
      facing: none
      covered_corners: 2
  - id: V3.S.3
    check: min_space
    layers: [V3NoSram]
    value: 0.030
    layer_params:
      corner_cover: M4Endcap5
    params:
      facing: none
      covered_corners: 0
  - id: V3.S.4
    check: min_space
    layers: [V3NoSram]
    value: 0.027
    layer_params:
      corner_cover: M4Endcap5
    params:
      facing: none
      covered_corners: 1
  - id: V3.M3.EN.1
    check: min_enclosure
    layers: [M3, V3NoSram]
    value: 0.005
    params:
      sides: opposite
  - id: V3.M4.EN.2
    check: min_enclosure
    layers: [M4, V3NoSram]
    value: 0.011
    params:
      sides: opposite
  - id: V3.AUX.1
    check: forbidden
    layers: [V3NoSram, M3]
    value: 0.0
    params:
      op: uncovered
  - id: V3.AUX.1
    check: forbidden
    layers: [V3NoSram, M4]
    value: 0.0
    params:
      op: uncovered
  - id: V3.M4.AUX.2
    check: max_enclosure
    layers: [M4, V3NoSram]
    value: 0.0
    params:
      sides: opposite
