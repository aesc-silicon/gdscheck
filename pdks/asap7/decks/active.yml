# ACTIVE (DRM section 3.5).  SRAM rules are the ones prefixed SRAM, read on the ACTIVE
# that interacts with SRAMDRC; the rest read the ACTIVE that does not.
#
# Not checked: ACTIVE.W.2, the vertical width as a whole multiple of 27 nm; ACTIVE.S.2A,
# 92 nm between source/drain regions on different nets, which needs nets on ACTIVE; and
# ACTIVE.LUP.1, the 30 um latch-up reach from a device to its tap.
# SRAM applicability: see hardening/asap7/sram-scope.tsv and the PDK documentation.
rules:
  - id: ACTIVE.FIN.EX.1
    check: min_enclosure
    layers: [ACTIVE, FinNoSram]
    value: 0.01
    params:
      facing: y
      interacting_only: 1
  - id: ACTIVE.W.1
    check: min_width
    layers: [ActiveNoSram]
    value: 0.027
    params:
      facing: y
  - id: ACTIVE.W.3
    check: min_width
    layers: [ActiveNoSram]
    value: 0.016
    params:
      facing: x
  - id: ACTIVE.S.1
    check: min_space
    layers: [ActiveNoSram]
    value: 0.027
    params:
      facing: y
  - id: ACTIVE.S.2B
    check: min_space
    layers: [ActiveNoSram]
    value: 0.038
    params:
      facing: x
  - id: ACTIVE.S.2B
    check: min_notch
    layers: [ActiveNoSram]
    value: 0.038
    params:
      facing: x
  - id: ACTIVE.WELL.S.4
    check: min_space
    layers: [ActiveNoSram, NWELL]
    value: 0.027
  - id: SRAM.ACTIVE.WELL.S.5
    check: min_space
    layers: [ActiveSram, NWELL]
    value: 0.0135
  - id: ACTIVE.WELL.EN.1
    check: min_enclosure
    layers: [NWELL, ActiveNoSram]
    value: 0.027
    params:
      interacting_only: 1
  - id: SRAM.ACTIVE.WELL.EN.2
    check: min_enclosure
    layers: [NWELL, ActiveSram]
    value: 0.0135
    params:
      interacting_only: 1
  - id: ACTIVE.A.1A
    check: min_area
    layers: [ActiveNoSram]
    value: 0.000864
  - id: ACTIVE.A.1B
    check: min_area
    layers: [ActiveNoSram]
    value: 0.000864
    params:
      scope: hole
  - id: SRAM.ACTIVE.A.2A
    check: min_area
    layers: [ActiveSram]
    value: 0.000432
  - id: SRAM.ACTIVE.A.2B
    check: min_area
    layers: [ActiveSram]
    value: 0.000432
    params:
      scope: hole
  - id: ACTIVE.AUX.1
    check: forbidden
    layers: [ActiveNoSram, NSELECT, PSELECT]
    value: 0.0
    params:
      op: uncovered
  - id: ACTIVE.AUX.1
    check: forbidden
    layers: [ActiveOnSelectEdge]
    value: 0.0
  - id: SRAM.ACTIVE.AUX.2
    check: forbidden
    layers: [ActiveAbutSram]
    value: 0.0
  # No notch along the vertical axis at all: 1 um is past any notch a cell holds.
  - id: ACTIVE.AUX.3
    check: min_notch
    layers: [ActiveNoSram]
    value: 1.0
    params:
      facing: y
