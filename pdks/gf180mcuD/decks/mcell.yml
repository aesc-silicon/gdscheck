# Memory cell marker.  All four rules.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 22 of 23 logical violations, 2 false positives.
rules:
  - id: MC.1
    check: min_width
    layers: [mcell_feol_mk]
    value: 0.4
  - id: MC.2
    check: min_space
    layers: [mcell_feol_mk]
    value: 0.4
  - id: MC.2
    check: min_notch
    layers: [mcell_feol_mk]
    value: 0.4
  - id: MC.3
    check: min_area
    layers: [mcell_feol_mk]
    value: 0.35
  - id: MC.4
    check: min_enclosed_area
    layers: [mcell_feol_mk]
    value: 0.35
