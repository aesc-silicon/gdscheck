    check: min_enclosure
    layers: [poly_mdn, mvsd]
    value: 0.6
    params:
      interacting_only: 1
  - id: MDN.5ai
    check: min_space
    layers: [pcomp_mdn5ai, mvsd]
    value: 1.0
  - id: MDN.5ai
    check: nonempty
    layers: [mdn5ai_touch]
    value: 0.0
