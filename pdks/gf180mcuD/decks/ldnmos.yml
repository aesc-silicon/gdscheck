# LDMOS NFET.  24 of the 35 rules in this section.
#
# The HV device is recognised by LDMOS_XTOR over Dualgate, with MVSD marking the drain.
#
# Eleven rules are not ported, and they cluster into three kinds:
#
#   MDN.3b, MDN.4a, MDN.4b, MDN.10b   Channel length and width, and the poly extension
#                                     in the width direction, all measured between edge
#                                     subsets picked with inside_part/outside_part.
#   MDN.10f, MDN.13b, MDN.13c, MDN.13d
#                                     Selection by interaction *count* -
#                                     `interacting(other, 2, 2)` and friends - which
#                                     this engine's boolean selectors cannot express.
#   MDN.5c, MDN.10c, MDN.10d, MDN.11, MDN.12
#                                     `.drc(...)` expressions over sized-and-extented
#                                     regions, and `enclosed(..., transparent)`.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 494 of 837, 7 false positives (1 by tools/unmatched-markers.py).  MDN.3a, MDN.7a, MDN.13a and
# MDN.15b are exact; MDN.17 is within one of the reference's 62.  Most of the 351 misses belong to the eleven rules above.
rules:
  - id: MDN.1
    check: min_width
    layers: [mvsd]
    value: 1.0
  # MDN.2a is the same-potential minimum, MDN.2b the different-potential one.
  - id: MDN.2a
    check: min_space
    layers: [mvsd]
    value: 1.0
  - id: MDN.2a
    check: min_notch
    layers: [mvsd]
    value: 1.0
  - id: MDN.2b
    check: min_space_different_net
    layers: [mvsd]
    value: 2.0
  - id: MDN.3a
    check: min_enclosure
    layers: [poly_mdn, mvsd]
    value: 0.6
    params:
      interacting_only: 1
  # MDN.5a: the body tap must keep clear of the drain, and may not touch it at all.
  # The limit is looser when tap and source are butted.
  - id: MDN.5ai
    check: min_space
    layers: [pcomp_mdn5ai, mvsd]
    value: 1.0
  - id: MDN.5ai
    check: nonempty
    layers: [mdn5ai_touch]
    value: 0.0
  - id: MDN.5aii
    check: min_space
    layers: [pcomp_mdn5aii, mvsd]
    value: 0.92
  - id: MDN.5aii
    check: nonempty
    layers: [mdn5aii_touch]
    value: 0.0
  - id: MDN.5b
    check: min_space
    layers: [ldnmos_source, pcomp_mdn]
    value: 0.4
  - id: MDN.5b
    check: nonempty
    layers: [mdn5b_touch]
    value: 0.0
  # MDN.6 / MDN.7 / MDN.7a: the marker layers must cover the device and each other.
  - id: MDN.6
    check: nonempty
    layers: [mdn6_viol]
    value: 0.0
  - id: MDN.6a
    check: min_enclosure
    layers: [dualgate, ncomp_ld]
    value: 0.5
    params:
      interacting_only: 1
  # MDN.7a has two terms: dualgate reaching outside the marker, and dualgate over the
  # drain outside it.
  - id: MDN.7a
    check: nonempty
    layers: [mdn7a_viol]
    value: 0.0
  - id: MDN.7a
    check: nonempty
    layers: [mdn7a_viol_b]
    value: 0.0
  # MDN.8: drain to N-well, split by potential; plus "may not overlap one at all".
  - id: MDN.8a
    check: min_space
    layers: [mvsd, nwell]
    value: 1.0
  - id: MDN.8a
    check: nonempty
    layers: [mvsd_on_nwell]
    value: 0.0
  - id: MDN.8b
    check: min_space_different_net
    layers: [mvsd, nwell]
    value: 2.0
  - id: MDN.9
    check: min_space
    layers: [mvsd_mdn, ncomp_not_mvsd]
    value: 4.0
  - id: MDN.10a
    check: min_width
    layers: [poly_mdn10]
    value: 1.2
  - id: MDN.10ei
    check: min_space
    layers: [poly_mdn10, pcomp_not_ncomp]
    value: 0.4
  - id: MDN.10ei
    check: nonempty
    layers: [mdn10ei_touch]
    value: 0.0
  - id: MDN.10eii
    check: min_space
    layers: [poly_mdn10, pcomp_at_ncomp]
    value: 0.32
  # Max single finger width: upstream measures the poly run with `drc(length > 50)`.
  - id: MDN.13a
    check: max_length
    layers: [ldnmos_body]
    value: 50.0
  - id: MDN.14
    check: min_space
    layers: [mvsd, dnwell]
    value: 6.0
  - id: MDN.14
    check: nonempty
    layers: [mvsd_on_dnwell]
    value: 0.0
  - id: MDN.15a
    check: min_width
    layers: [ncomp_drain]
    value: 0.22
  - id: MDN.15b
    check: nonempty
    layers: [mdn15b_viol]
    value: 0.0
  # MDN.17 is a recommendation, not a hard rule: the device should sit inside a
  # non-broken P-substrate guard ring.
  - id: MDN.17
    check: nonempty
    layers: [mdn17_viol_a]
    value: 0.0
  - id: MDN.17
    check: nonempty
    layers: [mdn17_viol_b]
    value: 0.0
