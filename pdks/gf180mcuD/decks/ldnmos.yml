# LDMOS NFET.  33 of the 35 rules in this section.
#
# Not ported: MDN.10d, MDN.5c.
#
# Known: MDN.10f reports one region the reference does not.
rules:
  - id: MDN.1
    check: min_width
    layers: [mvsd]
    value: 1.0
  # The equi-potential half of the pair: a gap between two drifts on different nodes is
  # MDN.2b's, at its own larger value, and was reported under both ids (report,
  # finding 2).
  - id: MDN.2a
    check: min_space
    layers: [mvsd]
    value: 1.0
    params:
      net: same
  - id: MDN.2a
    check: min_notch
    layers: [mvsd]
    value: 1.0
  - id: MDN.2b
    check: min_space
    layers: [mvsd]
    value: 2.0
    params:
      net: different
  - id: MDN.3a
    check: min_enclosure
    layers: [poly_mdn, mvsd]
    value: 0.6
    params:
      interacting_only: 1
  - id: MDN.3b
    check: max_gate_length
    layers: [ldnmos_body, ncomp]
    value: 20.0
    params:
      walls: unshared
  - id: MDN.4a
    check: forbidden
    layers: [mdn4a_viol]
    value: 0.0
  - id: MDN.4b
    check: max_gate_length
    layers: [ldnmos_body, ncomp]
    value: 50.0
  - id: MDN.5ai
    check: min_space
    layers: [pcomp_mdn5ai, mvsd]
    value: 1.0
  - id: MDN.5ai
    check: forbidden
    layers: [mdn5ai_touch]
    value: 0.0
  - id: MDN.5aii
    check: min_space
    layers: [pcomp_mdn5aii, mvsd]
    value: 0.92
  - id: MDN.5aii
    check: forbidden
    layers: [mdn5aii_touch]
    value: 0.0
  - id: MDN.5b
    check: min_space
    layers: [ldnmos_source, pcomp_mdn]
    value: 0.4
  - id: MDN.5b
    check: forbidden
    layers: [mdn5b_touch]
    value: 0.0
  - id: MDN.6
    check: forbidden
    layers: [mdn6_viol]
    value: 0.0
  - id: MDN.6a
    check: min_enclosure
    layers: [dualgate, ncomp_ld]
    value: 0.5
    params:
      interacting_only: 1
  - id: MDN.7
    check: forbidden
    layers: [mdn7_viol]
    value: 0.0
  - id: MDN.7a
    check: forbidden
    layers: [mdn7a_viol]
    value: 0.0
  - id: MDN.7a
    check: forbidden
    layers: [mdn7a_viol_b]
    value: 0.0
  - id: MDN.8a
    check: min_space
    layers: [mvsd, nwell]
    value: 1.0
  - id: MDN.8a
    check: forbidden
    layers: [mvsd_on_nwell]
    value: 0.0
  - id: MDN.8b
    check: min_space
    layers: [mvsd, nwell]
    value: 2.0
    params:
      net: different
  - id: MDN.9
    check: min_space
    layers: [mvsd_mdn, ncomp_not_mvsd]
    value: 4.0
  - id: MDN.10a
    check: min_width
    layers: [poly_mdn10]
    value: 1.2
  - id: MDN.10b
    check: min_enclosure
    layers: [poly_mdn10.edges, mdn10b_edges]
    value: 0.4
  - id: MDN.10c
    check: forbidden
    layers: [mdn10c_viol]
    value: 0.0
  - id: MDN.10ei
    check: min_space
    layers: [poly_mdn10, pcomp_not_ncomp]
    value: 0.4
  - id: MDN.10ei
    check: forbidden
    layers: [mdn10ei_touch]
    value: 0.0
  - id: MDN.10eii
    check: min_space
    layers: [poly_mdn10, pcomp_at_ncomp]
    value: 0.32
  - id: MDN.10f
    check: forbidden
    layers: [mdn10f_interconnect]
    value: 0.0
  - id: MDN.10f
    check: forbidden
    layers: [mdn10f_reaching_out]
    value: 0.0
  - id: MDN.11
    check: min_width
    layers: [mdn11_uniform]
    value: 0.4
  - id: MDN.11
    check: forbidden
    layers: [mdn11_wide]
    value: 0.0
  - id: MDN.11
    check: forbidden
    layers: [mdn11_no_channel]
    value: 0.0
  - id: MDN.12
    check: forbidden
    layers: [mdn12_viol]
    value: 0.0
  - id: MDN.13a
    check: max_length
    layers: [ldnmos_body]
    value: 50.0
  - id: MDN.13b
    check: forbidden
    layers: [mdn13b_viol]
    value: 0.0
  - id: MDN.13c
    check: forbidden
    layers: [mdn13c_viol]
    value: 0.0
  - id: MDN.13d
    check: forbidden
    layers: [mdn13d_viol]
    value: 0.0
  - id: MDN.14
    check: min_space
    layers: [mvsd, dnwell]
    value: 6.0
  - id: MDN.14
    check: forbidden
    layers: [mvsd_on_dnwell]
    value: 0.0
  - id: MDN.15a
    check: min_width
    layers: [ncomp_drain]
    value: 0.22
  - id: MDN.15b
    check: forbidden
    layers: [mdn15b_viol]
    value: 0.0
  - id: MDN.17
    check: forbidden
    layers: [mdn17_viol_a]
    value: 0.0
  - id: MDN.17
    check: forbidden
    layers: [mdn17_viol_b]
    value: 0.0
