# Guard ring.  Every rule of section 12.4 this variant has: the table's two columns are
# "Solder Bump" and "Other Cases", and the deck reads the second throughout - GR.11 fires
# on a *missing* pad opening, which is what that column requires, and GR.5 has no value
# there ("-").  GR.9 and GR.10 carry the manual's own asterisk, Appendix B.
