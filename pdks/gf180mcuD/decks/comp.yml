# Active area (COMP).  All 44 rules in this section.
rules:
  - id: DF.1a_LV
    check: min_width
    layers: [comp_3p3v]
    value: 0.22
  - id: DF.1a_MV
    check: min_width
    layers: [comp_56v_no_mv]
    value: 0.3
  - id: DF.1c
    check: min_width
    layers: [comp_moscap]
    value: 1.0

  - id: DF.2a_LV
    check: min_edge_length
    layers: [channel_edges_3p3v]
    value: 0.22
  - id: DF.2a_MV
    check: min_edge_length
    layers: [channel_edges_56v]
    value: 0.3
  - id: DF.2b
    check: forbidden
    layers: [comp_over_100um]
    value: 0.0

  - id: DF.3a_LV
    check: min_space
    layers: [comp_3p3v_no_otp]
    value: 0.28
  - id: DF.3a_LV
    check: min_notch
    layers: [comp_3p3v_no_otp]
    value: 0.28
  - id: DF.3a_MV
    check: min_space
    layers: [comp_56v_no_otp]
    value: 0.36
  - id: DF.3a_MV
    check: min_notch
    layers: [comp_56v_no_otp]
    value: 0.36
  # A space between a 5 V shape and a 3.3 V one is on neither voltage layer and was
  # measured by nobody; the stricter of the two values applies to it, as it does to
  # every pair the 5 V shape is part of.
  - id: DF.3a_MV
    check: min_space
    layers: [comp_56v_no_otp, comp_3p3v_no_otp]
    value: 0.36
  - id: DF.3b
    check: forbidden
    layers: [df3b_viol]
    value: 0.0
  - id: DF.3c_LV
    check: min_space
    layers: [comp_3p3v_bjt]
    value: 0.32
  - id: DF.3c_LV
    check: min_notch
    layers: [comp_3p3v_bjt]
    value: 0.32
  - id: DF.3c_MV
    check: forbidden
    layers: [df3c_viol]
    value: 0.0

  - id: DF.4a_LV
    check: min_space
    layers: [ntap_dn3p3v, lvpwell_dn3p3v]
    value: 0.12
  - id: DF.4a_MV
    check: min_space
    layers: [ntap_dn56v, lvpwell_dn56v]
    value: 0.16
  - id: DF.4b_LV
    check: min_enclosure
    layers: [dnwell_3p3v, ntap_dn3p3v]
    value: 0.62
    params:
      metric: euclidian
  - id: DF.4b_MV
    check: min_enclosure
    layers: [dnwell_56v, ntap_dn56v]
    value: 0.66
    params:
      metric: euclidian
  - id: DF.4c_LV
    check: min_enclosure
    layers: [nw_ndn_sram_3p3v, df4c_pcomp3p3v]
    value: 0.43
  - id: DF.4c_MV
    check: min_enclosure
    layers: [nwell_n_dn_no_sram, df4c_pcomp56v]
    value: 0.6
  - id: DF.4d_LV
    check: min_enclosure
    layers: [df4d_nwell, df4d_ncomp3p3v]
    value: 0.12
  - id: DF.4d_MV
    check: min_enclosure
    layers: [df4d_nwell, df4d_ncomp56v]
    value: 0.16
  - id: DF.4e_LV
    check: min_enclosure
    layers: [dnwell_3p3v, pcomp_dn3p3v]
    value: 0.93
  - id: DF.4e_MV
    check: min_enclosure
    layers: [dnwell_56v, pcomp_dn56v]
    value: 1.1

  - id: DF.5_LV
    check: min_enclosure
    layers: [lvpwell_dn3p3v, ptap_lvpwell_dn3p3v]
    value: 0.12
  - id: DF.5_MV
    check: min_enclosure
    layers: [lvpwell_dn56v, ptap_lvpwell_dn56v]
    value: 0.16

  - id: DF.6_LV
    check: min_enclosure
    layers: [df6_comp3p3v, df6_poly]
    value: 0.24
    params:
      interacting_only: 1
  - id: DF.6_MV
    check: min_enclosure
    layers: [df6_comp56v, df6_poly]
    value: 0.4
    params:
      interacting_only: 1

  - id: DF.7_LV
    check: min_space
    layers: [pcomp_dn3p3v, lvpwell_dn3p3v]
    value: 0.43
  - id: DF.7_MV
    check: min_space
    layers: [pcomp_dn56v_no_sram, lvpwell_dn56v]
    value: 0.6

  - id: DF.8_LV
    check: min_enclosure
    layers: [lvpwell_dn3p3v, df8_ncomp3p3v]
    value: 0.43
  - id: DF.8_MV
    check: min_enclosure
    layers: [lvpwell_dn56v, df8_ncomp56v]
    value: 0.6

  - id: DF.9
    check: min_area
    layers: [comp_no_otp]
    value: 0.2025

  - id: DF.10
    check: min_area
    layers: [comp_field]
    value: 0.26

  # The rule bounds the *length of the butting edge*, the N+/P+ boundary inside the
  # COMP, not the width of the active carrying it: a 0.25 µm wide active with a 2 µm
  # butting edge is legal and was reported (report, comp finding 8).
  - id: DF.11
    check: min_edge_length
    layers: [df11_butting_edges]
    value: 0.3

  - id: DF.12
    check: forbidden
    layers: [comp_no_implant]
    value: 0.0

  # The reach is confined to the N-region the rule is about, which is the drawn well
  # *or* the deep well's N part - the same `all_nwell` the target is derived from.
  # Confined to the drawn well alone, a source/drain in a deep well could never be
  # answered for by its tap three microns away (report, comp finding 11).
  - id: DF.13_LV
    check: max_space
    layers: [pactive_3p3v, ntap]
    value: 20.0
    params:
      scope: polygon
      reach: round
    layer_params:
      within: all_nwell
  - id: DF.13_MV
    check: max_space
    layers: [pactive_56v, ntap]
    value: 15.0
    params:
      scope: polygon
      reach: round
    layer_params:
      within: all_nwell
  - id: DF.14_LV
    check: max_space
    layers: [nactive_3p3v, ptap]
    value: 20.0
    params:
      scope: polygon
      reach: round
  - id: DF.14_MV
    check: max_space
    layers: [nactive_56v, ptap]
    value: 15.0
    params:
      scope: polygon
      reach: round

  - id: DF.16_LV
    check: min_space
    layers: [df16_ncomp_lv, nwell_n_dn3p3v_no_ymtp]
    value: 0.43
  - id: DF.16_MV
    check: min_space
    layers: [df16_ncomp_mv, nwell_n_dn56v_no_ymtp]
    value: 0.6
  # The two unlike-voltage pairings, at the stricter value.
  - id: DF.16_MV
    check: min_space
    layers: [df16_ncomp_mv, nwell_n_dn3p3v_no_ymtp]
    value: 0.6
  - id: DF.16_MV
    check: min_space
    layers: [df16_ncomp_lv, nwell_n_dn56v_no_ymtp]
    value: 0.6

  # A P+ tap butted against the well it sits beside is nothing away from it, which is
  # under every value: `abutting: report` (the settled reading since IHP's NW.d).
  - id: DF.17_LV
    check: min_space
    layers: [df17_pcomp_lv, nwell_n_dn3p3v]
    value: 0.12
    params:
      abutting: report
  - id: DF.17_MV
    check: min_space
    layers: [df17_pcomp_mv, nwell_n_dn56v]
    value: 0.16
    params:
      abutting: report
  # The two unlike-voltage pairings, at the stricter value.
  - id: DF.17_MV
    check: min_space
    layers: [df17_pcomp_mv, nwell_n_dn3p3v]
    value: 0.16
    params:
      abutting: report
  - id: DF.17_MV
    check: min_space
    layers: [df17_pcomp_lv, nwell_n_dn56v]
    value: 0.16
    params:
      abutting: report

  - id: DF.18
    check: min_space
    layers: [pcomp_out_nw_dn, dnwell]
    value: 2.5

  - id: DF.19_LV
    check: min_space
    layers: [df16_ncomp_lv_all, dnwell]
    value: 3.2
  - id: DF.19_MV
    check: min_space
    layers: [df16_ncomp_mv_all, dnwell]
    value: 3.28
