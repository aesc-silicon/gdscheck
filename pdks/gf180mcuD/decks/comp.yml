# Active area (COMP).  Ported from
# libs.tech/klayout/tech/drc/rule_decks/comp.rb.
#
# As in the nwell deck, most rules come in an _LV and an _MV form, splitting on
# whether the COMP touches v5_xtor/dualgate anywhere.  DF.1b_LV and DF.1b_MV are not
# DRC checks upstream, and DF.15 does not exist.
#
# Six of the 44 rules are deliberately not ported; each needs something the engine
# does not have yet, and a rule that silently matches nothing is worse than an absent
# one:
#
#   DF.2a_LV, DF.2a_MV   Min channel width.  Measured on an edge layer -
#                        `comp.not(poly2).edges.and(tgate.edges).with_length(...)` -
#                        which needs edge algebra: edge extraction, an edge-to-edge
#                        boolean, and a length filter over the result.
#   DF.3c_MV             `drc_bjt.interacting(comp_56v, 2)` selects regions meeting
#                        the other layer at least twice.  Our selectors are boolean;
#                        there is no interaction count.
#   DF.11                Min length of a butting COMP edge.  Upstream measures the
#                        shared edge itself, not the region width; min_width on the
#                        butted COMP is a different quantity, so it is left out
#                        rather than approximated.
#
# Two more are ported but worth knowing about:
#
#   DF.2b   Upstream writes the 100 um width cap as sized(-50).sized(50), an opening
#           with a round structuring element.  Our `open` is the same operation, so
#           whatever survives the erode is the violation and the rule is `nonempty`.
#   DF.10   Min field area, upstream `comp.holes.not(comp).with_area`.  Expressed as
#           min_enclosed_area on COMP, which measures the same hole areas directly
#           and avoids the `holes` op's tile-locality limit.
#
# Validated against drc/testing/unit/comp.{gds,lyrdb} with tools/compare-lyrdb.py,
# which counts *logical* violations - markers clustered by proximity, since the two
# engines report at different granularity and matching KLayout's marker count is not the
# goal.  This engine's spacing check walks region pairs and emits one violation at their
# closest approach; KLayout emits one edge-pair per facing side.  Two interlocking combs
# out of this very fixture are five edge-pairs there and two here, both pointing at the
# same structure.
#
# All 40 ported rules fire.  The reference finds 800 logical violations and we flag 687.
# 142 are missed, 33 of them belonging to the four rules above that are deliberately
# absent, so 109 come from ported rules.  18 are false positives: 6 across DF.13/DF.14
# where the "within reach of a tap" boundary is drawn slightly differently, 4 on DF.9,
# and 8 spread over DF.1a, DF.4d_LV and DF.5_LV.
#
# The 109 have no confirmed cause.  Ruled out: the derived layers (raw COMP misses the
# same spots), the LV/MV split (the misses are not picked up by the other variant), and
# the checks themselves - min_space, min_notch and min_width all measure correctly on
# reduced cases at this scale, including 45 degree edges, 55 nm gaps, an island inside a
# ring's hole, and the interlocking comb pair above.

rules:
  # --- Width ---
  - id: DF.1a_LV
    check: min_width
    layers: [comp_3p3v]
    value: 0.22
  - id: DF.1a_MV
    check: min_width
    layers: [comp_56v_no_mv]
    value: 0.3
  - id: DF.1c
    check: min_width
    layers: [comp_moscap]
    value: 1.0
  - id: DF.2b
    check: nonempty
    layers: [comp_over_100um]
    value: 0.0

  # --- Space ---
  # KLayout's Region#space measures between edges of the same *or* different
  # polygons, so a single-layer space rule covers notches too.  separation(other) does
  # not, which is why only the single-layer rules get a notch companion here.
  - id: DF.3a_LV
    check: min_space
    layers: [comp_3p3v_no_otp]
    value: 0.28
  - id: DF.3a_LV
    check: min_notch
    layers: [comp_3p3v_no_otp]
    value: 0.28
  - id: DF.3a_MV
    check: min_space
    layers: [comp_56v_no_otp]
    value: 0.36
  - id: DF.3a_MV
    check: min_notch
    layers: [comp_56v_no_otp]
    value: 0.36
  - id: DF.3b
    check: nonempty
    layers: [df3b_viol]
    value: 0.0
  - id: DF.3c_LV
    check: min_space
    layers: [comp_3p3v_bjt]
    value: 0.32
  - id: DF.3c_LV
    check: min_notch
    layers: [comp_3p3v_bjt]
    value: 0.32

  # --- Well taps inside DNWELL ---
  - id: DF.4a_LV
    check: min_space
    layers: [ntap_dn3p3v, lvpwell_dn3p3v]
    value: 0.12
  - id: DF.4a_MV
    check: min_space
    layers: [ntap_dn56v, lvpwell_dn56v]
    value: 0.16
  - id: DF.4b_LV
    check: min_enclosure
    layers: [dnwell_3p3v, ntap_dn3p3v]
    value: 0.62
  - id: DF.4b_MV
    check: min_enclosure
    layers: [dnwell_56v, ntap_dn56v]
    value: 0.66

  # --- N-well overlap of COMP, outside DNWELL ---
  - id: DF.4c_LV
    check: min_enclosure
    layers: [nw_ndn_sram_3p3v, df4c_pcomp3p3v]
    value: 0.43
  - id: DF.4c_MV
    check: min_enclosure
    layers: [nwell_n_dn_no_sram, df4c_pcomp56v]
    value: 0.6
  - id: DF.4d_LV
    check: min_enclosure
    layers: [df4d_nwell, df4d_ncomp3p3v]
    value: 0.12
  - id: DF.4d_MV
    check: min_enclosure
    layers: [df4d_nwell, df4d_ncomp56v]
    value: 0.16

  # --- DNWELL overlap of COMP ---
  - id: DF.4e_LV
    check: min_enclosure
    layers: [dnwell_3p3v, pcomp_dn3p3v]
    value: 0.93
  - id: DF.4e_MV
    check: min_enclosure
    layers: [dnwell_56v, pcomp_dn56v]
    value: 1.1
  - id: DF.5_LV
    check: min_enclosure
    layers: [lvpwell_dn3p3v, ptap_lvpwell_dn3p3v]
    value: 0.12
  - id: DF.5_MV
    check: min_enclosure
    layers: [lvpwell_dn56v, ptap_lvpwell_dn56v]
    value: 0.16

  # --- Source/drain overhang ---
  # Poly runs over field as well as over COMP, so most of df6_poly is nowhere near a
  # COMP to be enclosed by.  Upstream's `enclosing` only measures where the two
  # actually meet; without interacting_only every stretch of field poly reads as a
  # zero-margin violation.
  - id: DF.6_LV
    check: min_enclosure
    layers: [df6_comp3p3v, df6_poly]
    value: 0.24
    params:
      interacting_only: 1
  - id: DF.6_MV
    check: min_enclosure
    layers: [df6_comp56v, df6_poly]
    value: 0.4
    params:
      interacting_only: 1

  # --- LVPWELL to COMP, inside DNWELL ---
  - id: DF.7_LV
    check: min_space
    layers: [pcomp_dn3p3v, lvpwell_dn3p3v]
    value: 0.43
  - id: DF.7_MV
    check: min_space
    layers: [pcomp_dn56v_no_sram, lvpwell_dn56v]
    value: 0.6
  - id: DF.8_LV
    check: min_enclosure
    layers: [lvpwell_dn3p3v, df8_ncomp3p3v]
    value: 0.43
  - id: DF.8_MV
    check: min_enclosure
    layers: [lvpwell_dn56v, df8_ncomp56v]
    value: 0.6

  # --- Area ---
  - id: DF.9
    check: min_area
    layers: [comp_no_otp]
    value: 0.2025
  - id: DF.10
    check: min_enclosed_area
    layers: [comp]
    value: 0.26

  # --- Implant coverage ---
  - id: DF.12
    check: nonempty
    layers: [comp_no_implant]
    value: 0.0

  # --- Maximum distance to a well tap ---
  # Every device active must sit within reach of a tap; max_space reports the parts
  # of the first layer that do not.
  - id: DF.13_LV
    check: max_space
    layers: [pactive_3p3v, ntap]
    value: 20.0
  - id: DF.13_MV
    check: max_space
    layers: [pactive_56v, ntap]
    value: 15.0
  - id: DF.14_LV
    check: max_space
    layers: [nactive_3p3v, ptap]
    value: 20.0
  - id: DF.14_MV
    check: max_space
    layers: [nactive_56v, ptap]
    value: 15.0

  # --- COMP outside both wells, to the wells ---
  - id: DF.16_LV
    check: min_space
    layers: [df16_ncomp_lv, nwell_n_dn3p3v_no_ymtp]
    value: 0.43
  - id: DF.16_MV
    check: min_space
    layers: [df16_ncomp_mv, nwell_n_dn56v_no_ymtp]
    value: 0.6
  - id: DF.17_LV
    check: min_space
    layers: [df17_pcomp_lv, nwell_n_dn3p3v]
    value: 0.12
  - id: DF.17_MV
    check: min_space
    layers: [df17_pcomp_mv, nwell_n_dn56v]
    value: 0.16
  - id: DF.18
    check: min_space
    layers: [pcomp_out_nw_dn, dnwell]
    value: 2.5
  - id: DF.19_LV
    check: min_space
    layers: [df16_ncomp_lv_all, dnwell]
    value: 3.2
  - id: DF.19_MV
    check: min_space
    layers: [df16_ncomp_mv_all, dnwell]
    value: 3.28
