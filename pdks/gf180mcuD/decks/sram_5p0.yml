# SRAM 5.  All 8 rules in this section.
rules:
  - id: S.CO.4_MV
    check: min_enclosure
    layers: [comp_sram_mv, contact_sram_mv]
    value: 0.04
    params:
      interacting_only: 1
      metric: euclidian
  - id: S.CO.4_MV
    check: forbidden
    layers: [s_co_4_mv_crossing]
    value: 0.0
  - id: S.DF.4c_MV
    check: min_enclosure
    layers: [nwell_n_dn, pcomp_out_dn_sram_mv]
    value: 0.45
    params:
      interacting_only: 1
      metric: euclidian
  - id: S.DF.4c_MV
    check: forbidden
    layers: [s_df_4c_mv_crossing]
    value: 0.0
  - id: S.DF.6_MV
    check: min_enclosure
    layers: [comp_sram_mv, poly_sram_mv]
    value: 0.32
    params:
      interacting_only: 1
      metric: euclidian
  - id: S.DF.7_MV
    check: min_space
    layers: [pcomp_dn_sram_mv, lvpwell_dn_sram_mv]
    value: 0.45
    params:
      abutting: report
  - id: S.DF.8_MV
    check: min_enclosure
    layers: [lvpwell_dn_sram_mv, ncomp_dn_sram]
    value: 0.45
    params:
      interacting_only: 1
      metric: euclidian
  - id: S.DF.8_MV
    check: forbidden
    layers: [s_df_8_mv_crossing]
    value: 0.0
  - id: S.DF.16_MV
    check: min_space
    layers: [ncomp_out_nw_dn_sram_mv, nwell_n_dn]
    value: 0.45
    params:
      abutting: report
  # 11.1 gives its two poly rules one value between them - field poly to unrelated COMP
  # and field poly to related COMP are both 0.12 - so no gap under it may escape, and
  # each gap carries both ids, as chapter 7's PL.5a_MV and PL.5b_MV do at 0.3.  Read on
  # the poly that gates no active, a gate over one active passing 0.115 from a second
  # fell between the two (report, sram_5p0 finding 2).
  - id: S.PL.5a_MV
    check: min_space
    layers: [poly_sram_mv, comp_sram_mv]
    value: 0.12
    params:
      pairs: any
      abutting: report
  - id: S.PL.5b_MV
    check: min_space
    layers: [poly_sram_mv, comp_sram_mv]
    value: 0.12
    params:
      pairs: any
      abutting: report
