# SRAM 5.  All 8 rules in this section.
rules:
  - id: S.DF.4c_MV
    check: min_enclosure
    layers: [nw_n_dn_sram_mv, pcomp_out_dn_sram_mv]
    value: 0.45
    params:
      interacting_only: 1
    str_params:
      metric: euclidian
  - id: S.DF.6_MV
    check: min_enclosure
    layers: [comp_sram_mv, poly_sram_mv]
    value: 0.32
    params:
      interacting_only: 1
    str_params:
      metric: euclidian
  - id: S.DF.7_MV
    check: min_space
    layers: [pcomp_dn_sram_mv, lvpwell_dn_sram_mv]
    value: 0.45
  - id: S.DF.8_MV
    check: min_enclosure
    layers: [lvpwell_dn_sram_mv, ncomp_dn_sram]
    value: 0.45
    params:
      interacting_only: 1
    str_params:
      metric: euclidian
  - id: S.DF.16_MV
    check: min_space
    layers: [ncomp_out_nw_dn_sram_mv, nw_n_dn_sram_mv]
    value: 0.45
  - id: S.PL.5a_MV
    check: min_space
    layers: [poly_sram_field, comp_sram_mv]
    value: 0.12
  - id: S.PL.5b_MV
    check: min_space
    layers: [poly_sram_mv, comp_sram_mv]
    value: 0.12
    str_params:
      pairs: overlapping
  - id: S.CO.4_MV
    check: min_enclosure
    layers: [comp_sram_mv, contact_sram_mv]
    value: 0.04
    params:
      interacting_only: 1
    str_params:
      metric: euclidian
  - id: S.DF.4c_MV
    check: nonempty
    layers: [s_df_4c_mv_crossing]
    value: 0.0
  - id: S.DF.8_MV
    check: nonempty
    layers: [s_df_8_mv_crossing]
    value: 0.0
  - id: S.CO.4_MV
    check: nonempty
    layers: [s_co_4_mv_crossing]
    value: 0.0
