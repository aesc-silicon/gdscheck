# Native Vt device.  12 of the 12 rules in this section.
#
rules:
  - id: NAT.1
    check: min_enclosure
    layers: [nat, nat_ncomp]
    value: 2.0
    params:
      interacting_only: 1
  - id: NAT.2
    check: min_space
    layers: [nat, comp_outside_nat]
    value: 0.3
  - id: NAT.3
    check: min_space
    layers: [nat, nwell]
    value: 0.5
  - id: NAT.4
    check: min_width
    layers: [nat4_channel]
    value: 1.8
  - id: NAT.5
    check: min_width
    layers: [nat5_channel]
    value: 1.8
  - id: NAT.6
    check: max_nets_under
    layers: [nat, nat6_comp, comp]
    value: 1.0
  - id: NAT.7
    check: min_space
    layers: [nat]
    value: 0.74
  - id: NAT.7
    check: min_notch
    layers: [nat]
    value: 0.74
  - id: NAT.8
    check: nonempty
    layers: [nat8_viol]
    value: 0.0
  - id: NAT.9
    check: nonempty
    layers: [nat9_interconnect]
    value: 0.0
  - id: NAT.9
    check: min_space
    layers: [nat, poly_off_nat]
    value: 0.3
  - id: NAT.10
    check: nonempty
    layers: [nat10_viol]
    value: 0.0
  - id: NAT.11
    check: nonempty
    layers: [nat11_viol]
    value: 0.0
  - id: NAT.12
    check: nonempty
    layers: [nat12_viol]
    value: 0.0
