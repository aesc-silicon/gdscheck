# N-well.  All 13 rules in this section.
rules:
  - id: NW.1a_LV
    check: min_width
    layers: [nw_lv]
    value: 0.86
  - id: NW.1a_MV
    check: min_width
    layers: [nw_mv]
    value: 0.86
  - id: NW.1b_LV
    check: min_width
    layers: [nw_res_lv]
    value: 2.0
  - id: NW.1b_MV
    check: min_width
    layers: [nw_res_mv]
    value: 2.0
  - id: NW.2a_LV
    check: min_space
    layers: [nw_lv_no_ymtp]
    value: 0.6
  - id: NW.2a_LV
    check: min_notch
    layers: [nw_lv_no_ymtp]
    value: 0.6
  - id: NW.2a_MV
    check: min_space
    layers: [nw_mv_no_ymtp]
    value: 0.74
  - id: NW.2a_MV
    check: min_notch
    layers: [nw_mv_no_ymtp]
    value: 0.74
  - id: NW.2b_LV
    check: min_space_different_net
    layers: [nw_lv]
    value: 1.4
  - id: NW.2b_MV
    check: min_space_different_net
    layers: [nw_mv]
    value: 1.7
