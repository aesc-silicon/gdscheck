# Metal slotting, ported from rule_decks/mslot.rb.  Wide metal has to be perforated so
# it does not lift during processing; these rules say which metal needs slots and what a
# legal slot looks like.  One rule set per level, Metal1 to Metal5 on this 5LM variant.
#
# The PDK ships no test case for this deck, so unlike every other deck here the mapping
# is not measured against a reference - it is read off mslot.rb directly and checked
# against a pattern of our own, written by tools/gen-mslot-pattern.py: nine Metal1
# plates, each drawn to trip exactly one MSLOT1 rule.  All nine fire once and nothing
# else does.  That confirms every rule is reachable and lands on the geometry it is
# about; it does not confirm agreement with the foundry's engine, which only a real test
# case could.  Levels 2 to 5 are the same rules on the same derivations, so they are
# covered by construction rather than by measurement.
#
# MSLOT#.0 and MSLOT#.1 are `nonempty` checks on a derived layer rather than measurements:
# upstream outputs the derivation itself, so the geometry that reaches the layer *is* the
# violation.
#
# MSLOT5.7 is absent.  It measures the space from the via *above* the metal to the slot,
# and Metal5 is the top of a 5LM stack, so there is no such via - upstream substitutes an
# empty layer and the rule can never fire.
rules:
  # ---- Metal1 ----------------------------------------------------------
  - id: MSLOT1.0
    check: nonempty
    layers: [metal1_slot_not_rect]
    value: 0.0
    description: "MSLOT1.0: Slot is not a rectangle"
  - id: MSLOT1.1
    check: nonempty
    layers: [metal1_needs_slot]
    value: 0.0
    description: "MSLOT1.1: Maximum metal width without slotting: 30 um"
  # bbox_min < 2: the slot's shorter side.  min_dim measures the same quantity directly.
  - id: MSLOT1.2
    check: min_dim
    layers: [metal1_slot_rect]
    value: 2.0
  # bbox_max outside [10, 250]: the slot's longer side, bounded at both ends.
  - id: MSLOT1.3
    check: min_length
    layers: [metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.3
    check: max_length
    layers: [metal1_slot_rect]
    value: 250.0
  - id: MSLOT1.4
    check: min_space
    layers: [metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.5
    check: min_enclosure
    layers: [metal1_drawn, metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.7
    check: min_space
    layers: [metal1_slot_rect, via1]
    value: 0.2
  - id: MSLOT1.8
    check: min_space
    layers: [metal1_slot_rect, contact]
    value: 0.2
  - id: MSLOT1.9
    check: min_space
    layers: [metal1_slot_rect, dont_slot]
    value: 5.0
  # ---- Metal2 ----------------------------------------------------------
  - id: MSLOT2.0
    check: nonempty
    layers: [metal2_slot_not_rect]
    value: 0.0
    description: "MSLOT2.0: Slot is not a rectangle"
  - id: MSLOT2.1
