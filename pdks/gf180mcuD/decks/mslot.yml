# Metal slotting.
rules:
  - id: MSLOT1.0
    check: nonempty
    layers: [metal1_slot_not_rect]
    value: 0.0
    description: "MSLOT1.0: Slot is not a rectangle"
  - id: MSLOT1.1
    check: nonempty
    layers: [metal1_needs_slot]
    value: 0.0
    description: "MSLOT1.1: Maximum metal width without slotting: 30 um"
  - id: MSLOT1.2
    check: min_dim
    layers: [metal1_slot_rect]
    value: 2.0
  - id: MSLOT1.3
    check: min_length
    layers: [metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.3
    check: max_length
    layers: [metal1_slot_rect]
    value: 250.0
  - id: MSLOT1.4
    check: min_space
    layers: [metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.5
    check: min_enclosure
    layers: [metal1_drawn, metal1_slot_rect]
    value: 10.0
  - id: MSLOT1.7
    check: min_space
    layers: [metal1_slot_rect, via1]
    value: 0.2
  - id: MSLOT1.8
    check: min_space
    layers: [metal1_slot_rect, contact]
    value: 0.2
  - id: MSLOT1.9
    check: min_space
    layers: [metal1_slot_rect, dont_slot]
    value: 5.0
