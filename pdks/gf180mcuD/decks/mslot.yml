    layers: [metal2_drawn, metal2_slot_rect]
    value: 10.0
  - id: MSLOT2.7
    check: min_space
    layers: [metal2_slot_rect, via2]
    value: 0.2
  - id: MSLOT2.8
    check: min_space
    layers: [metal2_slot_rect, via1]
    value: 0.2
