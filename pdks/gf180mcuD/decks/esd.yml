    check: min_area
    layers: [esd]
    value: 0.49
  - id: ESD.5b
    check: min_enclosed_area
    layers: [esd]
    value: 0.49
  - id: ESD.7
    check: nonempty
    layers: [esd_on_pcomp]
    value: 0.0
