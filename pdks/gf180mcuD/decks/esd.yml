# ESD implant.  All 14 rules in this section.
rules:
  - id: ESD.1
    check: min_width
    layers: [esd]
    value: 0.6
  - id: ESD.2
    check: min_space
    layers: [esd]
    value: 0.6
  - id: ESD.2
    check: min_notch
    layers: [esd]
    value: 0.6
  - id: ESD.3a
    check: min_space
    layers: [esd, ncomp]
