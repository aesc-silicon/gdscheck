# ESD implant.  11 of the 14 rules in this section.
#
# Not ported: ESD.4a, ESD.4b, ESD.6.
rules:
  - id: ESD.1
    check: min_width
    layers: [esd]
    value: 0.6
  - id: ESD.2
    check: min_space
    layers: [esd]
    value: 0.6
  - id: ESD.2
    check: min_notch
    layers: [esd]
    value: 0.6
  - id: ESD.3a
    check: min_space
    layers: [esd, ncomp]
    value: 0.6
  - id: ESD.3b
    check: nonempty
    layers: [esd_on_pcomp]
    value: 0.0
  - id: ESD.pl
    check: gate_length
    layers: [poly_esd, tgate]
    value: 0.8
  - id: ESD.5a
    check: min_area
    layers: [esd]
    value: 0.49
  - id: ESD.5b
    check: min_enclosed_area
    layers: [esd]
    value: 0.49
  - id: ESD.7
    check: nonempty
    layers: [esd_on_pcomp]
    value: 0.0
  - id: ESD.8
    check: min_space
    layers: [esd, nplus_or_pplus]
    value: 0.3
  - id: ESD.9
    check: nonempty
    layers: [esd_no_dualgate]
    value: 0.0
  - id: ESD.10
    check: nonempty
    layers: [esd10_viol]
    value: 0.0
