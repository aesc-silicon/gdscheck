# Low-voltage P-well.  Ported from rule_decks/lvpwell.rb - all ten rules.
#
# LPW.2a is the different-potential minimum and LPW.2b the equi-potential one, the
# same pairing as NW.2a/NW.2b: LPW.2b runs as a plain geometric space, so it also
# fires on a different-net pair below 0.86 um, which is an LPW.2a violation anyway.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 128 of 206 logical violations, no false positives. LPW.2a needs
# lvpwell_dn_lv/_mv in the connect graph - without them the net-aware check cannot
# resolve a net, fails conservative and reported 24 pairs it should not have.
rules:
  - id: LPW.1_LV
    check: min_width
    layers: [lvpwell_dn]
    value: 0.6
  - id: LPW.1_MV
    check: min_width
    layers: [lvpwell_dn_mv]
    value: 0.74
  - id: LPW.2a_LV
    check: min_space_different_net
    layers: [lvpwell_dn_lv]
    value: 1.4
  - id: LPW.2a_MV
    check: min_space_different_net
    layers: [lvpwell_dn_mv]
    value: 1.7
  - id: LPW.2b_LV
    check: min_space
    layers: [lvpwell_dn_lv]
    value: 0.86
  - id: LPW.2b_LV
    check: min_notch
    layers: [lvpwell_dn_lv]
    value: 0.86
  - id: LPW.2b_MV
    check: min_space
    layers: [lvpwell_dn_mv]
    value: 0.86
  - id: LPW.2b_MV
    check: min_notch
    layers: [lvpwell_dn_mv]
    value: 0.86
  - id: LPW.3
    check: min_enclosure
    layers: [dnwell, lvpwell_dn]
    value: 2.5
    params:
      interacting_only: 1
  - id: LPW.5
    check: nonempty
    layers: [lpw5_viol]
    value: 0.0
  - id: LPW.11
    check: min_space
    layers: [lvpwell_out_dn, dnwell]
    value: 1.5
  - id: LPW.12
    check: nonempty
    layers: [lpw12_viol]
    value: 0.0
