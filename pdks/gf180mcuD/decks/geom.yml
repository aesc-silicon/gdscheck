# Off-grid vertices and non-45-degree angles.  Ported from rule_decks/geom.rb, which
# runs the same pair of checks over every drawn layer - two rule ids per layer, so the
# deck's two upstream expressions expand to the list below.
#
# The ACUTE half allows 0, 45, 90 and -45 degrees and flags everything else, which is
# `no_angle` with `step: 45`; its default of 90 would flag every legitimate diagonal.
#
# Layers this 5LM variant does not have (via5 and the metaltop family, which are 6LM)
# are absent, as they are from the layer table.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 2889 of 3579, and no false positives.  The OFFGRID half is very
# nearly exact (2173 of 2328); nearly all of the 690 misses are ACUTE (716 of 1251).
#
# One likely cause for the ACUTE gap, not yet confirmed: upstream runs these on raw
# polygons - its default run_mode is `deep`, which skips the merge - while every check
# here reads the merged layer.  Merging dissolves the boundary between two touching
# shapes, and an acute notch between them goes with it.
rules:
  - id: comp_OFFGRID
    check: offgrid
    layers: [comp]
    value: 0.005
  - id: comp_ACUTE
    check: no_angle
    layers: [comp]
    value: 0.0
    params:
      step: 45
  - id: dnwell_OFFGRID
    check: offgrid
    layers: [dnwell]
    value: 0.005
  - id: dnwell_ACUTE
    check: no_angle
