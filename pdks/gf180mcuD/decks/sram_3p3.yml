# SRAM 3.3 V - the SRAM core has tighter rules
# than the rest of the die, so these run on the parts of each layer inside SRAMCORE.
#
# S.CO.6_ii_LV is the contact's version of the via deck's V#.3.2 - the same shape, with
# tighter numbers: a contact side that Metal1 encloses by less than 0.02 um forces the
# sides next to it to reach 0.04.  `sides: adjacent` says exactly that, so it needs no
# edge layer despite the reference building it from one.  Note the reference's own
# description has the two numbers the other way round; the code is what it runs.
rules:
  - id: S.DF.4c_LV
    check: min_enclosure
    layers: [nwell_n_dn_sram, pcomp_out_dn_sram]
    value: 0.4
    params:
      interacting_only: 1
  - id: S.DF.16_LV
    check: min_space
    layers: [ncomp_out_nw_dn_sram, nwell_n_dn_sram]
    value: 0.4
  - id: S.CO.3_LV
    check: min_enclosure
    layers: [poly_sram, contact_sram]
    value: 0.04
    params:
      interacting_only: 1
  - id: S.CO.4_LV
    check: min_enclosure
    layers: [comp_sram, contact_sram]
    value: 0.03
    params:
      interacting_only: 1
  - id: S.CO.6_ii_LV
    check: min_enclosure
    layers: [metal1_sram, contact_sram]
    value: 0.04
    params:
      trigger: 0.02
    str_params:
      sides: adjacent
  - id: S.M1.1_LV
    check: min_width
    layers: [metal1_sram]
    value: 0.22
