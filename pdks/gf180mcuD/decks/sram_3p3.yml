# SRAM 3.3 V.  All 6 rules in this section, on the parts of each layer inside
# SRAMCORE.
rules:
  - id: S.DF.4c_LV
    check: min_enclosure
    layers: [nwell_n_dn_sram, pcomp_out_dn_sram]
    value: 0.4
    params:
      interacting_only: 1
  - id: S.DF.16_LV
    check: min_space
    layers: [ncomp_out_nw_dn_sram, nwell_n_dn_sram]
    value: 0.4
  - id: S.CO.3_LV
    check: min_enclosure
    layers: [poly_sram, contact_sram]
    value: 0.04
    params:
      interacting_only: 1
  - id: S.CO.4_LV
    check: min_enclosure
    layers: [comp_sram, contact_sram]
    value: 0.03
    params:
      interacting_only: 1
  - id: S.CO.6_ii_LV
    check: min_enclosure
    layers: [metal1_sram, contact_sram]
    value: 0.04
    params:
      trigger: 0.02
    str_params:
      sides: adjacent
  - id: S.M1.1_LV
    check: min_width
    layers: [metal1_sram]
    value: 0.22
