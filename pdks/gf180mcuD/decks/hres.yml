# High-sheet poly resistor.  11 of the 12 rules in this section.
#
# Not ported: HRES.10.
rules:
  - id: HRES.1
    check: min_space
    layers: [hres_resistor]
    value: 0.4
  - id: HRES.1
    check: min_notch
    layers: [hres_resistor]
    value: 0.4
  - id: HRES.2
    check: min_width
    layers: [hres_poly]
    value: 1.0
  - id: HRES.3
    check: min_space
    layers: [hres_poly]
    value: 0.4
  - id: HRES.3
    check: min_notch
    layers: [hres_poly]
    value: 0.4
  - id: HRES.4
    check: min_enclosure
    layers: [resistor, hres_poly]
    value: 0.4
    params:
      interacting_only: 1
  - id: HRES.5
    check: min_space
    layers: [hres_resistor, poly2_unrelated]
    value: 0.3
  - id: HRES.6
    check: min_space
    layers: [hres_resistor, comp]
    value: 0.3
  - id: HRES.6
    check: nonempty
    layers: [comp_on_hres]
    value: 0.0
  - id: HRES.7
    check: min_enclosure
    layers: [pplus, hres_contact]
    value: 0.2
    params:
      interacting_only: 1
  - id: HRES.8
    check: min_space
    layers: [hres_contact, sab]
    value: 0.22
  - id: HRES.8
    check: nonempty
    layers: [hres_cont_on_sab]
    value: 0.0
  - id: HRES.9
    check: min_enclosure
    layers: [hres9_sab, hres_poly]
    value: 0.28
    params:
      interacting_only: 1
  - id: HRES.4
    check: nonempty
    layers: [hres_4_crossing]
    value: 0.0
  - id: HRES.7
    check: nonempty
    layers: [hres_7_crossing]
    value: 0.0
  - id: HRES.12a
    check: nonempty
    layers: [hres12a_viol]
    value: 0.0
  - id: HRES.12b
    check: min_space
    layers: [res_mk_big, res_mk]
    value: 20.0
