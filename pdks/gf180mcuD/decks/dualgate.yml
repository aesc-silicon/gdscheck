# Dual gate oxide (5/6 V devices).  All 8 rules.
#
# DV.1, DV.6 and DV.8 each pair an enclosure measurement with a second term for the
# layer that overlaps dualgate but reaches outside it.  interacting_only is what keeps
# the measurement to where the two actually meet - without it every DNWELL, COMP or
# poly nowhere near a dualgate reads as a zero-margin violation.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 16 of 19 logical violations, 2 false positives.
rules:
  - id: DV.1
    check: min_enclosure
    layers: [dualgate, dnwell]
    value: 0.5
    params:
      interacting_only: 1
  - id: DV.2
    check: min_space
    layers: [dualgate]
    value: 0.44
  - id: DV.2
    check: min_notch
    layers: [dualgate]
    value: 0.44
  - id: DV.3
    check: min_space
    layers: [dualgate, comp_outside_dualgate]
    value: 0.24
  - id: DV.5
    check: min_width
    layers: [dualgate]
    value: 0.7
  - id: DV.6
    check: min_enclosure
    layers: [dualgate, comp_dv]
    value: 0.24
    params:
      interacting_only: 1
  # A COMP may be wholly inside a dualgate or wholly outside it, never straddling.
  - id: DV.7
    check: nonempty
    layers: [dv7_viol]
    value: 0.0
  - id: DV.8
    check: min_enclosure
    layers: [dualgate, poly2_drawn]
    value: 0.4
    params:
      interacting_only: 1
  - id: DV.9
    check: nonempty
    layers: [dv9_viol]
    value: 0.0
