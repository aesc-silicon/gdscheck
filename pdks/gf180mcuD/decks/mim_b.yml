# MIM capacitor, option B - the variant this PDK build selects.  11 of the 12
# rules in this section.
#
# The capacitor's bottom plate has no layer of its own: it is whichever Metal4 shape
# the FuseTop top plate sits on, and upstream reconstructs it as `mimtm_virtual` (see
# pdk.yml).  Most of the deck is enclosure and spacing measured against that.
#
# MIMTM.11 is not ported.  It caps the *total* MIM area sharing one bottom plate, and
# upstream implements it by walking each Metal4 polygon in Ruby and summing the FuseTop
# area inside it - a per-polygon accumulation with no equivalent here.  MIMTM.8b already
# bounds a single capacitor; this is the shared-plate sum on top of it.
#
# MIMTM.12 is not a DRC check upstream either - it points at the design manual.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 162 of 166, 3 false positives by the per-marker count.  MIMTM.7, MIMTM.8a, MIMTM.8b,
# MIMTM.9 and MIMTM.10 are exact.  Of the 13 misses, 2 are MIMTM.11; two of MIMTM.1's
# three are corner-to-corner pairs - facing edges that meet at a single x and are 0.74
# and 1.03 um apart - which is the same class behind nwell's and lvpwell's residual, not
# anything specific to this deck.
rules:
  - id: MIMTM.1
    check: min_space
    layers: [topmin1_metal, mimtm_virtual]
    value: 1.2
  # Upstream's `enclosed`/`enclosing` only measure where the two layers actually meet;
  # without `interacting_only` every routing via elsewhere on the die reads as a via the
  # plate fails to enclose.
  - id: MIMTM.2
    check: min_enclosure
    layers: [topmin1_metal, mimtm_via]
    value: 0.4
    params:
      interacting_only: 1
  # No `interacting_only` here, unlike MIMTM.2 and MIMTM.4: upstream joins the enclosure
  # term with `fusetop.not_inside(mimtm_virtual)`, so a top plate sitting entirely off
  # the reconstructed bottom plate is the violation, not a shape to skip.  Adding the
  # filter drops 35 of the 40.
  - id: MIMTM.3
    check: min_enclosure
    layers: [mimtm_virtual, fusetop]
    value: 0.6
  - id: MIMTM.4
    check: min_enclosure
    layers: [fusetop, top_via]
    value: 0.4
    params:
      interacting_only: 1
  - id: MIMTM.5
    check: min_space
    layers: [fusetop, top_via_on_topmin1_metal]
    value: 0.4
  # `space` covers notches as well as the gap between shapes.
  - id: MIMTM.6
    check: min_space
    layers: [fusetop]
    value: 0.6
  - id: MIMTM.6
    check: min_notch
    layers: [fusetop]
    value: 0.6
  # "Min FuseTop enclosure by CAP_MK is 0 um" - any top plate outside the marker.
  - id: MIMTM.7
    check: nonempty
    layers: [fusetop_outside_cap_mk]
    value: 0.0
    description: "MIMTM.7: Min FuseTop enclosure by CAP_MK: 0 um"
  - id: MIMTM.8a
    check: min_area
    layers: [fusetop]
    value: 25.0
  - id: MIMTM.8b
    check: max_area
    layers: [fusetop]
    value: 10000.0
  - id: MIMTM.9
    check: min_space
    layers: [top_via_in_fusetop]
    value: 0.5
  - id: MIMTM.10
    check: nonempty
    layers: [topmin1_via_on_mim_bottom]
    value: 0.0
    description: "MIMTM.10: no Via3 may touch the MIM bottom plate"
