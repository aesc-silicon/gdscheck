# P+ poly resistor.  All 9 rules in this section.
rules:
  - id: PRES.1
    check: min_width
    layers: [pres_poly]
    value: 0.8
  - id: PRES.2
    check: min_space
    layers: [pres_poly]
    value: 0.4
  - id: PRES.3
    check: min_space
    layers: [pres_poly, comp]
    value: 0.6
  - id: PRES.3
    check: nonempty
    layers: [comp_on_pres]
    value: 0.0
  - id: PRES.4
    check: min_space
    layers: [pres_poly, poly2_unrelated]
    value: 0.6
  - id: PRES.5
    check: min_enclosure
    layers: [pplus, pres_poly]
    value: 0.3
    params:
      interacting_only: 1
  - id: PRES.6
    check: min_enclosure
    layers: [sab, pres_poly]
    value: 0.28
    params:
      interacting_only: 1
  - id: PRES.7
    check: min_space
    layers: [cont_pres, sab]
    value: 0.22
  - id: PRES.7
    check: nonempty
    layers: [cont_pres_on_sab]
    value: 0.0
  - id: PRES.9a
    check: nonempty
    layers: [pres9a_viol]
    value: 0.0
  - id: PRES.9b
    check: min_space
    layers: [res_mk_big, res_mk]
    value: 20.0
