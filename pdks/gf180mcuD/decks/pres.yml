# P+ poly resistor.  7 of the 9 rules in this section.
#
# The two absent rules are the RES_MK marking checks (PRES.9a and .9b): both
# work on edge subsets - "the marking's length shall coincide with the resistor's" is
# an edge boolean against the poly-and-SAB outline, and the size rule filters marker
# edges by length.
#
# `isolated` upstream is the space between separate regions of one layer, which is
# what min_space measures here; the notch companion covers the same-polygon case.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 42 of 57, no false positives.
rules:
  - id: PRES.1
    check: min_width
    layers: [pres_poly]
    value: 0.8
  - id: PRES.2
    check: min_space
    layers: [pres_poly]
    value: 0.4
  - id: PRES.3
    check: min_space
    layers: [pres_poly, comp]
    value: 0.6
  - id: PRES.3
    check: nonempty
    layers: [comp_on_pres]
    value: 0.0
  - id: PRES.4
    check: min_space
    layers: [pres_poly, poly2_unrelated]
    value: 0.6
  - id: PRES.5
    check: min_enclosure
    layers: [pplus, pres_poly]
    value: 0.3
    params:
      interacting_only: 1
  - id: PRES.6
    check: min_enclosure
    layers: [sab, pres_poly]
    value: 0.28
    params:
      interacting_only: 1
  # A contact on the resistor must clear the salicide block, and not touch it at all.
  - id: PRES.7
    check: min_space
    layers: [cont_pres, sab]
    value: 0.22
  - id: PRES.7
    check: nonempty
    layers: [cont_pres_on_sab]
    value: 0.0
