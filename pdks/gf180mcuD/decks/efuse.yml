# eFuse.  Ported from rule_decks/efuse.rb - 16 of its 27 rules.
#
# A poly fuse sits on field oxide between a cathode and an anode, all inside EFUSE_MK,
# with LVS_Source picking out the anode end.
#
# Eleven rules are absent.  EF.03, EF.06 through EF.09, EF.21 and EF.22a/b all measure
# a min/max dimension as an edge length (`edges.without_length(v)`), which needs the
# edge layers plus an exact-length filter.  EF.04a, EF.16a and EF.16b select by
# interaction count - "exactly four contacts at each end".
#
# EF.02 is a twelfth, dropped after measuring.  "Min/Max PLFUSE width: 0.18 um" is
# `plfuse.drc(width != 0.18)`, and exact_width reports 229 violations against a
# reference 129 - 100 false positives.  A fuse is a 0.18 x 1.26 um rectangle, and
# exact_width tests every facing pair, so the long pair fails the width test as well as
# the short one; upstream's `width` in a drc expression takes only the minimal span.
# Left out rather than shipped wrong.
#
# The three "must be rectangular" rules are the first users of the `not_rectangle`
# shape filter.
#
# Validated against the PDK's own test case with tools/compare-lyrdb.py, counting
# logical violations: 322 of 832, 1 false positive.  EF.01, EF.04b/c/d, EF.05, EF.10,
# EF.11, EF.14, EF.15 and EF.17 are exact; nearly all the misses are the eleven rules
# above.
rules:
  - id: EF.01
    check: nonempty
    layers: [ef01_viol]
    value: 0.0
  - id: EF.04b
    check: nonempty
    layers: [plfuse_not_rect]
    value: 0.0
  - id: EF.04c
    check: nonempty
    layers: [cathode_not_rect]
    value: 0.0
  - id: EF.04d
    check: nonempty
    layers: [anode_not_rect]
    value: 0.0
  - id: EF.05
    check: nonempty
    layers: [ef05_viol_a]
    value: 0.0
  - id: EF.05
    check: nonempty
    layers: [ef05_viol_b]
    value: 0.0
  - id: EF.10
    check: min_space
    layers: [cathode]
    value: 0.26
  - id: EF.10
    check: min_notch
    layers: [cathode]
    value: 0.26
  - id: EF.11
    check: min_space
    layers: [anode]
    value: 0.26
  - id: EF.11
    check: min_notch
    layers: [anode]
    value: 0.26
  # EF.12 / EF.13: contacts keep clear of the fuse, and none may touch it.
  - id: EF.12
    check: min_space
    layers: [plfuse_efuse, cont_cathode]
    value: 0.155
  - id: EF.12
    check: nonempty
    layers: [cont_on_plfuse]
    value: 0.0
  - id: EF.13
    check: min_space
    layers: [plfuse_efuse, cont_anode]
    value: 0.14
  - id: EF.14
    check: nonempty
    layers: [ef14_viol]
    value: 0.0
  - id: EF.15
    check: nonempty
    layers: [plfuse_at_contact]
    value: 0.0
  - id: EF.17
    check: min_space
    layers: [efuse_mk]
    value: 0.26
  - id: EF.17
    check: min_notch
    layers: [efuse_mk]
    value: 0.26
  - id: EF.18
    check: nonempty
    layers: [ef18_viol]
    value: 0.0
  - id: EF.19
    check: nonempty
    layers: [ef19_viol]
    value: 0.0
  - id: EF.20
    check: min_space
    layers: [plfuse, ef20_neighbours]
    value: 2.73
