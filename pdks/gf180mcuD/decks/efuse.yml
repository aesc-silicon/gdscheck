# eFuse.  25 of the 27 rules in this section.
#
# Not ported: EF.02, EF.04a.
#
# Known: EF.06 and EF.08 over-report and EF.09 under-reports. The width/length
# partition needs to see that a shape's own edges touch, and edge layers are
# bucketed per tile by midpoint, so a corner near a tile boundary splits across
# two. See `bucket_edges` in src/merge.rs.
