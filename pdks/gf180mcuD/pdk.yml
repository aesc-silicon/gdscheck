# Derived edge layers: boundary segments rather than regions.  A rule names one exactly
# as it names any other layer; the checks that accept one say so.

edge_layers:
  # DF.2a, minimum channel width.  W is the length of the source/drain boundary that
  # runs under the gate - a property of that segment, not of any region, which is why
  # it needs an edge layer at all.
  - name: res_mk.edges
    op: edges
    layers: [res_mk]
  - name: hres_outline.edges
    op: edges
    layers: [hres_outline]
  - name: res_mk_off_hres_all
    op: not
    layers: [res_mk.edges, hres_outline.edges]
  - name: res_mk_off_hres
    op: inside_part
    layers: [res_mk_off_hres_all, poly2_drawn]
  - name: lres_outline.edges
    op: edges
    layers: [lres_outline]
  - name: res_mk_off_lres_all
    op: not
    layers: [res_mk.edges, lres_outline.edges]
  - name: res_mk_off_lres
    op: inside_part
    layers: [res_mk_off_lres_all, poly2_drawn]
  - name: ncomp_pcomp_butting_edges
    op: and
    layers: [ncomp.edges, pcomp.edges]
  # ESD.4a: the ESD boundary away from any PCOMP, enclosing the NCOMP boundary.
  - name: esd.edges
    op: edges
    layers: [esd]
  - name: esd_edges_no_pcomp
    op: not_interacting
    layers: [esd.edges, pcomp]
  - name: ncomp.edges2
    op: edges
    layers: [ncomp]
  # ESD.6: the ESD boundary enclosing the poly edges that reach a gate.
  - name: poly2.edges2
    op: edges
    layers: [poly2_drawn]
  - name: esd6_poly
    op: interacting_edges
    layers: [poly2.edges2, tgate.edges]
  # EF.06-09, EF.22a/b: the cathode and anode are rectangles whose width and length are
  # both fixed. Upstream separates the two by which edges reach the fuse: those, plus the
  # ones facing them, are the *width*; the remainder is the *length*. `without_length`
  # then flags anything not exactly the value, hence the max of one DBU past it.
  - name: cathode.edges
    op: edges
    layers: [cathode]
  - name: anode.edges
    op: edges
    layers: [anode]
  - name: plfuse.edges
    op: edges
    layers: [plfuse]
  # The LDMOS body is the gate poly over the active with the drift marker taken out, so
  # wherever the active cut it its boundary *is* the active's.  That is the split the
  # channel rules need: the walls the gate brought with it stand across the channel and
  # the distance between them is its length, while the ones the active cut stand at the
  # ends and the distance between them is the transistor's width.
  - name: ldnmos_body.edges
    op: edges
    layers: [ldnmos_body]
  - name: ldnmos_gate_sides
    op: not
    layers: [ldnmos_body.edges, ncomp.edges]
  - name: ldnmos_gate_ends
    op: and
    layers: [ldnmos_body.edges, ncomp.edges]
  - name: ldpmos_body.edges
    op: edges
    layers: [ldpmos_body]
  - name: ldpmos_gate_sides
    op: not
    layers: [ldpmos_body.edges, pcomp.edges]
  - name: mdp3c_ncomp.edges
    op: edges
    layers: [mdp3c_ncomp]
  - name: mdp3c_edges
    op: centers
    fraction: 0.99
    layers: [mdp3c_ncomp.edges]
  - name: mdn5c_tab.edges
    op: edges
    layers: [mdn5c_tab]
  - name: mdn5c_centers
    op: centers
    fraction: 0.99
    layers: [mdn5c_tab.edges]
  - name: mdn5c_on_ncomp
    op: inside_part
    layers: [mdn5c_centers, ncomp]
  - name: mdn5c_edges
    op: inside_part
    layers: [mdn5c_on_ncomp, pcomp_holes]
  - name: mdp4b_dnwell.edges
    op: edges
    layers: [mdp4b_dnwell]
  - name: mdp4b_dnwell_centers
    op: centers
    fraction: 0.99
    layers: [mdp4b_dnwell.edges]
  - name: mdp4b_edges
    op: inside_part
    layers: [mdp4b_dnwell_centers, pcomp_holes]
  - name: ef03_shared
    op: and
    layers: [poly2.edges, plfuse.edges]
  - name: ef03_shared_centers
    op: centers
    fraction: 0.95
    layers: [ef03_shared]
  - name: ef03_fuse_length
    op: interacting_edges
    layers: [plfuse.edges, ef03_shared_centers]
  - name: ef03_viol
    op: without_length
    min: 1.26
    max: 1.261
    layers: [ef03_fuse_length]
  - name: cathode_at_fuse
    op: interacting
    layers: [cathode.edges, plfuse]
  - name: cathode_facing
    op: not_interacting_edges
    layers: [cathode.edges, cathode_at_fuse]
  - name: cathode_width
    op: or
    layers: [cathode_facing, cathode_at_fuse]
  - name: cathode_length
    op: not
    layers: [cathode.edges, cathode_width]
  - name: anode_at_fuse
    op: interacting
    layers: [anode.edges, plfuse]
  - name: anode_facing
    op: not_interacting_edges
    layers: [anode.edges, anode_at_fuse]
  - name: anode_width
    op: or
    layers: [anode_facing, anode_at_fuse]
  - name: anode_length
    op: not
    layers: [anode.edges, anode_width]
  - name: ef21_fuse_box.edges
    op: edges
    layers: [ef21_fuse_box]
  - name: ef21_far
    op: or
    layers: [anode_facing, cathode_facing]
  - name: ef21_far_centers
    op: centers
    fraction: 0.95
    layers: [ef21_far]
  - name: ef21_clear
    op: not_interacting_edges
    layers: [ef21_fuse_box.edges, ef21_far_centers]
  - name: ef21_viol
    op: without_length
    min: 5.53
    max: 5.531
    layers: [ef21_clear]
  - name: ef22a_edges
    op: not
    layers: [cathode_at_fuse, plfuse.edges]
  - name: ef22b_edges
    op: not
    layers: [anode_at_fuse, plfuse.edges]
  - name: ef_06_viol
    op: without_length
    min: 2.26
    max: 2.261
    layers: [cathode_width]
  - name: ef_07_viol
    op: without_length
    min: 1.84
    max: 1.841
    layers: [cathode_length]
  - name: ef_08_viol
    op: without_length
    min: 1.06
    max: 1.061
    layers: [anode_width]
  - name: ef_09_viol
    op: without_length
    min: 2.43
    max: 2.431
    layers: [anode_length]
  - name: ef_22a_viol
    op: without_length
    min: 1.04
    max: 1.041
    layers: [ef22a_edges]
  - name: ef_22b_viol
    op: without_length
    min: 0.44
    max: 0.441
    layers: [ef22b_edges]
  # MDP.3d / MDP.4 and MDN.10b, as edge layers.
  - name: mdp3d_bare.edges
    op: edges
    layers: [mdp3d_bare]
  - name: mdp3d_uncovered
    op: outside_part
    layers: [mdp3d_bare.edges, metal1]
  - name: mdp3d_viol
    op: with_length
    min: 10.001
    layers: [mdp3d_uncovered]
  - name: mdp4_bare.edges
    op: edges
    layers: [mdp4_bare]
  - name: mdp4_uncovered
    op: outside_part
    layers: [mdp4_bare.edges, metal1]
  - name: mdp4_viol
    op: with_length
    min: 10.001
    layers: [mdp4_uncovered]
  - name: mdn10b_ncomp.edges
    op: edges
    layers: [mdn10b_ncomp]
  - name: ncomp_off_poly
    op: not_interacting
    layers: [ncomp.edges, poly2_drawn]
  - name: mdn10b_edges
    op: interacting_edges
    layers: [mdn10b_ncomp.edges, ncomp_off_poly]
  - name: poly_mdn10.edges
    op: edges
    layers: [poly_mdn10]
  - name: pres_outline.edges
    op: edges
    layers: [pres_outline]
  - name: res_mk_off_outline_all
    op: not
    layers: [res_mk.edges, pres_outline.edges]
  - name: res_mk_off_outline
    op: inside_part
    layers: [res_mk_off_outline_all, poly2_drawn]
  - name: pplus.edges
    op: edges
    layers: [pplus]
  - name: nplus.edges
    op: edges
    layers: [nplus]
  - name: ncomp.edges
    op: edges
    layers: [ncomp]
  - name: pcomp.edges
    op: edges
    layers: [pcomp]
  - name: ngate.edges
    op: edges
    layers: [ngate]
  - name: pplus_butted_edges
    op: and
    layers: [pplus.edges, ncomp.edges]

  # PP.11: a butting Pplus/NCOMP edge is forbidden in the band either side of a well edge.
  - name: pp11_at_nwell
    op: inside_part
    layers: [pplus_butted_edges, nwell_dn_edge_band]
  - name: pp11_at_lvpwell
    op: inside_part
    layers: [pplus_butted_edges, lvpwell_dn_outer_band]
  - name: pp11_viol
    op: or
    layers: [pp11_at_nwell, pp11_at_lvpwell]

  # PP.5b: the Pplus boundary that is not a butting edge, where it lies in an N-well or
  # inside DNWELL but out of the LVPWELL, against the COMP boundary it must extend past.
  - name: pp5b_pplus_all
    op: not
    layers: [pplus.edges, pplus_butted_edges]
  - name: pp5b_in_nwell
    op: inside_part
    layers: [pp5b_pplus_all, nwell]
  - name: pp5b_out_lvpwell
    op: outside_part
    layers: [pp5b_pplus_all, lvpwell]
  - name: pp5b_in_dnwell
    op: inside_part
    layers: [pp5b_out_lvpwell, dnwell]
  - name: pp5b_pplus
    op: or
    layers: [pp5b_in_nwell, pp5b_in_dnwell]

  # PP.5ci / PP.5cii: inside DNWELL and inside LVPWELL, split by whether the COMP edge
  # sits in the well's inner region or in the band along its edge.
  - name: pp5c_bg_all
    op: edges
    layers: [pplus_in_lvpwell_dn]
  - name: pp5c_bg
    op: not
    layers: [pp5c_bg_all, nplus.edges]
  - name: pp5c_fg_all
    op: edges
    layers: [pcomp_in_lvpwell_dn]
  - name: pp5c_fg_no_nplus
    op: not
    layers: [pp5c_fg_all, nplus.edges]
  - name: pp5ci_fg
    op: inside_part
    layers: [pp5c_fg_no_nplus, lvpwell_dn_sized_in]
  - name: pp5cii_fg
    op: inside_part
    layers: [pp5c_fg_no_nplus, lvpwell_dn_edge_band]

  # PP.5di / PP.5dii: outside DNWELL, split by whether the COMP edge is within 0.429 um
  # of an N-well.
  - name: pp5d_bg
    op: edges
    layers: [pplus_outside_dn]
  - name: pp5d_pcomp
    op: edges
    layers: [pcomp_outside_dn]
  - name: pp5d_fg_all
    op: not
    layers: [pp5d_pcomp, nplus.edges]
  - name: pp5di_fg_all
    op: outside_part
    layers: [pp5d_fg_all, nwell_n_dn_reach]
  - name: pp5dii_fg_all
    op: inside_part
    layers: [pp5d_fg_all, nwell_n_dn_reach]
  - name: pp5di_fg
    op: or
    layers: [pp5di_fg_all]
  - name: pp5dii_fg
    op: or
    layers: [pp5dii_fg_all]

  - name: pgate.edges
    op: edges
    layers: [pgate]
  - name: poly2.edges
    op: edges
    layers: [poly2_drawn]
  - name: guard_ring_mk.edges
    op: edges
    layers: [guard_ring_mk]
  - name: plfuse_efuse.edges
    op: edges
    layers: [plfuse_efuse]
  - name: ef04a_off_poly
    op: not
    layers: [plfuse_efuse.edges, poly2.edges]
  - name: ef04a_long_off
    op: outside_part
    layers: [ef04a_off_poly, poly2_drawn]
  - name: pp4b_poly
    op: inside_part
    layers: [poly2.edges, ngate_reach_flat]
  - name: np4b_poly
    op: inside_part
    layers: [poly2.edges, pgate_reach_flat]
  - name: nplus_butted_edges
    op: and
    layers: [nplus.edges, pcomp.edges]

  # NP.11: mirror of PP.11, on the other implant.
  - name: np11_at_nwell
    op: inside_part
    layers: [nplus_butted_edges, nwell_dn_outer_band]
  - name: np11_at_lvpwell
    op: inside_part
    layers: [nplus_butted_edges, lvpwell_dn_edge_band]
  - name: np11_viol
    op: or
    layers: [np11_at_nwell, np11_at_lvpwell]

  # NP.5b: the Nplus boundary that is not a butting edge, in an LVPWELL or clear of both
  # NWELL and DNWELL, against the NCOMP boundary it must extend past.
  - name: np5b_nplus_all
    op: not
    layers: [nplus.edges, nplus_butted_edges]
  - name: np5b_in_lvpwell
    op: inside_part
    layers: [np5b_nplus_all, lvpwell]
  - name: np5b_out_nwell
    op: outside_part
    layers: [np5b_nplus_all, nwell]
  - name: np5b_out_both
    op: outside_part
    layers: [np5b_out_nwell, dnwell]
  - name: np5b_nplus
    op: or
    layers: [np5b_in_lvpwell, np5b_out_both]

  # NP.5ci / NP.5cii: inside DNWELL but out of the LVPWELL, split by whether the NCOMP
  # edge falls within 0.429 um of the LVPWELL.
  - name: np5c_bg
    op: edges
    layers: [nplus_out_lvpwell_dn]
  - name: np5c_fg_all
    op: edges
    layers: [ncomp_out_lvpwell_dn]
  - name: np5c_fg_no_pplus
    op: not
    layers: [np5c_fg_all, pplus.edges]
  - name: np5ci_fg_all
    op: inside_part
    layers: [np5c_fg_no_pplus, lvpwell_dn_reach]
  - name: np5cii_fg_all
    op: outside_part
    layers: [np5c_fg_no_pplus, lvpwell_dn_reach]
  - name: np5ci_fg
    op: or
    layers: [np5ci_fg_all]
  - name: np5cii_fg
    op: or
    layers: [np5cii_fg_all]

  # NP.5di / NP.5dii: at an N-well and outside DNWELL, split by whether the NCOMP edge
  # sits in the band along the well edge or in its inner region.
  - name: np5d_bg_all
    op: edges
    layers: [nplus_at_nwell]
  - name: np5dii_bg
    op: not
    layers: [np5d_bg_all, pplus.edges]
  - name: np5d_fg_all
    op: edges
    layers: [ncomp_at_nwell]
  - name: np5d_fg_no_pplus
    op: not
    layers: [np5d_fg_all, pplus.edges]
  - name: np5di_fg_all
    op: inside_part
    layers: [np5d_fg_no_pplus, nwell_dn_edge_band]
  - name: np5dii_fg_all
    op: inside_part
    layers: [np5d_fg_no_pplus, nwell_n_dn_sized_in]
  - name: np5di_fg
    op: with_length
    min: 0.006
    layers: [np5di_fg_all]
  - name: np5dii_fg
    op: with_length
    min: 0.006
    layers: [np5dii_fg_all]

  # O.PL.2: the OTP gate's own two walls, and the poly width between them.
  - name: poly_otp.edges
    op: edges
    layers: [poly_otp]
  - name: opl2_channel
    op: and
    layers: [poly_otp.edges, tgate.edges]

  # O.PL.ORT: an orientation-restricted gate's width must run along x, so a channel edge
  # that is not horizontal is the violation.
  - name: comp_otp_no_poly.edges
    op: edges
    layers: [comp_otp_no_poly]
  - name: oplort_channel
    op: and
    layers: [comp_otp_no_poly.edges, tgate.edges]
  - name: oplort_turned
    op: without_angle
    min: 0
    max: 0
    layers: [oplort_channel]
  - name: oplort_viol
    op: outside_part
    layers: [oplort_turned, v5_xtor]
  # Channel length: the gate's own edges where they run inside the COMP, and the width
  # between them. Upstream says every one of these as an edge measurement, so they are
  # `min_width` on an edge layer rather than a region check with a mask.
  - name: tgate_pl2_lv.edges
    op: edges
    layers: [tgate_pl2_lv]
  - name: pl2_lv_channel
    op: inside_part
    layers: [tgate_pl2_lv.edges, comp]
  - name: ngate_5v.edges
    op: edges
    layers: [ngate_5v]
  - name: pl2_mv_n_channel
    op: inside_part
    layers: [ngate_5v.edges, comp]
  - name: pgate_5v.edges
    op: edges
    layers: [pgate_5v]
  - name: pl2_mv_p_channel
    op: inside_part
    layers: [pgate_5v.edges, comp]
  - name: ngate_6v.edges
    op: edges
    layers: [ngate_6v]
  - name: pl2_6v_n_channel
    op: inside_part
    layers: [ngate_6v.edges, comp]
  - name: pgate_6v.edges
    op: edges
    layers: [pgate_6v]
  - name: pl2_6v_p_channel
    op: inside_part
    layers: [pgate_6v.edges, comp]
  - name: poly_nat_lv.edges
    op: edges
    layers: [poly_nat_lv]
  - name: nat4_shared
    op: and
    layers: [poly_nat_lv.edges, ngate.edges]
  - name: nat4_channel
    op: outside_part
    layers: [nat4_shared, nwell]
  - name: poly_nat_mv.edges
    op: edges
    layers: [poly_nat_mv]
  - name: nat5_shared
    op: and
    layers: [poly_nat_mv.edges, ngate.edges]
  - name: nat5_channel
    op: outside_part
    layers: [nat5_shared, nwell]
  - name: poly_ymtp_lv.edges
    op: edges
    layers: [poly_ymtp_lv]
  - name: ypl2_lv_shared
    op: and
    layers: [poly_ymtp_lv.edges, tgate.edges]
  - name: ypl2_lv_channel
    op: outside_part
    layers: [ypl2_lv_shared, otp_mk]
  - name: poly_ymtp_mv.edges
    op: edges
    layers: [poly_ymtp_mv]
  - name: ypl2_mv_shared
    op: and
    layers: [poly_ymtp_mv.edges, tgate.edges]
  - name: ypl2_mv_channel
    op: outside_part
    layers: [ypl2_mv_shared, otp_mk]

  # PL.7: the width across a gate that bends at 45 degrees, measured between the gate's
  # own diagonal edges where they run inside the COMP. Angles normalise to [0, 180), so
  # upstream's 25..65 and -65..-25 are 25..65 and 115..155 here.
  - name: nom_gate.edges
    op: edges
    layers: [nom_gate]
  - name: nom_gate_in_comp
    op: inside_part
    layers: [nom_gate.edges, comp]
  - name: pl7_nom_rise
    op: with_angle
    min: 25
    max: 65
    layers: [nom_gate_in_comp]
  - name: pl7_nom_fall
    op: with_angle
    min: 115
    max: 155
    layers: [nom_gate_in_comp]
  - name: pl7_nom
    op: or
    layers: [pl7_nom_rise, pl7_nom_fall]
  - name: thick_gate.edges
    op: edges
    layers: [thick_gate]
  - name: thick_gate_in_comp
    op: inside_part
    layers: [thick_gate.edges, comp]
  - name: pl7_thick_rise
    op: with_angle
    min: 25
    max: 65
    layers: [thick_gate_in_comp]
  - name: pl7_thick_fall
    op: with_angle
    min: 115
    max: 155
    layers: [thick_gate_in_comp]
  - name: pl7_thick
    op: or
    layers: [pl7_thick_rise, pl7_thick_fall]
  - name: comp_3p3v_no_poly.edges
    op: edges
    layers: [comp_3p3v_no_poly]
  - name: comp_56v_no_poly.edges
    op: edges
    layers: [comp_56v_no_poly]
  - name: tgate.edges
    op: edges
    layers: [tgate]
  - name: channel_edges_3p3v
    op: and
    layers: [comp_3p3v_no_poly.edges, tgate.edges]
  - name: channel_edges_56v
    op: and
    layers: [comp_56v_no_poly.edges, tgate.edges]
