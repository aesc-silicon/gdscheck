  - name: metal5_needs_slot
    op: grow_x
    radius: 15.0
    mode: lazy
    layers: [metal5_unslotted_c]

  # ---- MIM capacitor, option B (mim_b deck) ------------------------------
  # The bottom plate is not drawn.  Upstream reconstructs it as `mimtm_virtual`: the
  # top plate oversized by 1.06 um, clipped to whichever Metal4 shape the top plate
  # actually sits on.  Every enclosure rule in the deck is measured against that
  # reconstruction rather than against Metal4 itself, so a routing shape elsewhere on
  # the same net is not mistaken for the plate.
  # A selection radius - "the plate reaches this far" - so it wants the slack: a via at
  # exactly 1.06 um only touches the grown region, and a whole-region test reads a
  # zero-area touch as no overlap. This is the one grow in either PDK that needs it.
  - name: fusetop_oversize
    op: grow
    radius: 1.06
    slack: 0.005
    mode: lazy
    layers: [fusetop]
  - name: topmin1_metal_at_fusetop
    op: interacting
    mode: lazy
    layers: [topmin1_metal, fusetop]
  - name: mimtm_virtual
    op: intersection
    mode: lazy
    layers: [fusetop_oversize, topmin1_metal_at_fusetop]
  # The vias that land on the reconstructed bottom plate, which MIMTM.2 measures.
  - name: mimtm_via
    op: overlapping
    mode: lazy
    layers: [top_via, mimtm_virtual]
  # MIMTM.5 measures the top plate against the vias that reach the *bottom* plate,
  # which are the ones touching Metal4.
  - name: top_via_on_topmin1_metal
    op: interacting
    mode: lazy
    layers: [top_via, topmin1_metal]
  # MIMTM.9 is the sea-of-via pitch on top of the plate, so only the vias fully on it.
  - name: top_via_in_fusetop
    op: inside
    mode: lazy
    layers: [top_via, fusetop]
  - name: fusetop_outside_cap_mk
    op: difference
    mode: lazy
    layers: [fusetop, cap_mk]
  # MIMTM.10: the bottom plate may only be contacted from above, so a Via3 landing on
  # the plate under the top plate is a violation wherever it appears.
  - name: topmin1_via_on_mim_bottom
    op: intersection
    mode: lazy
    layers: [topmin1_via, topmin1_metal, fusetop]

  # ---- DN.3: the PCOMP guard ring around a deep well --------------------
  # A PCOMP ring shows up as a hole in the merged PCOMP layer; the hole minus PCOMP
  # itself is the area the ring encloses.
  - name: pcomp_ring_interior
    op: difference
    mode: lazy
    layers: [pcomp_holes, pcomp]
  # A deep well with no ring around it at all.
  - name: dnwell_outside_ring
    op: not_inside
    mode: lazy
    layers: [dnwell, pcomp_ring_interior]
  # "Directly surrounded" also fails when the ring encloses somebody else's n-type
  # geometry as well - the ring is then shared rather than this well's own.
  - name: n_type_all
    op: union
    mode: lazy
    layers: [nat, ncomp, nwell]
  - name: foreign_n_type
    op: not_interacting
    mode: lazy
    layers: [n_type_all, dnwell]
  - name: pcomp_ring_shared
    op: covering
    mode: lazy
    layers: [pcomp_ring_interior, foreign_n_type]
  - name: dnwell_in_shared_ring
    op: inside
    mode: lazy
    layers: [dnwell, pcomp_ring_shared]
  - name: dn3_viol
    op: union
    mode: lazy
    layers: [dnwell_outside_ring, dnwell_in_shared_ring]

  # ---- PL.6: right-angle poly bends over active ---------------------------
  # The rule exempts YMTP_MK, and the exemption applies to the *corner*, not to the poly:
  # subtracting the marker from poly2 first would invent new corners along the marker's
  # own edge.  So poly2 is examined whole and the corner is filtered instead.
  - name: comp_no_ymtp
    op: difference
    mode: lazy
    layers: [comp, ymtp_mk]

# The drawn layer table.  Variant D is a 5LM stack, so the
# 6LM-only layers (via5 and the metaltop family) are absent.
  # ---- LDMOS rules the engine can already say ------------------------------
  # MDN.7: NCOMP or gate reaching an MVSD, or COMP inside one, outside the LDMOS marker.
  - name: mdn7_ncomp_at_mvsd
    op: interacting
    mode: lazy
    layers: [ncomp, mvsd]
  - name: mdn7_a1
    op: difference
    mode: lazy
    layers: [mdn7_ncomp_at_mvsd, poly2_drawn]
  - name: mdn7_a
    op: difference
    mode: lazy
    layers: [mdn7_a1, mvsd]
  - name: mdn7_ngate_at_mvsd
    op: interacting
    mode: lazy
    layers: [ngate, mvsd]
  - name: mdn7_b
    op: difference
    mode: lazy
    layers: [mdn7_ngate_at_mvsd, mvsd]
  - name: mdn7_c
    op: intersection
    mode: lazy
    layers: [ncomp, mvsd]
  - name: mdn7_all
    op: union
    mode: lazy
    layers: [mdn7_a, mdn7_b, mdn7_c]
  - name: mdn7_dg
    op: intersection
    mode: lazy
    layers: [mdn7_all, dualgate]
  - name: mdn7_viol
    op: difference
    mode: lazy
    layers: [mdn7_dg, ldmos_xtor]

  # MDP.9d: gate poly overlapping the sized source region, or not reaching it at all.
  - name: mdp9d_poly_dg
    op: intersection
    mode: lazy
    layers: [poly2_drawn, dualgate]
  - name: mdp9d_poly
    op: intersection
    mode: lazy
    layers: [mdp9d_poly_dg, ldmos_xtor]
  - name: mdp9d_l1
    op: overlapping
    mode: lazy
    layers: [mdp9d_poly, mdp9d_exclude]
  - name: ldmos_xtor_at_mvpsd
    op: interacting
    mode: lazy
    layers: [ldmos_xtor, mvpsd]
  - name: mdp9d_poly_mv
    op: intersection
    mode: lazy
    layers: [mdp9d_poly_dg, ldmos_xtor_at_mvpsd]
  - name: mdp9d_l2
    op: not_interacting
    mode: lazy
    layers: [mdp9d_poly_mv, mdp9d_exclude]
  - name: mdp9d_viol
    op: union
    mode: lazy
    layers: [mdp9d_l1, mdp9d_l2]

  # MDP.3d / MDP.4: COMP under an LDMOS marker but not under Metal1, whose uncovered
  # boundary runs longer than 10 um.
  - name: mdp3d_ncomp
    op: interacting
    mode: lazy
    layers: [ncomp, ldmos_xtor_at_mvpsd]
  - name: mdp3d_ncomp_dg
    op: interacting
    mode: lazy
    layers: [mdp3d_ncomp, dualgate]
  - name: mdp3d_bare
    op: difference
    mode: lazy
    layers: [mdp3d_ncomp_dg, metal1]
  - name: mdp4_pcomp_off
    op: not_interacting
    mode: lazy
    layers: [pcomp, mvpsd]
  - name: mdp4_pcomp_at
    op: interacting
    mode: lazy
    layers: [mdp4_pcomp_off, ldmos_xtor_at_mvpsd]
  - name: mdp4_pcomp_dg
    op: interacting
    mode: lazy
    layers: [mdp4_pcomp_at, dualgate]
  - name: mdp4_bare
    op: difference
    mode: lazy
    layers: [mdp4_pcomp_dg, metal1]

  # MDN.10b: the NCOMP boundary that reaches a gate, against the gate's own boundary.
  - name: mdn10b_ncomp
    op: interacting
    mode: lazy
    layers: [ncomp, poly_mdn10]

  # ---- "Crosses out" halves ------------------------------------------------
  # Every enclosure rule below is an OR upstream: the margin, and a shape that overlaps
  # what should contain it but runs outside. The second has no margin to measure - the
  # shape crosses the boundary - so the enclosure check is structurally blind to it, and
  # each of these is that half, reported under the same rule id.
  - name: co_3_crossing_all
    op: overlapping
    mode: lazy
    layers: [contact_no_sram, poly2_drawn]
  - name: co_3_crossing
    op: difference
    mode: lazy
    layers: [co_3_crossing_all, poly2_drawn]
  - name: co_4_crossing_all
    op: overlapping
    mode: lazy
    layers: [contact_no_sram, comp]
  - name: co_4_crossing
    op: difference
    mode: lazy
    layers: [co_4_crossing_all, comp]
  - name: dv_1_crossing_all
    op: overlapping
    mode: lazy
    layers: [dnwell, dualgate]
  - name: dv_1_crossing
    op: difference
    mode: lazy
    layers: [dv_1_crossing_all, dualgate]
  - name: dv_6_crossing_all
    op: overlapping
    mode: lazy
    layers: [comp_dv, dualgate]
  - name: dv_6_crossing
    op: difference
    mode: lazy
    layers: [dv_6_crossing_all, dualgate]
  - name: dv_8_crossing_all
    op: overlapping
    mode: lazy
    layers: [poly2_drawn, dualgate]
  - name: dv_8_crossing
    op: difference
    mode: lazy
    layers: [dv_8_crossing_all, dualgate]
  - name: hres_4_crossing_all
    op: overlapping
    mode: lazy
    layers: [hres_poly, resistor]
  - name: hres_4_crossing
    op: difference
    mode: lazy
    layers: [hres_4_crossing_all, resistor]
  - name: hres_7_crossing_all
    op: overlapping
    mode: lazy
    layers: [hres_contact, pplus]
  - name: hres_7_crossing
    op: difference
    mode: lazy
    layers: [hres_7_crossing_all, pplus]
  - name: mdp_12_crossing_all
