# Net extraction.  Upstream states connectivity as bare `connect(a, b)` pairs; this
# engine is connector-based - a via/contact layer bridges the conductors it sits
# inside - so the pairs that have no drawn connector (a well tie, an LDMOS drain)
# get one derived for them below, named `*_tap`.  One conductor per entry, ordered
# bottom-up, so an antenna rule can cut the stack at a given level.
connectivity:
  # ORDERED.  The antenna deck selects a net by *prefix* of this list - the stack as it
  # exists partway through processing - so the index of every step is load-bearing and
  # the order mirrors the antenna rules' own connect phases: gates and diffusions
  # first, then the wells, then the metal stack one level at a time.  Inserting a step
  # shifts every level above it; tests/pdk_integrity.rs pins the list so that breaks
  # loudly.  Indices are noted where an antenna rule names them.
  - connector: contact           # 0
    layers: [poly2_drawn]
  - connector: contact           # 1
    layers: [ncomp_con]
  - connector: contact           # 2
    layers: [pcomp_con]
  - connector: contact           # 3
    layers: [natcomp_con]
  # Well ties and device bodies: the tap diffusion is the connector between the well
  # and the contacted active it straps.  These sit ahead of the metal stack because
  # upstream's antenna phases have the wells connected from the contact level up.
  - connector: ntap              # 4
    layers: [nwell, nw_lv, nw_mv, ncomp_con]
  # `dnwell` itself is listed beside `dnwell_n` so the deep well has a net of its own:
  # DN.2a/DN.2b are the same-potential/different-potential spacing pair, and without the
  # drawn layer in the graph neither can resolve one.
  - connector: ntap_dn           # 5
    layers: [dnwell_n, ncomp_con, dnwell]
  - connector: ptap              # 6
    layers: [lvpwell, lvpwell_dn_lv, lvpwell_dn_mv, pcomp_con]
  - connector: mvsd_tap          # 7
    layers: [mvsd, ncomp_con]
  - connector: ntap              # 8
    layers: [nwell, mvsd]
  - connector: mvpsd_tap         # 9
    layers: [mvpsd, pcomp_con]
  - connector: contact           # 10 - end of the pre-metal net (ANT.8)
    layers: [metal1_drawn]
  - connector: via1              # 11
    layers: [metal1_drawn]
  - connector: via1              # 12
    layers: [metal2_drawn]
  - connector: via2              # 13
    layers: [metal2_drawn]
  - connector: via2              # 14
    layers: [metal3_drawn]
  - connector: via3              # 15
    layers: [metal3_drawn]
  # MIM option B ties the cap plate in at the Via3 phase (`connect(via3, fusetop)` in
  # antenna.rb).  It sits inside the Via3 phase, before Via3 reaches Metal4, so the
  # MIM antenna rules see the plate on the same net as the via that lands on it.
  - connector: via3              # 16
    layers: [fusetop]
  - connector: via3              # 17
    layers: [metal4_drawn]
  - connector: via4              # 18
    layers: [metal4_drawn]
  - connector: via4              # 19
    layers: [metal5_drawn]
  # Outside every antenna phase: the electrical bridge from the MIM plate to the top
  # metal, which the geometry decks' net-aware checks need but the antenna phases,
  # following upstream, do not have.
  - connector: mimcap_top_tap    # 20
    layers: [fusetop, metal5_drawn]

# The derived layer table every deck is written against (the design rules' generic
# layers, plus the metal aliases).  Upstream chains these
# several levels deep - psd_dn rests on pgate_dn on pgate on pactive on pcomp on
# comp - and only `mode: lazy` layers may reference another virtual layer, so the
# whole table is lazy.  A deck needing one of these under a whole-layout check
# (inside_boundary) must mark that entry `mode: global` and flatten the chain.
#
# Where upstream composes several operations in one expression, the intermediate
# steps are named here rather than inlined; they carry the suffix that says what is
# still to be removed (`_all`, `_touching`).
virtual_layers:
  # ---- Wells --------------------------------------------------------------
  dnwell_n: dnwell not lvpwell
  dnwell_p: dnwell and lvpwell
  all_nwell: dnwell_n or nwell

  # ---- Comps and gates ----------------------------------------------------
  ncomp: comp and nplus
  pcomp: comp and pplus
  ncomp_con: ncomp not poly2_drawn
  pcomp_con: pcomp not poly2_drawn
  tgate_all: poly2_drawn and comp
  tgate: tgate_all not res_mk

  # ---- N devices ----------------------------------------------------------
  nactive: ncomp not all_nwell
  n_diode: ncomp_con not nwell
  ngate: nactive and tgate
  # Source/drain: the active regions that meet a gate, gate itself removed.  Upstream
  # uses KLayout `interacting`, so a region abutting the gate with no overlap counts.
  nsd_touching: nactive interacting ngate
  nsd: nsd_touching not ngate not res_mk
  ptap: pcomp not all_nwell not res_mk

  # ---- P devices ----------------------------------------------------------
  pactive: pcomp and all_nwell
  p_diode: pcomp_con and nwell
  pgate: pactive and tgate
  psd_touching: pactive interacting pgate
  ntap_all: ncomp and all_nwell
  ntap: ntap_all not res_mk

  # ---- Inside the deep N-well --------------------------------------------
  ngate_dn: ngate and dnwell_p
  ptap_dn_all: ptap and dnwell_p
  pgate_dn: pgate and dnwell_n
  ntap_dn: ntap and dnwell_n
  pcomp_dn: pcomp and dnwell_n
  psd_dn_touching: pcomp_dn interacting pgate_dn
  psd_dn: psd_dn_touching not pgate_dn not res_mk
  ncomp_dn: ncomp and dnwell_p
  nsd_dn_touching: ncomp_dn interacting ngate_dn
  nsd_dn: nsd_dn_touching not ngate_dn not res_mk

  # ---- Native-VT device ---------------------------------------------------
  natcomp: nat and comp
  natcomp_con: natcomp not poly2_drawn

  # ---- Gate voltage classes ----------------------------------------------
  # dualgate marks the thick-oxide (5/6 V) devices; v5_xtor then splits those into
  # 5 V (inside it) and 6 V (outside it).
  nom_gate: tgate not dualgate
  thick_gate: tgate and dualgate
  ngate_56v: ngate and dualgate
  pgate_56v: pgate and dualgate
  ngate_5v: ngate_56v and v5_xtor
  pgate_5v: pgate_56v and v5_xtor
  ngate_6v: ngate_56v not v5_xtor
  pgate_6v: pgate_56v not v5_xtor

  # ---- Deep N-well voltage classes ---------------------------------------
  # Whole-region selectors, not booleans: a deep well is 3.3 V only if it touches
  # neither marker anywhere, and 5/6 V if it overlaps dualgate anywhere.
  dnwell_no_v5: dnwell not_interacting v5_xtor
  dnwell_3p3v: dnwell_no_v5 not_interacting dualgate
  dnwell_56v: dnwell overlapping dualgate

  # ---- LVPWELL ------------------------------------------------------------
  lvpwell_dn: lvpwell interacting dnwell
  lvpwell_out: lvpwell not_interacting dnwell
  lvpwell_dn3p3v: lvpwell and dnwell_3p3v
  lvpwell_dn56v: lvpwell and dnwell_56v

  # ---- NWELL --------------------------------------------------------------
  # NW.5's other half: an N-well that overlaps the DNWELL but runs outside it. There is no
  # margin to measure there - the well crosses the boundary - so the enclosure check
  # cannot see it, and upstream ORs this in as a second violation set. The MV variant
  # takes plain `nwell` where the LV one takes `nw_lv`; that asymmetry is upstream's.
  nw5_lv_crossing_all: nw_lv overlapping dnwell
  nw5_lv_crossing: nw5_lv_crossing_all not dnwell
  nw5_mv_crossing_all: nwell overlapping dnwell
  nw5_mv_crossing: nw5_mv_crossing_all not dnwell
  nwell_n_dn: nwell not_interacting dnwell

  # ---- Drawn plus dummy ---------------------------------------------------
  # Most rules run on the conductor as fabricated, which includes the fill.
  poly2: poly2_drawn or poly2_dummy
  metal1: metal1_drawn or metal1_dummy
  metal2: metal2_drawn or metal2_dummy
  metal3: metal3_drawn or metal3_dummy
  metal4: metal4_drawn or metal4_dummy
  metal5: metal5_drawn or metal5_dummy

  # ---- Top-of-stack aliases ----------------------------------------------
  # Metal5 and Via4.  Upstream's METAL_STACK_MAP gives 5LM `top_metal: metal5` and
  # `top_via: via4`, and registers no MetalTop or Via5 at all for this variant.
  #
  # A single-source union is the alias: it renames without copying a rule set.
  top_metal: metal5
  topmin1_metal: metal4
  top_via: via4
  topmin1_via: via3

  # ---- N-well voltage classes (nwell deck) --------------------------------
  # Upstream builds these as deck-local variables (`nw_lv`, `nw_mv`); they are named
  # here so a rule can reference them, keeping the upstream names for traceability.
  # A well is low-voltage only if it touches neither marker *anywhere*, so these are
  # whole-region selectors and not booleans against the markers.
  nw_no_v5: nwell not_interacting v5_xtor
  nw_lv: nw_no_v5 not_interacting dualgate
  nw_mv: nwell overlapping dualgate
  # NW.2a exempts the YMTP marker.  Upstream drops the violation markers that fall
  # inside it; filtering the well instead is not the same thing where a marker covers
  # the gap but not the wells, so revisit this if a YMTP design disagrees.
  nw_lv_no_ymtp: nw_lv not_inside ymtp_mk
  nw_mv_no_ymtp: nw_mv not_inside ymtp_mk
  # NW.1b: an N-well used as a resistor.  The marker has to reach beyond the well it
  # marks (`interacting` then `not_inside`), which is what separates a resistor from a
  # marker sitting wholly within a well for some other reason.
  res_mk_at_nwell: res_mk interacting nwell
  nw_res_mk: res_mk_at_nwell not_inside nwell
  nw_lv_out_dnwell: nw_lv not_overlapping dnwell
  nw_mv_out_dnwell: nw_mv not_overlapping dnwell
  nw_res_lv: nw_lv_out_dnwell and nw_res_mk
  nw_res_mv: nw_mv_out_dnwell and nw_res_mk
  # NW.4 and NW.6 are "this must not exist" rules: the layer is the error.
  nwell_on_lvpwell: nwell and lvpwell
  nwell_in_res_mk: nwell inside res_mk
  nwell_res_in_dnwell: nwell_in_res_mk and dnwell

  # ---- COMP voltage classes (comp deck) -----------------------------------
  # Same shape as the well classes: low-voltage COMP touches neither marker
  # anywhere, medium-voltage COMP overlaps dualgate.
  comp_no_v5: comp not_interacting v5_xtor
  comp_3p3v: comp_no_v5 not_interacting dualgate
  comp_56v: comp overlapping dualgate
  drc_bjt_two_comp: drc_bjt interacting min 2 comp_56v
  df3c_viol: comp_56v and drc_bjt_two_comp
  mvsd_or_mvpsd: mvsd or mvpsd
  comp_56v_no_mv: comp_56v not mvsd_or_mvpsd
  comp_moscap: comp and mos_cap_mk
  comp_no_moscap: comp not mos_cap_mk
  # DF.2b caps COMP width at 100 um.  Upstream writes it as sized(-50).sized(50),
  # which is an opening: anything not at least 100 um across erodes away, so
  # whatever survives is the violation.
  comp_over_100um: comp_no_moscap open 50
  comp_3p3v_no_otp: comp_3p3v not otp_mk
  comp_56v_no_otp: comp_56v not otp_mk
  comp_3p3v_bjt: comp_3p3v and drc_bjt
  comp_no_otp: comp not otp_mk

  # DF.3b: NCOMP butted to PCOMP.  Butting is allowed only when the two sit in the
  # same well; upstream's not_outside is this engine's overlapping.
  ncomp_butted: ncomp interacting pcomp
  ntap_on_pactive: ntap overlapping pactive
  ptap_on_nactive: ptap overlapping nactive
  df3b_same_well: ntap_on_pactive or ptap_on_nactive
  df3b_moscap: ncomp_butted and mos_cap_mk
  df3b_bad: df3b_same_well or df3b_moscap
  df3b_viol: comp and df3b_bad
  comp_butted: comp interacting ncomp_butted

  # ---- Taps and COMP inside the deep N-well -------------------------------
  ntap_dn3p3v: ntap_dn and dnwell_3p3v
  ntap_dn56v: ntap_dn and dnwell_56v
  pcomp_dn3p3v: pcomp and dnwell_3p3v
  pcomp_dn56v: pcomp and dnwell_56v
  pcomp_dn56v_no_sram: pcomp_dn56v not sramcore
  ptap_lvpwell_dn3p3v: ptap and lvpwell_dn3p3v
  ptap_lvpwell_dn56v: ptap and lvpwell_dn56v
  ncomp_dn3p3v: ncomp and dnwell_3p3v
  ncomp_dn56v: ncomp and dnwell_56v
  df8_ncomp3p3v: ncomp_dn3p3v and lvpwell_dn3p3v
  df8_ncomp56v_all: ncomp_dn56v and lvpwell_dn56v
  df8_ncomp56v: df8_ncomp56v_all not sramcore

  # ---- N-well overlap of COMP outside the deep N-well ---------------------
  nwell_n_dn_no_sram: nwell_n_dn not sramcore
  nw_ndn_sram_no_v5: nwell_n_dn_no_sram not_interacting v5_xtor
  nw_ndn_sram_3p3v: nw_ndn_sram_no_v5 not_interacting dualgate
  nw_ndn_sram_56v: nwell_n_dn_no_sram overlapping dualgate
  df4c_pcomp3p3v: pcomp and nw_ndn_sram_3p3v
  df4c_pcomp56v: pcomp and nw_ndn_sram_56v
  df4d_nwell: nwell_n_dn not ymtp_mk not neo_ee_mk
  ncomp_3p3v: nplus and comp_3p3v
  ncomp_56v: nplus and comp_56v
  pcomp_3p3v: pplus and comp_3p3v
  pcomp_56v: pplus and comp_56v
  df4d_ncomp3p3v: ncomp_3p3v and df4d_nwell
  df4d_ncomp56v: ncomp_56v and df4d_nwell

  # ---- DF.6: COMP must extend beyond the gate ----------------------------
  df6_exclude: otp_mk or ymtp_mk or sramcore or mvsd or mvpsd
  comp_at_tgate: comp interacting tgate
  df6_comp: comp_at_tgate not df6_exclude
  df6_poly: poly2_drawn not df6_exclude
  df6_comp3p3v: comp_3p3v and df6_comp
  df6_comp56v: comp_56v and df6_comp

  # ---- COMP outside both wells, and the N-well it must stay clear of -----
  ncomp_out_nw_dn: ncomp not nwell not dnwell
  pcomp_out_nw_dn: pcomp not nwell not dnwell
  nwell_n_dn_no_v5: nwell_n_dn not_interacting v5_xtor
  nwell_n_dn3p3v: nwell_n_dn_no_v5 not_interacting dualgate
  nwell_n_dn56v: nwell_n_dn overlapping dualgate
  nwell_n_dn3p3v_no_ymtp: nwell_n_dn3p3v not ymtp_mk
  nwell_n_dn56v_no_ymtp: nwell_n_dn56v not ymtp_mk
  ymtp_or_sram: ymtp_mk or sramcore
  df16_ncomp_lv_all: ncomp_out_nw_dn interacting ncomp_3p3v
  df16_ncomp_lv: df16_ncomp_lv_all not ymtp_or_sram
  df16_ncomp_mv_all: ncomp_out_nw_dn interacting ncomp_56v
  df16_ncomp_mv: df16_ncomp_mv_all not_inside ymtp_or_sram
  df17_pcomp_lv: pcomp_3p3v and pcomp_out_nw_dn
  df17_pcomp_mv: pcomp_56v and pcomp_out_nw_dn

  # ---- DF.12 / DF.13 / DF.14 ---------------------------------------------
  comp_no_schottky: comp not_interacting schottky_diode
  comp_no_implant: comp_no_schottky not nplus not pplus
  pactive_no_v5: pactive not_interacting v5_xtor
  pactive_3p3v: pactive_no_v5 not_interacting dualgate
  pactive_56v: pactive overlapping dualgate
  nactive_no_v5: nactive not_interacting v5_xtor
  nactive_3p3v: nactive_no_v5 not_interacting dualgate
  nactive_56v: nactive overlapping dualgate

  # ---- BJT recognition (drc_bjt / lvs_bjt decks) --------------------------
  # An NPN is recognised by a DRC_BJT marker meeting all three terminals; the rule
  # then asks whether that marker actually covers the deep well beneath it.
  vnpn_e: ncomp and lvs_bjt and dnwell and drc_bjt
  vnpn_b: pcomp and lvpwell and dnwell and drc_bjt
  vnpn_c_all: ncomp and dnwell and drc_bjt
  vnpn_c: vnpn_c_all not lvs_bjt
  bjt_npn_e: drc_bjt interacting vnpn_e
  bjt_npn_eb: bjt_npn_e interacting vnpn_b
  bjt_npn: bjt_npn_eb interacting vnpn_c
  bjt1_viol: bjt_npn not_covering dnwell
  pcomp_psub: pcomp not_overlapping all_nwell
  pcomp_psub_bjt: pcomp_psub interacting drc_bjt
  bjt2_viol: drc_bjt not_covering pcomp_psub_bjt
  comp_outside_bjt: comp not_overlapping drc_bjt
  ncomp_at_lvsbjt: ncomp interacting lvs_bjt
  vnpn_emitter: ncomp_at_lvsbjt inside dnwell
  pcomp_at_lvsbjt: pcomp interacting lvs_bjt
  vpnp_emitter: pcomp_at_lvsbjt inside nwell
  bjt_emitters: vnpn_emitter or vpnp_emitter
  lvsbjt1_viol: bjt_emitters not lvs_bjt

  # ---- Dualgate -----------------------------------------------------------
  # DV.6 exempts the substrate tap, which is PCOMP outside the N-well.
  pcomp_outside_nwell: pcomp not_overlapping nwell
  comp_dv: comp not pcomp_outside_nwell
  comp_outside_dualgate: comp not_overlapping dualgate
  # DV.7: a dualgate that meets a COMP but does not contain it is a partial overlap.
  dv_over_comp: dualgate overlapping comp_dv
  dv_covering_comp: dualgate covering comp_dv
  dv7_viol: dv_over_comp not dv_covering_comp
  # DV.9: one N-well holding both a 5/6 V and a 3.3 V PMOS gate.
  pgate_dualgate: pgate and dualgate
  pgate_no_v5: pgate not_inside v5_xtor
  pgate_lv: pgate_no_v5 not_inside dualgate
  nwell_with_mv_pgate: nwell covering pgate_dualgate
  dv9_viol: nwell_with_mv_pgate covering pgate_lv

  # ---- Dummy exclude ------------------------------------------------------
  ndmy_or_pmndmy: ndmy or pmndmy

  # ---- Metal, Cu pillar and guard ring -----------------------------------
  # M1.1 exempts the 3.3 V SRAM core, which has its own S.M1.1_LV rule.
  sram_lv_no_v5: sramcore not_interacting v5_xtor
  sram_lv: sram_lv_no_v5 not_interacting dualgate
  metal1_no_sram: metal1_drawn not sram_lv
  metal1_wide10_a: metal1_drawn shrink_x 5
  metal1_wide10_b: metal1_wide10_a shrink_y 5
  metal1_wide10_c: metal1_wide10_b grow_x 5
  metal1_wide10_d: metal1_wide10_c grow_y 5
  metal1_wide10: metal1_wide10_d and metal1_drawn
  metal2_wide10_a: metal2_drawn shrink_x 5
  metal2_wide10_b: metal2_wide10_a shrink_y 5
  metal2_wide10_c: metal2_wide10_b grow_x 5
  metal2_wide10_d: metal2_wide10_c grow_y 5
  metal2_wide10: metal2_wide10_d and metal2_drawn
  metal3_wide10_a: metal3_drawn shrink_x 5
  metal3_wide10_b: metal3_wide10_a shrink_y 5
  metal3_wide10_c: metal3_wide10_b grow_x 5
  metal3_wide10_d: metal3_wide10_c grow_y 5
  metal3_wide10: metal3_wide10_d and metal3_drawn
  metal4_wide10_a: metal4_drawn shrink_x 5
  metal4_wide10_b: metal4_wide10_a shrink_y 5
  metal4_wide10_c: metal4_wide10_b grow_x 5
  metal4_wide10_d: metal4_wide10_c grow_y 5
  metal4_wide10: metal4_wide10_d and metal4_drawn
  top_metal_wide10_a: top_metal shrink_x 5
  top_metal_wide10_b: top_metal_wide10_a shrink_y 5
  top_metal_wide10_c: top_metal_wide10_b grow_x 5
  top_metal_wide10_d: top_metal_wide10_c grow_y 5
  top_metal_wide10: top_metal_wide10_d and top_metal
  dm8_sensitive: fusetop or polyfuse or fusewindow_d or pmndmy or mtpmark or otp_mk
  comp_in_guard_ring: comp overlapping guard_ring_mk
  contact_in_guard_ring: contact overlapping guard_ring_mk
  via1_in_guard_ring: via1 overlapping guard_ring_mk
  via2_in_guard_ring: via2 overlapping guard_ring_mk
  via3_in_guard_ring: via3 overlapping guard_ring_mk
  via4_in_guard_ring: via4 overlapping guard_ring_mk
  pcomp_in_guard_ring: pcomp overlapping guard_ring_mk
  gr1_mk_viol: guard_ring_mk not comp_in_guard_ring
  gr1_comp_viol: comp_in_guard_ring not guard_ring_mk
  gr3_viol: comp_in_guard_ring not pplus
  guard_ring_no_pad: guard_ring_mk not_interacting pad
  metal1_pad: metal1_drawn interacting pad
  metal1_pad_nogr: metal1_pad not_interacting guard_ring_mk
  metal1_in_guard_ring: metal1 overlapping guard_ring_mk
  metal2_pad: metal2_drawn interacting pad
  metal2_pad_nogr: metal2_pad not_interacting guard_ring_mk
  metal2_in_guard_ring: metal2 overlapping guard_ring_mk
  metal3_pad: metal3_drawn interacting pad
  metal3_pad_nogr: metal3_pad not_interacting guard_ring_mk
  metal3_in_guard_ring: metal3 overlapping guard_ring_mk
  metal4_pad: metal4_drawn interacting pad
  metal4_pad_nogr: metal4_pad not_interacting guard_ring_mk
  metal4_in_guard_ring: metal4 overlapping guard_ring_mk
  metal5_pad: metal5_drawn interacting pad
  metal5_pad_nogr: metal5_pad not_interacting guard_ring_mk
  metal5_in_guard_ring: metal5 overlapping guard_ring_mk

  # ---- Native-VT device (nat deck) ----------------------------------------
  ncomp_outside_nwell: ncomp not_overlapping nwell
  nat_ncomp: ncomp_outside_nwell interacting nat
  comp_outside_nat: comp not_overlapping nat
  # NAT.8: the part of a NAT that overlaps dualgate but reaches outside it.
  nat_over_dualgate: nat overlapping dualgate
  nat8_viol: nat_over_dualgate not dualgate
  dpf1_viol: poly2_dummy not_covering comp_dummy
  poly_nat_no_v5: poly_nat not_interacting v5_xtor
  poly_nat_lv: poly_nat_no_v5 not_interacting dualgate
  poly_nat_mv: poly_nat overlapping dualgate
  nat10_viol: nwell and nat
  ncomp_in_nat: ncomp and nat
  nat11_viol: ncomp_in_nat not_interacting poly2_drawn
  poly_nat: poly2_drawn and nat
  poly_nat_no_comp: poly_nat not_interacting comp
  poly_nat_res: poly_nat and res_mk
  # NAT.9: poly under the marker that runs from one of its gates to another is an
  # interconnect, and poly that belongs to no gate of it has to keep its distance.
  nat9_gate: ngate and nat
  nat9_interconnect: poly_nat interacting min 2 nat9_gate
  poly_off_nat: poly2_drawn not_interacting nat
  nat12_viol: poly_nat_no_comp or poly_nat_res

  # ---- LVPWELL ------------------------------------------------------------
  lvpwell_dn_no_v5: lvpwell_dn not_interacting v5_xtor
  lvpwell_dn_lv: lvpwell_dn_no_v5 not_interacting dualgate
  lvpwell_dn_mv: lvpwell_dn overlapping dualgate
  lvpwell_out_dn: lvpwell not_overlapping dnwell
  lpw12_viol: lvpwell_out_dn and nwell
  # LPW.5: an LVPWELL used as a resistor must sit inside a deep well.
  lpw_well_exclude: poly2_drawn or dualgate or resistor or sab
  lvpwell_at_pcomp: lvpwell interacting pcomp
  lvpwell_res_all: lvpwell_at_pcomp and res_mk
  lvpwell_res: lvpwell_res_all not lpw_well_exclude
  lpw5_viol: lvpwell_res not dnwell

  # ---- ESD implant --------------------------------------------------------
  poly_esd: poly2_mv interacting esd
  esd_on_pcomp: esd overlapping pcomp
  nplus_or_pplus: nplus or pplus
  esd_no_dualgate: esd not_overlapping dualgate
  comp_esd: comp and esd
  comp_esd_at_lvsio: comp_esd overlapping lvs_io
  esd10_viol: comp_esd_at_lvsio not lvs_io

  # ---- Contact ------------------------------------------------------------
  # The SRAM core has its own contact rules (S.CO.*), so the main ones exclude it.
  contact_no_sram: contact not sramcore
  # A butted COMP touches the opposite implant without overlapping it.
  ncomp_butted_only: ncomp_butted not_overlapping pcomp
  pcomp_butted_all: pcomp interacting ncomp
  pcomp_butted_only: pcomp_butted_all not_overlapping ncomp
  contact_on_ncomp_butted: contact interacting ncomp_butted_only
  contact_on_pcomp_butted: contact interacting pcomp_butted_only
  contact_on_comp: contact and comp
  contact_on_comp_no_otp: contact_on_comp not otp_mk
  tgate_no_otp: tgate not otp_mk
  contact_on_poly: contact and poly2_drawn
  co10_viol: contact and tgate
  co11_viol: contact not poly2_drawn not comp

  # ---- SRAM 3.3 V ---------------------------------------------------------
  pcomp_out_dnwell: pcomp not_overlapping dnwell
  pcomp_out_dn_sram: pcomp_out_dnwell and sram_lv
  nwell_n_dn_sram: nwell_n_dn and sram_lv
  ncomp_out_nw_dn_sram: ncomp_out_nw_dn and sram_lv
  contact_sram: contact and sramcore
  poly_sram: poly2_drawn and sramcore
  comp_sram: comp and sramcore
  metal1_sram: metal1_drawn and sramcore

  comp_3p3v_no_poly: comp_3p3v not poly2_drawn
  comp_56v_no_poly: comp_56v not poly2_drawn

  # ---- Gate poly (poly2 deck) ---------------------------------------------
  poly2_no_v5: poly2_drawn not_interacting v5_xtor
  poly2_lv: poly2_no_v5 not_interacting dualgate
  poly2_mv: poly2_drawn overlapping dualgate
  # PL.1 splits on the poly fuse: the interconnect rule applies outside it, a separate
  # one inside.  `inside`/`not_overlapping` select whole regions, as upstream does.
  poly2_lv_out_plfuse_all: poly2_lv not_overlapping plfuse
  poly2_lv_out_plfuse: poly2_lv_out_plfuse_all not ymtp_mk
  poly2_mv_out_plfuse_all: poly2_mv not_overlapping plfuse
  poly2_mv_out_plfuse: poly2_mv_out_plfuse_all not ymtp_mk
  poly2_lv_in_plfuse: poly2_lv inside plfuse
  poly2_mv_in_plfuse: poly2_mv inside plfuse
  # The "pl" layers drop every marker that carries its own rule set.
  pl_exclude: otp_mk or ymtp_mk or mvsd or mvpsd
  poly_pl_lv: poly2_lv not pl_exclude
  poly_pl_mv_all: poly2_mv not pl_exclude
  poly_pl_mv: poly_pl_mv_all not_overlapping sramcore
  comp_pl: comp not pl_exclude
  # PL.2: the gate region whose channel length is measured.
  tgate_at_poly2_lv: tgate interacting poly2_lv
  tgate_pl2_lv: tgate_at_poly2_lv not otp_mk not ymtp_mk
  # PL.3a: poly on COMP plus field poly, which is where the spacing rule applies.
  poly2_field: poly2_drawn not comp
  poly2_on_comp_or_field: tgate or poly2_field
  pl3a_poly: poly2_on_comp_or_field not otp_mk
  # PL.9: one poly interconnect touching both a 3.3 V and a 5/6 V area.
  poly2_lv_area: poly2_no_v5 not dualgate
  poly2_dualgate: poly2_drawn and dualgate
  pl9_a: poly2_drawn interacting poly2_lv_area
  pl9_viol: pl9_a interacting poly2_dualgate
  # PL.11 / PL.12: the V5_XTOR marker must enclose what it marks.
  dualgate_or_otp: dualgate or otp_mk
  pl11_viol: v5_xtor not_interacting dualgate_or_otp
  comp_at_poly2: comp interacting poly2_drawn
  comp_at_v5: comp_at_poly2 interacting v5_xtor
  pl12_viol: comp_at_v5 not v5_xtor

  # ---- Salicide block (sab deck) ------------------------------------------
  sab_out_otp: sab not_overlapping otp_mk
  poly_sab: poly2_drawn interacting sab
  comp_sab: comp interacting sab
  sab_poly: sab and poly2_drawn
  comp_unrelated_sab: comp not_overlapping sab_out_otp
  poly_field_no_sab_all: poly2_drawn not comp
  poly_field_no_sab: poly_field_no_sab_all not_overlapping sab
  poly_on_comp: poly2_drawn and comp
  sab_on_contact: sab_out_otp and contact
  contact_on_sab: contact and sab
  sab_poly_np: sab_poly and nplus
  sab_poly_pp: sab_poly and pplus
  implant_np: nplus or pplus
  implant_unrelated_sab: implant_np not_overlapping sab_poly
  sb15b_np_all: poly2_drawn interacting sab_out_otp
  sb15b_np: implant_np interacting sb15b_np_all
  sb15b_poly_all: poly2_drawn overlapping sb15b_np
  sb15b_poly: sb15b_poly_all and sab_out_otp
  sab_out_esd: sab_out_otp not_overlapping esd_mk
  lvsio_or_esdmk: lvs_io or esd_mk
  sab_core: sab_out_otp not_overlapping lvsio_or_esdmk
  sb16_viol: sab_core interacting tgate

  # ---- Implants (nplus / pplus decks) --------------------------------------
  # The 0.429 um sizings split each spacing rule into a near and a far case: PCOMP
  # within that distance of a well edge gets the looser limit.  `shrink` carries a 5 nm
  # margin by construction, which is far below the rule scale.
  nwell_n_dn_sized_in: nwell_n_dn shrink 0.429
  lvpwell_dn_sized_in: lvpwell_dn shrink 0.429
  nwell_dn_edge_band: nwell_n_dn not nwell_n_dn_sized_in
  # NP.11 excludes the band *outside* the N-well and *inside* the LVPWELL; PP.11 excludes
  # the other two. The pair is not symmetric, and reusing one for the other is silent.
  # The same 0.429 um reach outward, with no slack, for deciding which of two limits an
  # edge is judged by: the test case draws structures exactly on it, and 5 nm of slack
  # puts a splinter of the wrong edge on the wrong side.
  nwell_n_dn_reach: nwell_n_dn grow 0.429
  nwell_dn_outer_band: nwell_n_dn_reach not nwell_n_dn
  lvpwell_dn_outer_band: lvpwell_dn_reach not lvpwell_dn
  pplus_in_lvpwell_dn_all: pplus overlapping lvpwell
  pplus_in_lvpwell_dn: pplus_in_lvpwell_dn_all inside dnwell
  pcomp_in_lvpwell_dn_all: pcomp overlapping lvpwell
  pcomp_in_lvpwell_dn: pcomp_in_lvpwell_dn_all inside dnwell
  # PP.12 / NP.12: the gate's own extension along the Poly2 it sits on, within 0.32 um of
  # the channel.  Upstream grows the gate with KLayout's `size_inside` in three steps,
  # which clips each step to the Poly2 so the reach follows the conductor rather than
  # crossing open ground to a neighbouring one.  Three grow-and-clip rounds are that,
  # written out: a step that leaves the Poly2 is cut before the next one starts from it.
  # Each round asks for no slack, or three rounds of it would add 15 nm to the reach.
  ngate_reach1: ngate grow 0.10633
  ngate_step1: ngate_reach1 and poly2_drawn
  ngate_reach2: ngate_step1 grow 0.10633
  ngate_step2: ngate_reach2 and poly2_drawn
  ngate_reach3: ngate_step2 grow 0.10633
  ngate_step3: ngate_reach3 and poly2_drawn
  pgate_reach1: pgate grow 0.10633
  pgate_step1: pgate_reach1 and poly2_drawn
  pgate_reach2: pgate_step1 grow 0.10633
  pgate_step2: pgate_reach2 and poly2_drawn
  pgate_reach3: pgate_step2 grow 0.10633
  pgate_step3: pgate_reach3 and poly2_drawn
  # PP.4b / NP.4b: the Poly2 boundary within 0.32 um of the opposite-channel gate. The
  # reach is a plain grow of the gate, not the confined one PP.12 uses, and it is drawn
  # with no slack: the test case puts an implant island exactly 0.32 um above a channel,
  # and 5 nm of reach past that is the difference between one violation and two.
  ngate_reach_flat: ngate grow 0.32
  pgate_reach_flat: pgate grow 0.32
  pp12_viol: pplus interacting ngate_step3
  np12_viol: nplus interacting pgate_step3
  nplus_n_dn: nplus not dnwell
  nplus_out_lvpwell: nplus not_inside lvpwell
  nplus_out_lvpwell_dn: nplus_out_lvpwell inside dnwell
  ncomp_out_lvpwell: ncomp not_inside lvpwell
  ncomp_out_lvpwell_dn: ncomp_out_lvpwell inside dnwell
  nplus_at_nwell: nplus_n_dn overlapping nwell
  ncomp_at_nwell_all: ncomp overlapping nwell
  ncomp_at_nwell: ncomp_at_nwell_all not_overlapping dnwell
  pplus_no_guard_ring: pplus not_interacting guard_ring_mk
  pplus_outside_dn: pplus_no_guard_ring not_overlapping dnwell
  np3_nplus: nplus not_interacting ncomp_butted
  pcomp_in_nwell: pcomp and nwell
  pcomp_no_lvpwell: pcomp not lvpwell
  pcomp_no_lvpwell_dn: pcomp_no_lvpwell and dnwell
  np3a_pcomp: pcomp_in_nwell or pcomp_no_lvpwell_dn
  lvpwell_dn_edge_band: lvpwell_dn not lvpwell_dn_sized_in
  np3bi_pcomp: pcomp and lvpwell_dn_edge_band
  np3bii_pcomp: pcomp and lvpwell_dn_sized_in
  np3_nplus_in_lvpwell: np3_nplus and lvpwell_dn
  pcomp_out_dn: pcomp not dnwell
  np3ci_pcomp: pcomp_out_dn and nwell_n_dn_reach
  np3cii_pcomp: pcomp_out_dn not nwell_n_dn_reach
  np3_nplus_out_dn: np3_nplus not dnwell
  np3d_viol: ncomp and pcomp
  np3e_viol: nplus and pcomp
  poly_sab_only: poly2_drawn and sab
  # PP.9 leaves marked resistors alone: a high-resistance poly resistor has its heads
  # implanted and its body under the salicide block bare, and its implant edges are
  # the device's, not the rule's.
  poly_no_res: poly2_drawn not_interacting resistor
  poly_sab_no_res: poly_no_res and sab
  comp_sab_only: comp and sab
  comp_at_nplus: comp interacting nplus
  pcomp_at_nplus: pcomp interacting nplus
  comp_at_pplus: comp interacting pplus
  ncomp_at_pplus: ncomp interacting pplus
  pp3_pplus: pplus not_interacting ncomp_butted
  pp3d_viol: pcomp and ncomp
  pp3e_viol: pplus and ncomp

  # ---- pplus 3a/3b/3c: the mirror of the nplus family ---------------------
  lvpwell_dn_reach: lvpwell_dn grow 0.429
  ncomp_in_lvpwell: ncomp and lvpwell
  ncomp_out_nwell: ncomp not nwell_n_dn
  pp3a_ncomp: ncomp_in_lvpwell or ncomp_out_nwell
  pp3bi_ncomp: ncomp not lvpwell_dn_reach
  pp3bii_ncomp: ncomp and lvpwell_dn_reach
  pp3_pplus_in_dn: pp3_pplus and dnwell
  pp3ci_ncomp: ncomp and nwell_n_dn_sized_in
  nwell_n_dn_band: nwell_n_dn not nwell_n_dn_sized_in
  pp3cii_ncomp: ncomp and nwell_n_dn_band
  pp3_pplus_in_nwell: pp3_pplus and nwell_n_dn

  # ---- LDNMOS (ldnmos deck) -----------------------------------------------
  # The HV device is recognised by LDMOS_XTOR over Dualgate; MVSD marks its drain.
  poly_ld: poly2_drawn and ldmos_xtor and dualgate
  poly_mdn: poly_ld and ncomp
  ldnmos_body: poly_mdn not mvsd
  comp_mdn: comp and ldmos_xtor and dualgate
  ncomp_ld: ncomp and ldmos_xtor
  ncomp_mdn: ncomp_ld and dualgate
  pcomp_mdn: pcomp and ldmos_xtor and dualgate
  mvsd_mdn: mvsd and dualgate and ldmos_xtor
  pcomp_holes: pcomp holes
  mdn_gate_poly: poly2_drawn and dualgate and ldmos_xtor and mvsd
  ncomp_at_gate: ncomp interacting mdn_gate_poly
  ldnmos_source: ncomp_at_gate not poly2_drawn
  # MDN.5a splits on whether the body tap is butted to the source.
  pcomp_mdn5ai: pcomp_mdn not_interacting ncomp
  pcomp_mdn5aii: pcomp_mdn interacting ncomp
  mdn5ai_touch: mvsd and pcomp_mdn5ai
  mdn5aii_touch: mvsd and pcomp_mdn5aii
  mdn5b_touch: ldnmos_source and pcomp_mdn
  # MDN.6/7/7a: the marker layers must cover the device.
  mdn_device: ncomp or poly2_drawn or mvsd
  mdn_device_ld: mdn_device and ldmos_xtor
  mdn6_viol: mdn_device_ld not dualgate
  dualgate_on_ldmos: dualgate overlapping ldmos_xtor
  mdn7a_viol: dualgate_on_ldmos not ldmos_xtor
  dualgate_mvsd: dualgate and mvsd
  mdn7a_viol_b: dualgate_mvsd not ldmos_xtor
  mvsd_on_nwell: mvsd overlapping nwell
  mvsd_on_dnwell: mvsd overlapping dnwell
  ncomp_not_mvsd: ncomp not_interacting mvsd
  # MDN.10: the gate poly of a device whose drain is marked.
  ldmos_xtor_at_mvsd: ldmos_xtor interacting mvsd
  poly_mdn10: poly2_drawn and dualgate and ldmos_xtor_at_mvsd
  poly_mdn10_gated: poly_mdn10 and nplus
  poly_mdn10_link: poly_mdn10 not nplus
  mdn10f_interconnect: poly_mdn10_link interacting min 2 poly_mdn10_gated
  poly_ld_outside: poly2_drawn not ldmos_xtor
  poly_xtor: poly2_drawn and ldmos_xtor
  mdn10f_reaching_out: poly_xtor interacting poly_ld_outside
  poly_ld_gated: poly_ld and pplus
  poly_ld_link: poly_ld not pplus
  mdp9f_interconnect: poly_ld_link interacting min 2 poly_ld_gated
  # MDP.3c: every side of an N+ tab in the deep well must reach the P+ within 15 um.
  mdp3c_ncomp_x: ncomp_in_dnwell inside ldmos_xtor
  mdp3c_ncomp: mdp3c_ncomp_x inside dualgate
  # MDN.5c: the substrate tab, taken as the bounding box of the closed drain N+.
  mdn5c_tab_a: ncomp_mdn interacting mvsd
  mdn5c_tab_b: mdn5c_tab_a close 0.36
  mdn5c_tab: mdn5c_tab_b extents
  # MDP.4b: every DNWELL edge inside the guard ring must have the ring within 15 um.
  mdp4b_dnwell_x: dnwell inside ldmos_xtor
  mdp4b_dnwell: mdp4b_dnwell_x inside dualgate
  mdp4b_pcomp_x: pcomp inside ldmos_xtor_at_mvpsd
  mdp4b_pcomp_y: mdp4b_pcomp_x inside dualgate
  mdp4b_pcomp: mdp4b_pcomp_y not_interacting mvpsd
  pcomp_not_ncomp: pcomp not_interacting ncomp
  pcomp_at_ncomp: pcomp interacting ncomp
  mdn10ei_touch: poly_mdn10 and pcomp_not_ncomp
  # MDN.15b: a contact on the drain COMP must sit inside it.
  ncomp_drain: ncomp_mdn and mvsd
  ncomp_drain_all: ncomp and mvsd
  contact_at_drain: contact interacting ncomp_drain
  mdn15b_viol: contact_at_drain not ncomp_drain_all
  # MDN.17: the guard ring should surround the device.
  mdn17_pcomp: pcomp_holes and ldmos_xtor_at_mvsd
  mdn17_ldnmos: ncomp_ld or poly_ld or mvsd_mdn
  mdn17_viol_a: mdn17_ldnmos not_inside mdn17_pcomp
  ldmos_dg: ldmos_xtor and dualgate
  ldmos_dg_at_mvsd: ldmos_dg interacting mvsd
  mdn17_viol_b: ldmos_dg_at_mvsd not_covering pcomp

  # ---- LDPMOS (ldpmos deck) -----------------------------------------------
  # Mirror of the LDNMOS structure with MVPSD marking the drain, but the rule ids and
  # much of the shape differ, so nothing here is shared with the ldnmos layers.
  poly_pcomp: poly2_drawn and pcomp
  poly_pcomp_ld: poly_pcomp inside ldmos_xtor
  poly_mdp: poly_pcomp_ld inside dualgate
  ldpmos_body: poly_mdp not mvpsd
  dnwell_mdp: dnwell and dualgate and ldmos_xtor
  ldmos_dualgate: ldmos_xtor and dualgate
  # MDP.3a splits on whether the body tap is butted to the source.
  ncomp_not_pcomp: ncomp not_interacting pcomp
  ncomp_mdp3ai: ncomp_not_pcomp and ldmos_xtor and dualgate
  ncomp_mdp3aii: ncomp_butted and ldmos_xtor and dualgate
  mdp3ai_touch: mvpsd interacting ncomp_mdp3ai
  mdp3aii_touch: mvpsd interacting ncomp_mdp3aii
  ncomp_mdp3b_all: ncomp and ldmos_xtor and dualgate
  ncomp_mdp3b: ncomp_mdp3b_all not poly2_drawn not mvpsd
  pcomp_mdp3b_all: pcomp and dnwell and ldmos_xtor and dualgate
  pcomp_mdp3b: pcomp_mdp3b_all not poly2_drawn not mvpsd
  # MDP.5: everything belonging to the device, outside the Dualgate that must cover it.
  pcomp_no_poly: pcomp not poly2_drawn not mvpsd
  pgate_no_mvpsd: pgate not mvpsd
  pcomp_mvpsd: pcomp and mvpsd
  mdp5_device: pcomp_no_poly or pgate_no_mvpsd or pcomp_mvpsd
  mdp5_device_ld: mdp5_device and ldmos_xtor
  mdp5_viol: mdp5_device_ld not dualgate
  pcomp_mdp5a: pcomp inside ldmos_xtor
  mdp6_viol: mvpsd not_inside ldmos_xtor
  mdp6a_viol: ldmos_xtor not_covering dualgate
  nwell_out_ldmos: nwell not_overlapping ldmos_xtor
  ncomp_out_ldmos: ncomp not_overlapping ldmos_xtor
  poly_in_dnwell_mdp: poly2_drawn inside dnwell_mdp
  # MDP.9d: the drain COMP, grown by the rule distance.
  mvpsd_pcomp: mvpsd and pcomp
  mdp9d_drain: mvpsd_pcomp not poly2_drawn
  # No slack: `grow`'s default 5 nm exists to turn an exact touch into a hairline overlap
  # so a whole-region test resolves it, and here that is precisely wrong. An LDMOS drain
  # grown 0.16 um runs *alongside* its gate poly and should touch it; five more nanometres
  # make it genuinely overlap, and `overlapping` then selects nearly every gate in the
  # fixture instead of the ten upstream selects.
  mdp9d_exclude: mdp9d_drain grow 0.16
  poly_ld_dg: poly2_drawn and dualgate and ldmos_xtor
  ldmos_at_mvpsd: ldmos_xtor interacting mvpsd
  poly_ld_dg_mvpsd: poly2_drawn and dualgate and ldmos_at_mvpsd
  # MDP.9e: the LDPMOS gate poly, and the N+ guard ring it must clear.
  pgate_dg_no_mvpsd: pgate_dualgate not mvpsd
  ldpmos_gate_poly: poly2_drawn interacting pgate_dg_no_mvpsd
  ldpmos_gate_ld: ldpmos_gate_poly inside dualgate
  ldpmos_gate_mdp: ldpmos_gate_ld inside ldmos_xtor
  ncomp_no_pplus: ncomp not pplus
  pcomp_no_nplus: pcomp not nplus
  ncomp_unbutted_a: ncomp_no_pplus not_interacting pcomp_no_nplus
  ncomp_over_pcomp: ncomp overlapping pcomp
  ncomp_not_butted: ncomp_unbutted_a or ncomp_over_pcomp
  mdp9ei_touch: ldpmos_gate_mdp and ncomp_not_butted
  mdp9eii_touch: ldpmos_gate_mdp and ncomp_butted
  # MDP.12 / MDP.15 / MDP.16
  ncomp_in_dg: ncomp inside dualgate
  ncomp_guard: ncomp_in_dg inside ldmos_xtor
  dnwell_over_mvpsd: dnwell covering mvpsd
  dnwell_mvpsd_dg: dnwell_over_mvpsd inside dualgate
  dnwell_mvpsd_mdp: dnwell_mvpsd_dg inside ldmos_xtor
  comp_in_mvpsd: comp inside mvpsd
  comp_drain_dg: comp_in_mvpsd inside dualgate
  comp_drain_mdp: comp_drain_dg inside ldmos_xtor
  pcomp_in_mvpsd: pcomp inside mvpsd
  pcomp_drain_mdp: pcomp_in_mvpsd and dualgate and ldmos_xtor
  contact_at_pdrain: contact interacting pcomp_drain_mdp
  mdp16b_viol: contact_at_pdrain not_inside pcomp_in_mvpsd
  dnwell_ring: dnwell with_holes
  mdp17c_viol: dnwell_ring not_covering ncomp

  # ---- Poly2 resistors (lres / pres / hres decks) -------------------------
  # A poly resistor is poly under a salicide block, marked by RES_MK; the implant
  # picks the type and RESISTOR distinguishes the high-sheet one.
  poly_nplus_res: poly2_drawn and nplus
  lres_poly_sab: poly_nplus_res interacting sab
  lres_poly: lres_poly_sab interacting res_mk
  poly2_unrelated: poly2_drawn not_interacting sab
  comp_on_lres: comp overlapping lres_poly
  cont_lres: contact and lres_poly
  cont_lres_on_sab: cont_lres interacting sab
  poly_pplus_res: poly2_drawn and pplus
  pres_poly_sab: poly_pplus_res interacting sab
  pres_poly_mk: pres_poly_sab interacting res_mk
  pres_poly: pres_poly_mk not_interacting resistor
  comp_on_pres: comp overlapping pres_poly
  cont_pres: contact and pres_poly
  cont_pres_on_sab: cont_pres interacting sab
  pres_outline: poly2_drawn and pplus and sab
  res_mk_on_pres: res_mk interacting pres_poly
  pres9a_viol: res_mk_on_pres interacting res_mk_off_outline
  res_mk_big_area: res_mk with_area min 15000.001
  res_mk_big: res_mk_big_area with_bbox_min min 80.001
  hres_poly_pp: poly2_drawn interacting pplus
  hres_poly_sab: hres_poly_pp interacting sab
  # HRES.10: where the P+ implant and the block overlap on the resistor, the overlap has
  # one width and the rule fixes it.
  hres10_overlap: pplus and hres9_sab
  hres1_poly: hres_poly_sab interacting res_mk
  hres_poly: hres1_poly interacting resistor
  hres_resistor: resistor interacting hres1_poly
  hres_contact: contact and hres_poly
  comp_on_hres: comp overlapping hres_resistor
  hres_cont_on_sab: hres_contact interacting sab
  hres9_sab_pp: sab interacting pplus
  hres9_sab_mk: hres9_sab_pp interacting res_mk
  hres9_sab: hres9_sab_mk interacting resistor

  # ---- OTP marker (otp_mk deck) -------------------------------------------
  comp_otp: comp and otp_mk
  poly_otp: poly2_drawn and otp_mk
  comp_otp_no_poly: comp_otp not poly_otp
  sab_otp_on_contact: sab_otp and contact
  sab_otp: sab and otp_mk
  poly_unsalicided_otp: poly_otp and sab_otp
  tgate_otp: tgate and otp_mk
  poly_field_otp_all: poly2_drawn not comp
  opl3a_poly_all: tgate or poly_field_otp_all
  opl3a_poly: opl3a_poly_all and otp_mk
  sab_out_comp: sab not_overlapping comp
  sab_out_comp_otp: sab_out_comp and otp_mk
  comp_out_sab: comp not_overlapping sab
  sab_otp_no_v5: sab_otp not_interacting v5_xtor
  sab_otp_lv: sab_otp_no_v5 not_interacting dualgate
  sab_otp_mv: sab_otp and v5_xtor
  tgate_out_sab: tgate not_overlapping sab
  contact_in_comp_otp: contact overlapping comp_otp

  # ---- YMTP marker (ymtp_mk deck) -----------------------------------------
  # A tighter rule set inside the marker, split by voltage the usual way.
  ymtp_no_v5: ymtp_mk not_interacting v5_xtor
  ymtp_mk_lv: ymtp_no_v5 not_interacting dualgate
  ymtp_mk_mv: ymtp_mk overlapping dualgate
  comp_ymtp_lv: comp and ymtp_mk_lv
  comp_ymtp_mv: comp and ymtp_mk_mv
  poly_ymtp_lv: poly2_drawn and ymtp_mk_lv
  poly_ymtp_mv: poly2_drawn and ymtp_mk_mv
  nwell_ymtp_lv: nwell_n_dn and ymtp_mk_lv
  nwell_ymtp_mv: nwell_n_dn and ymtp_mk_mv
  comp_no_otp_ymtp_mv: comp_no_otp and ymtp_mk_mv
  ncomp_ymtp_lv: ncomp and ymtp_mk_lv
  ncomp_ymtp_lv_out: ncomp_ymtp_lv not_overlapping all_nwell
  ncomp_ymtp_mv: ncomp and ymtp_mk_mv
  ncomp_ymtp_mv_out: ncomp_ymtp_mv not_overlapping all_nwell
  poly_ymtp_lv_out_pf: poly_ymtp_lv not_overlapping plfuse
  poly_ymtp_mv_out_pf: poly_ymtp_mv not_overlapping plfuse

  # ---- SRAM 5.0 V (sram_5p0 deck) -----------------------------------------
  sram_mv: sramcore overlapping v5_xtor
  nw_n_dn_sram_mv: nwell_n_dn and sram_mv
  poly_sram_mv: poly2_drawn and sram_mv
  comp_sram_mv: comp and sram_mv
  contact_sram_mv: contact and sram_mv
  lvpwell_dn_sram_mv: lvpwell_dn and sram_mv
  ncomp_in_dnwell: ncomp inside dnwell
  ncomp_dn_sram: ncomp_in_dnwell and sramcore
  pcomp_out_dn_sram_mv: pcomp_out_dnwell and sram_mv
  pcomp_in_dnwell: pcomp inside dnwell
  pcomp_dn_sram_mv: pcomp_in_dnwell and sram_mv
  ncomp_out_nw_dn_sram_mv: ncomp_out_nw_dn and sram_mv
  poly_sram_field: poly_sram_mv not_overlapping comp_sram_mv
  poly_sram_related: poly_sram_mv overlapping comp_sram_mv

  # ---- eFuse (efuse deck) --------------------------------------------------
  # A poly fuse sits on field oxide between a cathode and an anode, all inside
  # EFUSE_MK; LVS_Source picks out the anode end.
  efuse_mk_pplus: efuse_mk and pplus
  poly2_at_plfuse: poly2_drawn interacting plfuse
  ef21_fuse: poly2_at_plfuse inside efuse_mk_pplus
  ef21_fuse_box: ef21_fuse extents
  plfuse_efuse: plfuse and efuse_mk
  poly_efuse: poly2_drawn and efuse_mk
  lvs_source_or_plfuse: lvs_source or plfuse
  cathode: poly_efuse not lvs_source_or_plfuse
  ef16a_viol: cathode not_covering 4 contact
  ef16b_viol: anode not_covering 4 contact
  anode: poly_efuse and lvs_source
  plfuse_not_rect: plfuse not_rectangle
  cathode_not_rect: cathode not_rectangle
  anode_not_rect: anode not_rectangle
  # EF.01: the fuse and its poly must lie inside the marked P+ region.
  poly_or_plfuse: poly2_drawn or plfuse
  poly_at_efuse_mk: poly_or_plfuse interacting efuse_mk
  ef04a_no_source: plfuse_efuse not_interacting lvs_source
  ef04a_no_poly: plfuse_efuse not_interacting poly2_drawn
  ef04a_viol: ef04a_no_source or ef04a_no_poly
  ef01_viol: poly_at_efuse_mk not_inside efuse_mk_pplus
  # EF.05: LVS_Source and the anode poly must coincide exactly.
  poly_efuse_no_fuse: poly_efuse not plfuse
  poly_efuse_at_src: poly_efuse_no_fuse interacting lvs_source
  ef05_viol_a: poly_efuse_at_src not lvs_source
  lvs_source_no_poly: lvs_source not poly2_drawn
  ef05_viol_b: lvs_source_no_poly and efuse_mk
  # EF.12 / EF.13: a contact may not touch the fuse itself.
  cont_on_plfuse: contact and plfuse_efuse
  cont_cathode: contact and cathode
  cont_anode: contact and anode
  # EF.14: EFUSE_MK must enclose LVS_Source.
  lvs_source_at_mk: lvs_source overlapping efuse_mk
  ef14_viol: lvs_source_at_mk not efuse_mk
  plfuse_at_contact: plfuse interacting contact
  # EF.18 / EF.19: the fuse must sit on bare field oxide.
  ef18_forbidden: comp or nplus or esd or sab or resistor or metal1 or metal2
  ef18_viol: plfuse overlapping ef18_forbidden
  ef19_forbidden: metal1 or metal2
  ef19_viol: plfuse overlapping ef19_forbidden
  ef20_neighbours: comp or nplus or esd or sab or resistor

  # ---- Connect-graph bridges ---------------------------------------------
  # Derived stand-ins for upstream's connector-less `connect(a, b)` pairs; see the
  # connectivity block above.
  mvsd_tap: mvsd and ncomp_con
  mvpsd_tap: mvpsd and pcomp_con
  mimcap_top_tap: fusetop and metal5_drawn

  # ---- Metal slotting (mslot deck) ---------------------------------------
  # `dont_slot` is the union of the four keep-out regions upstream builds, each an
  # intersection of the top metal (or the MIM bottom plate) with a pad-level opening,
  # grown by 5 um.  Dilation distributes over union, so the three UBM flavours are
  # unioned first and grown once instead of three times.
  top_metal_under_pad_raw: top_metal and pad
  top_metal_under_pad: top_metal_under_pad_raw grow 5
  mim_bottom_under_fusetop_raw: metal4_drawn and fusetop
  mim_bottom_under_fusetop: mim_bottom_under_fusetop_raw grow 5
  top_metal_under_fusewindow_raw: top_metal and fusewindow_d
  top_metal_under_fusewindow: top_metal_under_fusewindow_raw grow 5
  ubm_all: ubmpperi or ubmparray or ubmeplate
  top_metal_under_ubm_raw: top_metal and ubm_all
  top_metal_under_ubm: top_metal_under_ubm_raw grow 5
  dont_slot: top_metal_under_pad or mim_bottom_under_fusetop or top_metal_under_fusewindow or top_metal_under_ubm


  # The vias are grown by 0.2 um before subtraction so that MSLOT#.1's "wide metal that
  # still needs a slot" excludes the strip a slot may not occupy anyway (MSLOT#.7/8).
  contact_slot_keepout: contact grow 0.2
  via1_slot_keepout: via1 grow 0.2
  via2_slot_keepout: via2 grow 0.2
  via3_slot_keepout: via3 grow 0.2
  via4_slot_keepout: via4 grow 0.2

  # Per level: the slot marks split into rectangles and non-rectangles, and the
  # "wide metal" derivation.  Upstream opens the metal with a 30 um structuring element
  # built from two directional passes (`sized(0,-15).sized(-15,0).sized(0,15).sized(15,0)`),
  # which keeps only what survives a 30 um square - i.e. metal wide enough to need a
  # slot.  That chain is four virtual layers here because each directional size is its
  # own op.  It runs twice: once to pre-select wide metal before the vias and slots are
  # subtracted, and once afterwards, on the remainder, which is the rule proper.
  metal1_slot_rect: metal1_slot rectangle
  metal1_slot_not_rect: metal1_slot not_rectangle
  metal1_wide_a: metal1_drawn shrink_y 15
  metal1_wide_b: metal1_wide_a shrink_x 15
  metal1_wide_c: metal1_wide_b grow_y 15
  metal1_wide: metal1_wide_c grow_x 15
  metal1_wide_unslotted: metal1_wide not metal1_slot not dont_slot not contact_slot_keepout not via1_slot_keepout
  metal1_unslotted_a: metal1_wide_unslotted shrink_y 15
  metal1_unslotted_b: metal1_unslotted_a shrink_x 15
  metal1_unslotted_c: metal1_unslotted_b grow_y 15
  metal1_needs_slot: metal1_unslotted_c grow_x 15
  metal2_slot_rect: metal2_slot rectangle
  metal2_slot_not_rect: metal2_slot not_rectangle
  metal2_wide_a: metal2_drawn shrink_y 15
  metal2_wide_b: metal2_wide_a shrink_x 15
  metal2_wide_c: metal2_wide_b grow_y 15
  metal2_wide: metal2_wide_c grow_x 15
  metal2_wide_unslotted: metal2_wide not metal2_slot not dont_slot not via1_slot_keepout not via2_slot_keepout
  metal2_unslotted_a: metal2_wide_unslotted shrink_y 15
  metal2_unslotted_b: metal2_unslotted_a shrink_x 15
  metal2_unslotted_c: metal2_unslotted_b grow_y 15
  metal2_needs_slot: metal2_unslotted_c grow_x 15
  metal3_slot_rect: metal3_slot rectangle
  metal3_slot_not_rect: metal3_slot not_rectangle
  metal3_wide_a: metal3_drawn shrink_y 15
  metal3_wide_b: metal3_wide_a shrink_x 15
  metal3_wide_c: metal3_wide_b grow_y 15
  metal3_wide: metal3_wide_c grow_x 15
  metal3_wide_unslotted: metal3_wide not metal3_slot not dont_slot not via2_slot_keepout not via3_slot_keepout
  metal3_unslotted_a: metal3_wide_unslotted shrink_y 15
  metal3_unslotted_b: metal3_unslotted_a shrink_x 15
  metal3_unslotted_c: metal3_unslotted_b grow_y 15
  metal3_needs_slot: metal3_unslotted_c grow_x 15
  metal4_slot_rect: metal4_slot rectangle
  metal4_slot_not_rect: metal4_slot not_rectangle
  metal4_wide_a: metal4_drawn shrink_y 15
  metal4_wide_b: metal4_wide_a shrink_x 15
  metal4_wide_c: metal4_wide_b grow_y 15
  metal4_wide: metal4_wide_c grow_x 15
  metal4_wide_unslotted: metal4_wide not metal4_slot not dont_slot not via3_slot_keepout not via4_slot_keepout
  metal4_unslotted_a: metal4_wide_unslotted shrink_y 15
  metal4_unslotted_b: metal4_unslotted_a shrink_x 15
  metal4_unslotted_c: metal4_unslotted_b grow_y 15
  metal4_needs_slot: metal4_unslotted_c grow_x 15
  metal5_slot_rect: metal5_slot rectangle
  metal5_slot_not_rect: metal5_slot not_rectangle
  metal5_wide_a: metal5_drawn shrink_y 15
  metal5_wide_b: metal5_wide_a shrink_x 15
  metal5_wide_c: metal5_wide_b grow_y 15
  metal5_wide: metal5_wide_c grow_x 15
  metal5_wide_unslotted: metal5_wide not metal5_slot not dont_slot not via4_slot_keepout
  metal5_unslotted_a: metal5_wide_unslotted shrink_y 15
  metal5_unslotted_b: metal5_unslotted_a shrink_x 15
  metal5_unslotted_c: metal5_unslotted_b grow_y 15
  metal5_needs_slot: metal5_unslotted_c grow_x 15

  # ---- MIM capacitor, option B (mim_b deck) ------------------------------
  # The bottom plate is not drawn.  Upstream reconstructs it as `mimtm_virtual`: the
  # top plate oversized by 1.06 um, clipped to whichever Metal4 shape the top plate
  # actually sits on.  Every enclosure rule in the deck is measured against that
  # reconstruction rather than against Metal4 itself, so a routing shape elsewhere on
  # the same net is not mistaken for the plate.
  # A selection radius - "the plate reaches this far" - so it wants the slack: a via at
  # exactly 1.06 um only touches the grown region, and a whole-region test reads a
  # zero-area touch as no overlap. This is the one grow in either PDK that needs it.
  fusetop_oversize: fusetop within 1.06
  topmin1_metal_at_fusetop: topmin1_metal interacting fusetop
  mimtm_virtual: fusetop_oversize and topmin1_metal_at_fusetop
  # The vias that land on the reconstructed bottom plate, which MIMTM.2 measures.
  mimtm_via: top_via overlapping mimtm_virtual
  # MIMTM.5 measures the top plate against the vias that reach the *bottom* plate,
  # which are the ones touching Metal4.
  top_via_on_topmin1_metal: top_via interacting topmin1_metal
  # MIMTM.9 is the sea-of-via pitch on top of the plate, so only the vias fully on it.
  top_via_in_fusetop: top_via inside fusetop
  fusetop_outside_cap_mk: fusetop not cap_mk
  # MIMTM.10: the bottom plate may only be contacted from above, so a Via3 landing on
  # the plate under the top plate is a violation wherever it appears.
  topmin1_via_on_mim_bottom: topmin1_via and topmin1_metal and fusetop

  # ---- DN.3: the PCOMP guard ring around a deep well --------------------
  # A PCOMP ring shows up as a hole in the merged PCOMP layer; the hole minus PCOMP
  # itself is the area the ring encloses.
  pcomp_ring_interior: pcomp_holes not pcomp
  # A deep well with no ring around it at all.
  # The ring's interior as a box: a DNWELL has PCOMP devices of its own inside the ring,
  # and subtracting every PCOMP from the hole punched them out of the interior, so the
  # well was "not inside" the ring that surrounds it.  Upstream takes the extents of
  # the interior that touches exactly one DNWELL, and so does this.
  pcomp_ring_one: pcomp_ring_interior interacting 1 dnwell
  pcomp_ring_box: pcomp_ring_one extents
  dnwell_outside_ring: dnwell not_inside pcomp_ring_box
  # "Directly surrounded" also fails when the ring encloses somebody else's n-type
  # geometry as well - the ring is then shared rather than this well's own.
  n_type_all: nat or ncomp or nwell
  foreign_n_type: n_type_all not_interacting dnwell
  pcomp_ring_shared: pcomp_ring_interior covering foreign_n_type
  dnwell_in_shared_ring: dnwell inside pcomp_ring_shared
  dn3_viol: dnwell_outside_ring or dnwell_in_shared_ring

  # ---- PL.6: right-angle poly bends over active ---------------------------
  # The rule exempts YMTP_MK, and the exemption applies to the *corner*, not to the poly:
  # subtracting the marker from poly2 first would invent new corners along the marker's
  # own edge.  So poly2 is examined whole and the corner is filtered instead.
  comp_no_ymtp: comp not ymtp_mk

  # MIMTM.11: the bottom plate several MIM caps may share.  Their areas add up against
  # the same cap MIMTM.8b puts on one of them.
  mimtm11_plate: topmin1_metal interacting fusetop
  # MIM.11 is the same rule on option A, where the plate is Metal2.
  mim11_plate: metal2 interacting fusetop
  # NAT.6: the active under a NAT marker.  Two of them at different potential are not
  # allowed under one marker.
  nat6_comp: comp and nat
  # ---- MT30.8 -------------------------------------------------------------
  # The DRM splits this in two: a single top via at one location (MT30.8a) and the 2x2
  # array a location needs (MT30.8b).  Upstream emits one id for both.  Neither applies in
  # the seal ring, which the guard ring marker identifies.
  mt308_via: top_via not guard_ring_mk
  mt308_x_a: top_metal and topmin1_metal
  mt308_x_b: mt308_x_a not guard_ring_mk
  mt308_x: mt308_x_b interacting mt308_via
  # Fewer than four vias at one location cannot be a 2x2 array, and one of them is
  # MT30.8a's single via outright.
  mt308_few: mt308_x interacting min 1 max 3 mt308_via
  # ---- MDP.10, the P-side twin of MDN.11 ----------------------------------
  mvpsd_mdp: mvpsd and dualgate and ldmos_xtor
  # MDP.10: the channel the drift overlaps, fixed at 0.4 in both directions.
  mdp10_overlap: ldmos_xtor and mvpsd and comp and poly2_drawn and pplus
  mdp10_wide: mdp10_overlap open 0.2
  mdp10_no_channel: mvpsd_mdp not_interacting mdp10_overlap
  # ---- MDN.11 -------------------------------------------------------------
  # The channel the drift overlaps: the rule fixes its width at 0.4 in both directions,
  # and separately forbids a drift with no channel under it and no drain in it.
  mdn11_overlap: ldmos_xtor and mvsd and comp and poly2_drawn and nplus
  # The parts wider than 0.4.  An opening by half of it survives only where the region is
  # thicker than that, which is what upstream's "region minus its narrow parts" means; a
  # max_width scan would call the overlap's own length a width.
  mdn11_wide: mdn11_overlap open 0.2
  mdn11_uniform: mdn11_overlap not_interacting mdn11_wide
  # The selections run on the drawn drift and the device markers are intersected after -
  # clipping first changes which shapes a whole-polygon selection sees.
  mdn11_over_ncomp: mvsd covering ncomp
  mdn11_no_gate_sel: mdn11_over_ncomp not_overlapping tgate
  mdn11_no_gate: mdn11_no_gate_sel and dualgate and ldmos_xtor
  mdn11_bare_ncomp: ncomp not_interacting poly2_drawn
  mdn11_no_drain_sel: mvsd not_covering mdn11_bare_ncomp
  mdn11_no_drain: mdn11_no_drain_sel and dualgate and ldmos_xtor
  mdn11_no_channel: mdn11_no_gate or mdn11_no_drain
  # ---- MDN.10c ------------------------------------------------------------
  # The field poly must overhang the active by exactly 0.2 towards the drain, so both
  # directions are violations - and only where the drain's own box, the drift and the poly
  # all coincide.  MDN.10b measures the same NCOMP boundary against the gate's own
  # boundary.
  mdn10c_ncomp: ncomp interacting poly_mdn10
  mdn10c_short: poly_mdn10 enclosure_below 0.2 mdn10c_ncomp
  mdn10c_long: poly_mdn10 enclosure_above 0.2 mdn10c_ncomp
  mdn10c_off: mdn10c_short or mdn10c_long
  mdn10c_box_a: ncomp_mdn close 0.36
  mdn10c_box: mdn10c_box_a extents
  mdn10c_region: mdn10c_box and mvsd and poly2_drawn
  mdn10c_viol: mdn10c_off and mdn10c_region
  # ---- MDN.12 -------------------------------------------------------------
  # The drain's active must sit 0.5 inside the drift, and a drift with no drain in it at
  # all is the other half of the rule.  The two halves read different actives: the
  # enclosure is measured on the marked device's, the missing drain on any.
  mdn12_bare_ncomp_mdn: ncomp_mdn not_interacting poly2_drawn
  mdn12_bare_ncomp: ncomp not_interacting poly2_drawn
  mdn12_drift: mvsd_mdn covering mdn12_bare_ncomp_mdn
  mdn12_short: mdn12_drift enclosure_below 0.5 ncomp_mdn
  mdn12_short_off_poly: mdn12_short not_overlapping poly2_drawn
  mdn12_no_drain: mvsd_mdn not_covering mdn12_bare_ncomp
  mdn12_viol: mdn12_short_off_poly or mdn12_no_drain
  # ---- LDPMOS: the source and the gate ends, mirroring the N-side ----------
  mdp_gate_in_mvpsd: poly_mdp and mvpsd
  mdp_source_touch: pcomp interacting mdp_gate_in_mvpsd
  mdp_source: mdp_source_touch not poly2_drawn
  # MDP.13b: fingers alternate source and drain.
  mdp13b_l1: ldpmos_body not_interacting 1 mdp_source
  mdp13b_l2: ldpmos_body not_interacting 1 mvpsd
  mdp13b_l3: mdp_source interacting mvpsd
  mdp13b_viol: mdp13b_l1 or mdp13b_l2 or mdp13b_l3
  # MDP.13c: a finger with source on both sides, directly or through a shared tap.
  mdp13c_shared: mdp_source interacting 2 ldpmos_body
  mdp13c_tap: ncomp interacting 2 mdp_source
  mdp13c_via_tap: mdp_source interacting mdp13c_tap
  mdp13c_shared_any: mdp13c_shared or mdp13c_via_tap
  mdp13c_source_side: ldpmos_body interacting mdp13c_shared_any
  mdp13c_bare_pcomp: pcomp not_interacting poly2_drawn
  mdp13c_drain: mvpsd covering mdp13c_bare_pcomp
  mdp13c_two_pcomp: mdp13c_drain interacting 2 pcomp
  mdp13c_viol: mdp13c_two_pcomp interacting mdp13c_source_side
  # MDP.3: an unbroken N+ guard ring inside DNWELL around each device - device material
  # that no ring hole contains, and a ring hole that holds no tapped source or more than
  # one drift.
  nplus_holes: nplus holes
  mdp3_device_a: ldpmos_body or mvpsd or mdp_source
  mdp3_device: mdp3_device_a and dualgate and ldmos_xtor
  mdp3_a: mdp3_device not_interacting nplus_holes
  mdp3_ring: nplus_holes and dualgate and ldmos_xtor
  mdp3_tap: ncomp interacting mdp_source
  mdp3_b1: mdp3_ring not_interacting mdp3_tap
  mdp3_b: mdp3_b1 not_interacting 1 mvpsd
  # MDP.17a: a DNWELL guard ring is wanted between a marked drift and any N+ active
  # outside the wells, whenever they come within 40 um of each other.
  mdp17_drift_a: mvpsd inside dnwell
  mdp17_drift: mdp17_drift_a inside ldmos_xtor
  mdp17_ncomp_a: ncomp not_overlapping dnwell
  mdp17_ncomp: mdp17_ncomp_a not_overlapping nwell
  mdp17_near: mdp17_drift separation_below 40 mdp17_ncomp
  mdp17_ring_a: ncomp and dnwell
  mdp17_ring: mdp17_ring_a holes
  mdp17a_viol: mdp17_near not_interacting mdp17_ring
  # ---- MDN.13c ------------------------------------------------------------
  # A finger with source on both sides: the source is the active meeting a gate that is
  # inside a drift, minus the gate; a source meeting two gates is one shared between
  # fingers, and the drain that sits by such a finger is what the rule reports.
  mdn13c_gate_in_mvsd: poly2_drawn and dualgate and ldmos_xtor and mvsd
  mdn13c_source_touch: ncomp interacting mdn13c_gate_in_mvsd
  mdn13c_source: mdn13c_source_touch not poly2_drawn
  mdn13c_finger: poly_mdn not mvsd
  mdn13c_shared: mdn13c_source interacting 2 mdn13c_finger
  mdn13c_tap: pcomp interacting 2 mdn13c_source
  mdn13c_via_tap: mdn13c_source interacting mdn13c_tap
  mdn13c_shared_any: mdn13c_shared or mdn13c_via_tap
  mdn13c_source_side: mdn13c_finger interacting mdn13c_shared_any
  mdn13c_bare_ncomp: ncomp not_interacting poly2_drawn
  mdn13c_drain: mvsd covering mdn13c_bare_ncomp
  mdn13c_two_ncomp: mdn13c_drain interacting 2 ncomp
  mdn13c_viol: mdn13c_two_ncomp interacting mdn13c_source_side
  # MDN.13b: fingers alternate source and drain, so a finger meets exactly one source and
  # exactly one drift, and no source reaches a drift.  It reads the same source and finger
  # MDN.13c does.
  mdn13b_l1: mdn13c_finger not_interacting 1 mdn13c_source
  mdn13b_l2: mdn13c_finger not_interacting 1 mvsd
  mdn13b_l3: mdn13c_source interacting mvsd
  mdn13b_viol: mdn13b_l1 or mdn13b_l2 or mdn13b_l3
  # ---- MDN.13d ---------------------------------------------------
  # A finger's source: NCOMP touching a gate that is inside the marker (the MDN.13c
  # gate layer), minus the gate.
  mdn_source_touch: ncomp interacting mdn13c_gate_in_mvsd
  mdn_source: mdn_source_touch not poly2_drawn
  mdn_ldnmos: poly_mdn not mvsd
  mdn_ncomp_no_poly: ncomp not_interacting poly2_drawn
  # MDN.13d: the P-sub ring around every two fingers, and the butted-tap case it excludes.
  mdn13d_drain: mvsd_mdn covering mdn_ncomp_no_poly
  mdn13d_single: mdn13d_drain interacting 2 ncomp
  mdn13d_multi: mdn13d_drain interacting 3 ncomp
  mdn13d_source_closed: mdn_source close 1
  mdn13d_source_ext: mdn13d_source_closed extents
  mdn13d_no_tap: mdn13d_source_ext not pcomp
  mdn13d_butted_well: mdn13d_no_tap interacting 2 mdn_ldnmos
  mdn13d_l1: pcomp_holes covering min 2 mdn13d_single
  mdn13d_l2a: pcomp_holes covering mdn13d_single
  mdn13d_l2: mdn13d_l2a covering mdn13d_multi
  mdn13d_viol: mdn13d_l1 or mdn13d_l2 or mdn13d_butted_well
  # ---- LDMOS rules the engine can already say ------------------------------
  # MDN.7: NCOMP or gate reaching an MVSD, or COMP inside one, outside the LDMOS marker.
  mdn7_ncomp_at_mvsd: ncomp interacting mvsd
  mdn7_a1: mdn7_ncomp_at_mvsd not poly2_drawn
  mdn7_a: mdn7_a1 not mvsd
  mdn7_ngate_at_mvsd: ngate interacting mvsd
  mdn7_b: mdn7_ngate_at_mvsd not mvsd
  mdn7_c: ncomp and mvsd
  mdn7_all: mdn7_a or mdn7_b or mdn7_c
  mdn7_dg: mdn7_all and dualgate
  mdn7_viol: mdn7_dg not ldmos_xtor

  # MDP.9d: gate poly overlapping the sized source region, or not reaching it at all.
  mdp9d_poly_dg: poly2_drawn and dualgate
  mdp9d_poly: mdp9d_poly_dg and ldmos_xtor
  mdp9d_l1: mdp9d_poly overlapping mdp9d_exclude
  ldmos_xtor_at_mvpsd: ldmos_xtor interacting mvpsd
  mdp9d_poly_mv: mdp9d_poly_dg and ldmos_xtor_at_mvpsd
  mdp9d_l2: mdp9d_poly_mv not_interacting mdp9d_exclude
  mdp9d_viol: mdp9d_l1 or mdp9d_l2

  # MDP.3d / MDP.4: COMP under an LDMOS marker but not under Metal1, whose uncovered
  # boundary runs longer than 10 um.
  mdp3d_ncomp: ncomp interacting ldmos_xtor_at_mvpsd
  mdp3d_ncomp_dg: mdp3d_ncomp interacting dualgate
  mdp3d_bare: mdp3d_ncomp_dg not metal1
  mdp4_pcomp_off: pcomp not_interacting mvpsd
  mdp4_pcomp_at: mdp4_pcomp_off interacting ldmos_xtor_at_mvpsd
  mdp4_pcomp_dg: mdp4_pcomp_at interacting dualgate
  mdp4_bare: mdp4_pcomp_dg not metal1


  # ---- "Crosses out" halves ------------------------------------------------
  # Every enclosure rule below is an OR upstream: the margin, and a shape that overlaps
  # what should contain it but runs outside. The second has no margin to measure - the
  # shape crosses the boundary - so the enclosure check is structurally blind to it, and
  # each of these is that half, reported under the same rule id.
  co_3_crossing_all: contact_no_sram overlapping poly2_drawn
  co_3_crossing: co_3_crossing_all not poly2_drawn
  co_4_crossing_all: contact_no_sram overlapping comp
  co_4_crossing: co_4_crossing_all not comp
  dv_1_crossing: dnwell_56v not dualgate
  dv_6_crossing_all: comp_dv overlapping dualgate
  dv_6_crossing: dv_6_crossing_all not dualgate
  dv_8_crossing: poly2_mv not dualgate
  hres_4_crossing_all: hres_poly overlapping resistor
  hres_4_crossing: hres_4_crossing_all not resistor
  hres_7_crossing_all: hres_contact overlapping pplus
  hres_7_crossing: hres_7_crossing_all not pplus
  mdp_12_crossing_all: ncomp_guard overlapping dnwell_mdp
  mdp_12_crossing: mdp_12_crossing_all not dnwell_mdp
  lres_5_crossing_all: lres_poly overlapping nplus
  lres_5_crossing: lres_5_crossing_all not nplus
  mimtm_2_crossing_all: mimtm_via overlapping topmin1_metal
  mimtm_2_crossing: mimtm_2_crossing_all not topmin1_metal
  mimtm_4_crossing_all: top_via overlapping fusetop
  mimtm_4_crossing: mimtm_4_crossing_all not fusetop
  np_5a_crossing_all: ngate overlapping nplus
  np_5a_crossing: np_5a_crossing_all not nplus
  np_9_crossing_all: poly_sab_only overlapping nplus
  np_9_crossing: np_9_crossing_all not nplus
  pp_5a_crossing_all: pgate overlapping pplus
  pp_5a_crossing: pp_5a_crossing_all not pplus
  pp_9_crossing_all: poly_sab_no_res overlapping pplus
  pp_9_crossing: pp_9_crossing_all not pplus
  pres_5_crossing_all: pres_poly overlapping pplus
  pres_5_crossing: pres_5_crossing_all not pplus
  s_df_4c_lv_crossing_all: pcomp_out_dn_sram overlapping nwell_n_dn_sram
  s_df_4c_lv_crossing: s_df_4c_lv_crossing_all not nwell_n_dn_sram
  s_co_3_lv_crossing_all: contact_sram overlapping poly_sram
  s_co_3_lv_crossing: s_co_3_lv_crossing_all not poly_sram
  s_co_4_lv_crossing_all: contact_sram overlapping comp_sram
  s_co_4_lv_crossing: s_co_4_lv_crossing_all not comp_sram
  s_df_4c_mv_crossing_all: pcomp_out_dn_sram_mv overlapping nw_n_dn_sram_mv
  s_df_4c_mv_crossing: s_df_4c_mv_crossing_all not nw_n_dn_sram_mv
  s_df_8_mv_crossing_all: ncomp_dn_sram overlapping lvpwell_dn_sram_mv
  s_df_8_mv_crossing: s_df_8_mv_crossing_all not lvpwell_dn_sram_mv
  s_co_4_mv_crossing_all: contact_sram_mv overlapping comp_sram_mv
  s_co_4_mv_crossing: s_co_4_mv_crossing_all not comp_sram_mv
  # HRES.12a / LRES.9a: the RES_MK marking must follow its resistor's outline - the
  # PRES.9a shape against the other two resistor types. HRES.12b / LRES.9b are PRES.9b:
  # a marking over 15000 um2 with both sides over 80 um needs 20 um to the next.
  poly2_no_pplus: poly2_drawn not pplus
  poly_nplus_lres: poly2_drawn and nplus
  hres_outline: poly2_no_pplus and sab
  lres_outline: poly_nplus_lres and sab
  res_mk_on_hres: res_mk interacting resistor
  res_mk_on_lres: res_mk interacting lres_poly
  hres12a_viol: res_mk_on_hres interacting res_mk_off_hres
  lres9a_viol: res_mk_on_lres interacting res_mk_off_lres
  # CO.9: a contact sitting on a butted N/P COMP boundary.
  co9_viol: contact interacting ncomp_pcomp_butting_edges
  # DF.11: the COMP touching a butted NCOMP has its own width minimum.
  comp_at_ncomp_butted: comp interacting ncomp_butted

  # Edge layers: boundary segments rather than regions.  A rule names one exactly as it
  # names any other layer; the checks that accept one say so.

  # DF.2a, minimum channel width.  W is the length of the source/drain boundary that
  # runs under the gate - a property of that segment, not of any region, which is why
  # it needs an edge layer at all.
  res_mk.edges: res_mk edges
  hres_outline.edges: hres_outline edges
  res_mk_off_hres_all: res_mk.edges not hres_outline.edges
  res_mk_off_hres: res_mk_off_hres_all inside_part poly2_drawn
  lres_outline.edges: lres_outline edges
  res_mk_off_lres_all: res_mk.edges not lres_outline.edges
  res_mk_off_lres: res_mk_off_lres_all inside_part poly2_drawn
  ncomp_pcomp_butting_edges: ncomp.edges and pcomp.edges
  # ESD.4a: the ESD boundary away from any PCOMP, enclosing the NCOMP boundary.
  esd.edges: esd edges
  esd_edges_no_pcomp: esd.edges not_interacting pcomp
  # ESD.6: the ESD boundary enclosing the poly edges that reach a gate.
  poly2.edges2: poly2_drawn edges
  esd6_poly: poly2.edges2 interacting_edges tgate.edges
  # EF.06-09, EF.22a/b: the cathode and anode are rectangles whose width and length are
  # both fixed. Upstream separates the two by which edges reach the fuse: those, plus the
  # ones facing them, are the *width*; the remainder is the *length*. `without_length`
  # then flags anything not exactly the value, hence the max of one DBU past it.
  cathode.edges: cathode edges
  anode.edges: anode edges
  plfuse.edges: plfuse edges
  # The LDMOS body is the gate poly over the active with the drift marker taken out, so
  # wherever the active cut it its boundary *is* the active's: those walls stand at the
  # ends of the channel.  The gate-length rules pick walls by that directly; these edge
  # layers serve the rules that read the ends as edges.
  ldnmos_body.edges: ldnmos_body edges
  ldnmos_gate_ends: ldnmos_body.edges and ncomp.edges
  mdn4a_narrow: ldnmos_body width_below 4
  mdn4a_viol: ldnmos_gate_ends and mdn4a_narrow
  ldpmos_body.edges: ldpmos_body edges
  ldpmos_gate_ends: ldpmos_body.edges and pcomp.edges
  mdp2_narrow: ldpmos_body width_below 4
  mdp2_viol: ldpmos_gate_ends and mdp2_narrow
  mdp3c_ncomp.edges: mdp3c_ncomp edges
  mdp3c_edges: mdp3c_ncomp.edges centers 99%
  mdn5c_tab.edges: mdn5c_tab edges
  mdn5c_centers: mdn5c_tab.edges centers 99%
  mdn5c_on_ncomp: mdn5c_centers inside_part ncomp
  mdn5c_edges: mdn5c_on_ncomp inside_part pcomp_holes
  mdp4b_dnwell.edges: mdp4b_dnwell edges
  mdp4b_dnwell_centers: mdp4b_dnwell.edges centers 99%
  mdp4b_edges: mdp4b_dnwell_centers inside_part pcomp_holes
  ef03_shared: poly2.edges and plfuse.edges
  ef03_shared_centers: ef03_shared centers 95%
  ef03_fuse_length: plfuse.edges interacting_edges ef03_shared_centers
  ef03_viol: ef03_fuse_length without_length min 1.26 max 1.261
  cathode_at_fuse: cathode.edges interacting plfuse
  cathode_facing: cathode.edges not_interacting_edges cathode_at_fuse
  cathode_width: cathode_facing or cathode_at_fuse
  cathode_length: cathode.edges not cathode_width
  anode_at_fuse: anode.edges interacting plfuse
  anode_facing: anode.edges not_interacting_edges anode_at_fuse
  anode_width: anode_facing or anode_at_fuse
  anode_length: anode.edges not anode_width
  ef21_fuse_box.edges: ef21_fuse_box edges
  ef21_far: anode_facing or cathode_facing
  ef21_far_centers: ef21_far centers 95%
  ef21_clear: ef21_fuse_box.edges not_interacting_edges ef21_far_centers
  ef21_viol: ef21_clear without_length min 5.53 max 5.531
  ef22a_edges: cathode_at_fuse not plfuse.edges
  ef22b_edges: anode_at_fuse not plfuse.edges
  ef_06_viol: cathode_width without_length min 2.26 max 2.261
  ef_07_viol: cathode_length without_length min 1.84 max 1.841
  ef_08_viol: anode_width without_length min 1.06 max 1.061
  ef_09_viol: anode_length without_length min 2.43 max 2.431
  ef_22a_viol: ef22a_edges without_length min 1.04 max 1.041
  ef_22b_viol: ef22b_edges without_length min 0.44 max 0.441
  # MDP.3d / MDP.4 and MDN.10b, as edge layers.
  mdp3d_bare.edges: mdp3d_bare edges
  mdp3d_uncovered: mdp3d_bare.edges outside_part metal1
  mdp3d_viol: mdp3d_uncovered with_length min 10.001
  mdp4_bare.edges: mdp4_bare edges
  mdp4_uncovered: mdp4_bare.edges outside_part metal1
  mdp4_viol: mdp4_uncovered with_length min 10.001
  mdn10b_ncomp.edges: mdn10c_ncomp edges
  ncomp_off_poly: ncomp.edges not_interacting poly2_drawn
  mdn10b_edges: mdn10b_ncomp.edges interacting_edges ncomp_off_poly
  poly_mdn10.edges: poly_mdn10 edges
  # MDP.9b: the gate's own edge where it leaves the drift - the width direction - which
  # is what has to clear the active by 0.4.
  poly_in_dnwell_mdp.edges: poly_in_dnwell_mdp edges
  mdp9b_at_drift: poly_in_dnwell_mdp.edges interacting mvpsd
  mdp9b_edges: mdp9b_at_drift outside_part mvpsd
  mdp9b_touch: mdp9b_edges interacting pcomp
  comp.edges: comp edges
  # MDP.11: the drift's own edge where no active runs along it, which is the edge that
  # has to hold the drain active by 0.8; where one does run along it the enclosure is
  # nothing at all, and that shared edge is the other half of the rule.
  mvpsd.edges: mvpsd edges
  mdp11_edges: mvpsd.edges not_interacting_edges pcomp.edges
  mdp11_flush: mvpsd.edges and pcomp.edges
  pres_outline.edges: pres_outline edges
  res_mk_off_outline_all: res_mk.edges not pres_outline.edges
  res_mk_off_outline: res_mk_off_outline_all inside_part poly2_drawn
  pplus.edges: pplus edges
  nplus.edges: nplus edges
  ncomp.edges: ncomp edges
  pcomp.edges: pcomp edges
  ngate.edges: ngate edges
  pplus_butted_edges: pplus.edges and ncomp.edges

  # PP.11: a butting Pplus/NCOMP edge is forbidden in the band either side of a well edge.
  pp11_at_nwell: pplus_butted_edges inside_part nwell_dn_edge_band
  pp11_at_lvpwell: pplus_butted_edges inside_part lvpwell_dn_outer_band
  pp11_viol: pp11_at_nwell or pp11_at_lvpwell

  # PP.5b: the Pplus boundary that is not a butting edge, where it lies in an N-well or
  # inside DNWELL but out of the LVPWELL, against the COMP boundary it must extend past.
  pp5b_pplus_all: pplus.edges not pplus_butted_edges
  pp5b_in_nwell: pp5b_pplus_all inside_part nwell
  pp5b_out_lvpwell: pp5b_pplus_all outside_part lvpwell
  pp5b_in_dnwell: pp5b_out_lvpwell inside_part dnwell
  pp5b_pplus: pp5b_in_nwell or pp5b_in_dnwell

  # PP.5ci / PP.5cii: inside DNWELL and inside LVPWELL, split by whether the COMP edge
  # sits in the well's inner region or in the band along its edge.
  pp5c_bg_all: pplus_in_lvpwell_dn edges
  pp5c_bg: pp5c_bg_all not nplus.edges
  pp5c_fg_all: pcomp_in_lvpwell_dn edges
  pp5c_fg_no_nplus: pp5c_fg_all not nplus.edges
  pp5ci_fg: pp5c_fg_no_nplus inside_part lvpwell_dn_sized_in
  pp5cii_fg: pp5c_fg_no_nplus inside_part lvpwell_dn_edge_band

  # PP.5di / PP.5dii: outside DNWELL, split by whether the COMP edge is within 0.429 um
  # of an N-well.
  pp5d_bg: pplus_outside_dn edges
  pp5d_pcomp: pcomp_out_dnwell edges
  pp5d_fg_all: pp5d_pcomp not nplus.edges
  pp5di_fg_all: pp5d_fg_all outside_part nwell_n_dn_reach
  pp5dii_fg_all: pp5d_fg_all inside_part nwell_n_dn_reach
  pp5di_fg: pp5di_fg_all
  pp5dii_fg: pp5dii_fg_all

  pgate.edges: pgate edges
  poly2.edges: poly2_drawn edges
  plfuse_efuse.edges: plfuse_efuse edges
  ef04a_off_poly: plfuse_efuse.edges not poly2.edges
  ef04a_long_off: ef04a_off_poly outside_part poly2_drawn
  # NP.4b / PP.4b: the gate extension's sides, not the whole poly outline near the gate.
  # The gate's edges that are not active edges are its sides, along the poly; the poly
  # edges that carry them are the sides of the extension too, trimmed by a percent so a
  # corner touch does not pull in the end cap, and cut to 0.32 um of the channel.  An
  # implant edge butting the extension's end cap is the cap's business, not this rule's.
  ngate_sides: ngate.edges not ncomp.edges
  ngate_side_poly: poly2.edges interacting_edges ngate_sides
  ngate_side_poly_c: ngate_side_poly centers 99%
  pp4b_poly: ngate_side_poly_c inside_part ngate_reach_flat
  pgate_sides: pgate.edges not pcomp.edges
  pgate_side_poly: poly2.edges interacting_edges pgate_sides
  pgate_side_poly_c: pgate_side_poly centers 99%
  np4b_poly: pgate_side_poly_c inside_part pgate_reach_flat
  nplus_butted_edges: nplus.edges and pcomp.edges

  # NP.11: mirror of PP.11, on the other implant.
  np11_at_nwell: nplus_butted_edges inside_part nwell_dn_outer_band
  np11_at_lvpwell: nplus_butted_edges inside_part lvpwell_dn_edge_band
  np11_viol: np11_at_nwell or np11_at_lvpwell

  # NP.5b: the Nplus boundary that is not a butting edge, in an LVPWELL or clear of both
  # NWELL and DNWELL, against the NCOMP boundary it must extend past.
  np5b_nplus_all: nplus.edges not nplus_butted_edges
  np5b_in_lvpwell: np5b_nplus_all inside_part lvpwell
  np5b_out_nwell: np5b_nplus_all outside_part nwell
  np5b_out_both: np5b_out_nwell outside_part dnwell
  np5b_nplus: np5b_in_lvpwell or np5b_out_both

  # NP.5ci / NP.5cii: inside DNWELL but out of the LVPWELL, split by whether the NCOMP
  # edge falls within 0.429 um of the LVPWELL.
  np5c_bg: nplus_out_lvpwell_dn edges
  np5c_fg_all: ncomp_out_lvpwell_dn edges
  np5c_fg_no_pplus: np5c_fg_all not pplus.edges
  np5ci_fg_all: np5c_fg_no_pplus inside_part lvpwell_dn_reach
  np5cii_fg_all: np5c_fg_no_pplus outside_part lvpwell_dn_reach
  np5ci_fg: np5ci_fg_all
  np5cii_fg: np5cii_fg_all

  # NP.5di / NP.5dii: at an N-well and outside DNWELL, split by whether the NCOMP edge
  # sits in the band along the well edge or in its inner region.
  np5d_bg_all: nplus_at_nwell edges
  np5dii_bg: np5d_bg_all not pplus.edges
  np5d_fg_all: ncomp_at_nwell edges
  np5d_fg_no_pplus: np5d_fg_all not pplus.edges
  np5di_fg_all: np5d_fg_no_pplus inside_part nwell_dn_edge_band
  np5dii_fg_all: np5d_fg_no_pplus inside_part nwell_n_dn_sized_in
  np5di_fg: np5di_fg_all with_length min 0.006
  np5dii_fg: np5dii_fg_all with_length min 0.006

  # O.PL.ORT: an orientation-restricted gate's width must run along x, so a channel edge
  # that is not horizontal is the violation.
  comp_otp_no_poly.edges: comp_otp_no_poly edges
  oplort_channel: comp_otp_no_poly.edges and tgate.edges
  oplort_turned: oplort_channel without_angle 0
  oplort_viol: oplort_turned outside_part v5_xtor
  comp_3p3v_no_poly.edges: comp_3p3v_no_poly edges
  comp_56v_no_poly.edges: comp_56v_no_poly edges
  tgate.edges: tgate edges
  channel_edges_3p3v: comp_3p3v_no_poly.edges and tgate.edges
  channel_edges_56v: comp_56v_no_poly.edges and tgate.edges
