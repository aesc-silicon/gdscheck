  - name: lres9a_viol
    op: interacting
    mode: lazy
    layers: [res_mk_on_lres, res_mk_off_lres]
  # CO.9: a contact sitting on a butted N/P COMP boundary.
  - name: co9_viol
    op: interacting
    mode: lazy
    layers: [contact, ncomp_pcomp_butting_edges]
  # DF.11: the COMP touching a butted NCOMP has its own width minimum.
  - name: comp_at_ncomp_butted
    op: interacting
    mode: lazy
    layers: [comp, ncomp_butted]

