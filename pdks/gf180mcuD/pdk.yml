# Net extraction.  Upstream states connectivity as bare `connect(a, b)` pairs; this
# engine is connector-based - a via/contact layer bridges the conductors it sits
# inside - so the pairs that have no drawn connector (a well tie, an LDMOS drain)
# get one derived for them below, named `*_tap`.  One conductor per entry, ordered
# bottom-up, so an antenna rule can cut the stack at a given level.
connectivity:
  - connector: contact
    layers: [poly2_drawn]
  - connector: contact
    layers: [ncomp_con]
  - connector: contact
    layers: [pcomp_con]
  - connector: contact
    layers: [natcomp_con]
  - connector: contact
    layers: [metal1_drawn]
  - connector: via1
    layers: [metal1_drawn]
  - connector: via1
    layers: [metal2_drawn]
  - connector: via2
    layers: [metal2_drawn]
  - connector: via2
    layers: [metal3_drawn]
  - connector: via3
    layers: [metal3_drawn]
  - connector: via3
    layers: [metal4_drawn]
  - connector: via4
    layers: [metal4_drawn]
  - connector: via4
    layers: [metal5_drawn]
  # Well ties and device bodies: the tap diffusion is the connector between the well
  # and the contacted active it straps.
  - connector: ntap
    layers: [nwell, ncomp_con]
  - connector: ntap_dn
    layers: [dnwell_n, ncomp_con]
  - connector: ptap
    layers: [lvpwell, pcomp_con]
  - connector: mvsd_tap
    layers: [mvsd, ncomp_con]
  - connector: mvpsd_tap
    layers: [mvpsd, pcomp_con]
  # MIM option B ties the cap's top plate to the top metal (`connect(top_metal_drawn,
  # fusetop)` upstream).  Reconfirm against the MIM device model before the antenna
  # deck relies on it - the bridge is derived here rather than drawn.
  - connector: mimcap_top_tap
    layers: [fusetop, metal5_drawn]

# The derived "generic" layer table every deck is written against, ported from
# generic_layers.rb (STATIC_LAYERS plus the metal aliases).  Upstream chains these
# several levels deep - psd_dn rests on pgate_dn on pgate on pactive on pcomp on
# comp - and only `mode: lazy` layers may reference another virtual layer, so the
# whole table is lazy.  A deck needing one of these under a whole-layout check
# (inside_boundary) must mark that entry `mode: global` and flatten the chain.
#
# Where upstream composes several operations in one expression, the intermediate
# steps are named here rather than inlined; they carry the suffix that says what is
# still to be removed (`_all`, `_touching`).
virtual_layers:
  # ---- Wells --------------------------------------------------------------
  - name: dnwell_n
    op: difference
    mode: lazy
    layers: [dnwell, lvpwell]
  - name: dnwell_p
    op: intersection
    mode: lazy
    layers: [dnwell, lvpwell]
  - name: all_nwell
    op: union
    mode: lazy
    layers: [dnwell_n, nwell]

  # ---- Comps and gates ----------------------------------------------------
  - name: ncomp
    op: intersection
    mode: lazy
    layers: [comp, nplus]
  - name: pcomp
    op: intersection
    mode: lazy
    layers: [comp, pplus]
  - name: ncomp_con
    op: difference
    mode: lazy
    layers: [ncomp, poly2_drawn]
  - name: pcomp_con
    op: difference
    mode: lazy
    layers: [pcomp, poly2_drawn]
  - name: tgate_all
    op: intersection
    mode: lazy
    layers: [poly2_drawn, comp]
  - name: tgate
    op: difference
    mode: lazy
    layers: [tgate_all, res_mk]

  # ---- N devices ----------------------------------------------------------
  - name: nactive
    op: difference
    mode: lazy
    layers: [ncomp, all_nwell]
  - name: n_diode
    op: difference
    mode: lazy
    layers: [ncomp_con, nwell]
  - name: ngate
    op: intersection
    mode: lazy
    layers: [nactive, tgate]
  # Source/drain: the active regions that meet a gate, gate itself removed.  Upstream
  # uses KLayout `interacting`, so a region abutting the gate with no overlap counts.
  - name: nsd_touching
    op: interacting
    mode: lazy
    layers: [nactive, ngate]
  - name: nsd
    op: difference
    mode: lazy
    layers: [nsd_touching, ngate, res_mk]
  - name: ptap
    op: difference
    mode: lazy
    layers: [pcomp, all_nwell, res_mk]

  # ---- P devices ----------------------------------------------------------
  - name: pactive
    op: intersection
    mode: lazy
    layers: [pcomp, all_nwell]
  - name: p_diode
    op: intersection
    mode: lazy
    layers: [pcomp_con, nwell]
  - name: pgate
    op: intersection
    mode: lazy
    layers: [pactive, tgate]
  - name: psd_touching
    op: interacting
    mode: lazy
    layers: [pactive, pgate]
  - name: psd
    op: difference
    mode: lazy
    layers: [psd_touching, pgate, res_mk]
  - name: ntap_all
    op: intersection
    mode: lazy
    layers: [ncomp, all_nwell]
  - name: ntap
    op: difference
    mode: lazy
    layers: [ntap_all, res_mk]

  # ---- Inside the deep N-well --------------------------------------------
  - name: ngate_dn
    op: intersection
    mode: lazy
    layers: [ngate, dnwell_p]
  - name: ptap_dn_all
    op: intersection
    mode: lazy
    layers: [ptap, dnwell_p]
  - name: ptap_dn
    op: not_overlapping
    mode: lazy
    layers: [ptap_dn_all, well_diode_mk]
  - name: pgate_dn
    op: intersection
    mode: lazy
    layers: [pgate, dnwell_n]
  - name: ntap_dn
    op: intersection
    mode: lazy
    layers: [ntap, dnwell_n]
  - name: pcomp_dn
    op: intersection
    mode: lazy
    layers: [pcomp, dnwell_n]
  - name: psd_dn_touching
    op: interacting
    mode: lazy
    layers: [pcomp_dn, pgate_dn]
  - name: psd_dn
    op: difference
    mode: lazy
    layers: [psd_dn_touching, pgate_dn, res_mk]
  - name: ncomp_dn
    op: intersection
    mode: lazy
    layers: [ncomp, dnwell_p]
  - name: nsd_dn_touching
    op: interacting
    mode: lazy
    layers: [ncomp_dn, ngate_dn]
  - name: nsd_dn
    op: difference
    mode: lazy
    layers: [nsd_dn_touching, ngate_dn, res_mk]

  # ---- Native-VT device ---------------------------------------------------
  - name: natcomp
    op: intersection
    mode: lazy
    layers: [nat, comp]
  - name: natcomp_con
    op: difference
    mode: lazy
    layers: [natcomp, poly2_drawn]

  # ---- Gate voltage classes ----------------------------------------------
  # dualgate marks the thick-oxide (5/6 V) devices; v5_xtor then splits those into
  # 5 V (inside it) and 6 V (outside it).
  - name: nom_gate
    op: difference
    mode: lazy
    layers: [tgate, dualgate]
  - name: thick_gate
    op: intersection
    mode: lazy
    layers: [tgate, dualgate]
  - name: ngate_56v
    op: intersection
    mode: lazy
    layers: [ngate, dualgate]
  - name: pgate_56v
    op: intersection
    mode: lazy
    layers: [pgate, dualgate]
  - name: ngate_5v
    op: intersection
    mode: lazy
    layers: [ngate_56v, v5_xtor]
  - name: pgate_5v
    op: intersection
    mode: lazy
    layers: [pgate_56v, v5_xtor]
  - name: ngate_6v
    op: difference
    mode: lazy
    layers: [ngate_56v, v5_xtor]
  - name: pgate_6v
    op: difference
    mode: lazy
    layers: [pgate_56v, v5_xtor]

  # ---- Deep N-well voltage classes ---------------------------------------
  # Whole-region selectors, not booleans: a deep well is 3.3 V only if it touches
  # neither marker anywhere, and 5/6 V if it overlaps dualgate anywhere.
  - name: dnwell_no_v5
    op: not_interacting
    mode: lazy
    layers: [dnwell, v5_xtor]
  - name: dnwell_3p3v
    op: not_interacting
    mode: lazy
    layers: [dnwell_no_v5, dualgate]
  - name: dnwell_56v
    op: overlapping
    mode: lazy
    layers: [dnwell, dualgate]

  # ---- LVPWELL ------------------------------------------------------------
  - name: lvpwell_dn
    op: interacting
    mode: lazy
    layers: [lvpwell, dnwell]
  - name: lvpwell_out
    op: not_interacting
    mode: lazy
    layers: [lvpwell, dnwell]
  - name: lvpwell_dn3p3v
    op: intersection
    mode: lazy
    layers: [lvpwell, dnwell_3p3v]
  - name: lvpwell_dn56v
    op: intersection
    mode: lazy
    layers: [lvpwell, dnwell_56v]

  # ---- NWELL --------------------------------------------------------------
  - name: nwell_dn
    op: interacting
    mode: lazy
    layers: [nwell, dnwell]
  - name: nwell_n_dn
    op: not_interacting
    mode: lazy
    layers: [nwell, dnwell]

  # ---- Drawn plus dummy ---------------------------------------------------
  # Most rules run on the conductor as fabricated, which includes the fill.
  - name: poly2
    op: union
    mode: lazy
    layers: [poly2_drawn, poly2_dummy]
  - name: metal1
    op: union
    mode: lazy
    layers: [metal1_drawn, metal1_dummy]
  - name: metal2
    op: union
    mode: lazy
    layers: [metal2_drawn, metal2_dummy]
  - name: metal3
    op: union
    mode: lazy
    layers: [metal3_drawn, metal3_dummy]
  - name: metal4
    op: union
    mode: lazy
    layers: [metal4_drawn, metal4_dummy]
  - name: metal5
    op: union
    mode: lazy
    layers: [metal5_drawn, metal5_dummy]

  # ---- Top-of-stack aliases ----------------------------------------------
  # On a 5LM stack the top metal is Metal5, so the metaltop deck runs against it.
  # A single-source union is the alias: it renames without copying a rule set.
  - name: top_metal_drawn
    op: union
    mode: lazy
    layers: [metal5_drawn]
  - name: top_metal
    op: union
    mode: lazy
    layers: [metal5]
  - name: topmin1_metal
    op: union
    mode: lazy
    layers: [metal4]
  - name: top_via
    op: union
    mode: lazy
    layers: [via4]
  - name: topmin1_via
    op: union
    mode: lazy
    layers: [via3]

  # ---- Connect-graph bridges ---------------------------------------------
  # Derived stand-ins for upstream's connector-less `connect(a, b)` pairs; see the
  # connectivity block above.
  - name: mvsd_tap
    op: intersection
    mode: lazy
    layers: [mvsd, ncomp_con]
  - name: mvpsd_tap
    op: intersection
    mode: lazy
    layers: [mvpsd, pcomp_con]
  - name: mimcap_top_tap
    op: intersection
    mode: lazy
    layers: [fusetop, metal5_drawn]

