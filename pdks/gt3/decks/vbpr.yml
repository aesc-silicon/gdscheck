# Via from the buried power rail to SDCON (Include/gt3.vbpr.drc.rs).
rules:
  - id: VBPR.1
    check: exact_width
    layers: [VBPR]
    value: 0.011
    params:
      facing: y
  - id: VBPR.2
    check: exact_width
    layers: [VBPR]
    value: 0.015
    params:
      facing: x
  - id: VBPR.3
    check: forbidden
    layers: [VbprOnGcut]
    value: 0.0
  - id: VBPR.4
    check: forbidden
    layers: [VbprOutsideSdcon]
    value: 0.0
