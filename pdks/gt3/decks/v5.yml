# V5, the via from M5 to M6 (Include/gt3.v5.drc.rs).  V5.5, the spacing,
# has no check upstream.
rules:
  - id: V5.1
    check: min_width
    layers: [V5]
    value: 0.021
    params:
      facing: x
  - id: V5.2
    check: min_width
    layers: [V5]
    value: 0.038
    params:
      facing: y
  - id: V5.3
    check: forbidden
    layers: [V5VEdgesOffM5]
    value: 0.0
  - id: V5.4
    check: forbidden
    layers: [V5HEdgesOffM6]
    value: 0.0
  - id: V5.6
    check: min_space
    layers: [V5]
    value: 0.027
    params:
      facing: none
  - id: V5.7
    check: forbidden
    layers: [V5OffM5]
    value: 0.0
  - id: V5.8
    check: forbidden
    layers: [V5OffM6]
    value: 0.0
  - id: V5.M5.EN
    check: min_enclosure
    layers: [M5, V5]
    value: 0.006
    params:
      facing: y
      interacting_only: 1
  - id: V5.M6.EN
    check: min_enclosure
    layers: [M6, V5]
    value: 0.006
    params:
      facing: x
      interacting_only: 1
