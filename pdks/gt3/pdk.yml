virtual_layers:
  # The runset's own derived layers: the gate GCUT does not cut, which VG lands on.
  GatePoly: GATE not GCUT
  GateNoDummy: GATE not DUMMY
  # "May not bend" and "must be rectangle": `not_rectangles`.
  BPRBent: BPR not_rectangle
  GATEBent: GATE not_rectangle
  DUMMYBent: DUMMY not_rectangle
  GCUTBent: GCUT not_rectangle
  VGBent: VG not_rectangle
  SDCONBent: SDCON not_rectangle
  VSDBent: VSD not_rectangle
  M0Bent: M0 not_rectangle
  V0Bent: V0 not_rectangle
  M1Bent: M1 not_rectangle
  M2Bent: M2 not_rectangle
  M3Bent: M3 not_rectangle
  M4Bent: M4 not_rectangle
  M5Bent: M5 not_rectangle
  M6Bent: M6 not_rectangle
  # `interacting(a, b, include_touch = NONE)` is `overlapping`, with ALL `interacting`;
  # `not_interacting(..., NONE)` is `not_overlapping`; `not_inside(..., ALL)` is
  # `not_inside`.
  VbprOnGcut: VBPR overlapping GCUT
  VbprOutsideSdcon: VBPR not_inside SDCON
  DummyOffGate: DUMMY not_overlapping GATE
  DummyOutsideGate: DUMMY not_inside GATE
  GcutOffGate: GCUT not_overlapping GATE
  GcutOnAct: GCUT interacting ACT
  GcutOrDummy: GCUT or DUMMY
  VgOnGcutDummy: VG interacting GcutOrDummy
  VgOffGate: VG not_overlapping GATE
  VgOutsideGate: VG not_inside GATE
  VgOutsideM0: VG not_inside M0
  VsdOutsideSdcon: VSD not_inside SDCON
  VsdOutsideM0: VSD not_inside M0
  V0OutsideM0: V0 not_inside M0
  V0OutsideM1: V0 not_inside M1
  V1OffM1: V1 not_overlapping M1
  V1OffM2: V1 not_overlapping M2
  V2OffM2: V2 not_overlapping M2
  V2OffM3: V2 not_overlapping M3
  V3OffM3: V3 not_overlapping M3
  V3OffM4: V3 not_overlapping M4
  V4OffM4: V4 not_overlapping M4
  V4OffM5: V4 not_overlapping M5
  V5OffM5: V5 not_overlapping M5
  V5OffM6: V5 not_overlapping M6

  # Edge layers share the virtual-layer expression mapping.
  # GCUT.7: a GCUT's vertical edge inside, or on, a gate that is not a DUMMY.  A piece
  # on the gate's wall is inside it from either side, as upstream's interacting_edge
  # reads it, so the one selection holds both.
  GCUT.edges: GCUT edges
  GcutVEdges: GCUT.edges with_angle min 90.0 max 90.0
  GcutVEdgesInGate: GcutVEdges inside_part GateNoDummy
  # ACT.6: an active's vertical edges lie in a DUMMY.
  ACT.edges: ACT edges
  ActVEdges: ACT.edges with_angle min 90.0 max 90.0
  ActVEdgesOffDummy: ActVEdges outside_part DUMMY
  # A via's vertical edges lie on the vertical-routed metal above or below it, its
  # horizontal edges on the horizontal one: upstream's `not_inside_touching_edge` keeps
  # the via edges with no inside coincidence with the metal's, so a via inside a wider
  # metal is off it as surely as one sticking out.  These are the parts of a via's edges
  # not on the metal's outline; a via abutting the metal from outside lies on it, and
  # V*.4/V*.5 and V*.7/V*.8 report that via instead.
  M0.edges: M0 edges
  M1.edges: M1 edges
  M2.edges: M2 edges
  M3.edges: M3 edges
  M4.edges: M4 edges
  M5.edges: M5 edges
  M6.edges: M6 edges
  V0.edges: V0 edges
  V0VEdges: V0.edges with_angle min 90.0 max 90.0
  V0HEdges: V0.edges with_angle min 0.0 max 0.0
  V0VEdgesOffM1: V0VEdges not M1.edges
  V0HEdgesOffM0: V0HEdges not M0.edges
  V1.edges: V1 edges
  V1VEdges: V1.edges with_angle min 90.0 max 90.0
  V1HEdges: V1.edges with_angle min 0.0 max 0.0
  V1VEdgesOffM1: V1VEdges not M1.edges
  V1HEdgesOffM2: V1HEdges not M2.edges
  V2.edges: V2 edges
  V2VEdges: V2.edges with_angle min 90.0 max 90.0
  V2HEdges: V2.edges with_angle min 0.0 max 0.0
  V2VEdgesOffM3: V2VEdges not M3.edges
  V2HEdgesOffM2: V2HEdges not M2.edges
  V3.edges: V3 edges
  V3VEdges: V3.edges with_angle min 90.0 max 90.0
  V3HEdges: V3.edges with_angle min 0.0 max 0.0
  V3VEdgesOffM3: V3VEdges not M3.edges
  V3HEdgesOffM4: V3HEdges not M4.edges
  V4.edges: V4 edges
  V4VEdges: V4.edges with_angle min 90.0 max 90.0
  V4HEdges: V4.edges with_angle min 0.0 max 0.0
  V4VEdgesOffM5: V4VEdges not M5.edges
  V4HEdgesOffM4: V4HEdges not M4.edges
  V5.edges: V5 edges
  V5VEdges: V5.edges with_angle min 90.0 max 90.0
  V5HEdges: V5.edges with_angle min 0.0 max 0.0
  V5VEdgesOffM5: V5VEdges not M5.edges
  V5HEdgesOffM6: V5HEdges not M6.edges

