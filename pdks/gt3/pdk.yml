# GT3, the 3 nm GAAFET PDK from the Georgia Institute of Technology (initial release).
# The decks translate its IC Validator runset, icv_runset/gt3_main.drc.rs and the files
# it includes, rule for rule: one deck per included file, the ids as the runset's rule
# descriptions give them.  The runset checks the front end and M0-M6; it has no rules
# for V6 and above, and neither has this PDK.
#
# Layouts are drawn at the real 3 nm scale on a 0.5 nm grid.  ICV's `direction =
# HORIZONTAL` reads `facing: x`, `VERTICAL` `facing: y`; `external_corner1` is
# `facing: none`; `enclose` is a `min_enclosure` read where the two interact.  The
# rules the runset names but does not check are listed in each deck's header.
name: GT3
version: "0.1"

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every deck
  - name: feol
    path: suites/feol.yml
    description: Front end and middle of line, through V0 (a standard cell)
  - name: beol
    path: suites/beol.yml
    description: Routing stack, M1 to M6

decks:
  - name: bpr
    path: decks/bpr.yml
    description: Buried power rail
  - name: vbpr
    path: decks/vbpr.yml
    description: Via BPR to SDCON
  - name: gate
    path: decks/gate.yml
    description: Gate
  - name: dummy
    path: decks/dummy.yml
    description: Diffusion-break gate marker
  - name: gcut
    path: decks/gcut.yml
    description: Gate cut
  - name: vg
    path: decks/vg.yml
    description: Gate contact
  - name: act
    path: decks/act.yml
    description: Active
  - name: npsel
    path: decks/npsel.yml
    description: N/P select
  - name: sdcon
    path: decks/sdcon.yml
    description: Source/drain contact
  - name: vsd
    path: decks/vsd.yml
    description: Via SDCON to M0
  - name: m0
    path: decks/m0.yml
    description: Metal 0
  - name: v0
    path: decks/v0.yml
    description: Via 0
  - name: m1
    path: decks/m1.yml
    description: Metal 1
  - name: v1
    path: decks/v1.yml
    description: Via 1
  - name: m2
    path: decks/m2.yml
    description: Metal 2
  - name: v2
    path: decks/v2.yml
    description: Via 2
  - name: m3
    path: decks/m3.yml
    description: Metal 3
  - name: v3
    path: decks/v3.yml
    description: Via 3
  - name: m4
    path: decks/m4.yml
    description: Metal 4
  - name: v4
    path: decks/v4.yml
    description: Via 4
  - name: m5
    path: decks/m5.yml
    description: Metal 5
  - name: v5
    path: decks/v5.yml
    description: Via 5
  - name: m6
    path: decks/m6.yml
    description: Metal 6

