    check: min_space
    layers: [GatPoly.filler, GatPoly]
    value: 1.10
    params:
      abutting: report
  - id: GFil.d
    check: min_space
    layers: [GatPoly.filler, Cont]
    value: 1.10
    params:
      abutting: report
  - id: GFil.d
    check: min_space
    layers: [GatPoly.filler, pSD]
    value: 1.10
    params:
      abutting: report
  - id: GFil.d
    check: min_space
    layers: [GatPoly.filler, nSD.block]
    value: 1.10
    params:
      abutting: report
  - id: GFil.d
    check: min_space
    layers: [GatPoly.filler, SalBlock]
    value: 1.10
    params:
      abutting: report
  - id: GFil.e
    check: min_space
    layers: [GatPoly.filler, NWell]
    value: 1.10
    params:
      abutting: report
  - id: GFil.e
    check: min_space
    layers: [GatPoly.filler, nBuLayDerived]
