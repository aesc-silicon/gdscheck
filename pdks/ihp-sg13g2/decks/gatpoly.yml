      abutting: report
  - id: GFil.f
    check: min_space
    layers: [GatPoly.filler, TRANS]
    value: 1.10
    params:
      abutting: report
  - id: GFil.g
    check: min_density
    layers: [GatPoly, GatPoly.filler]
    value: 15.00
