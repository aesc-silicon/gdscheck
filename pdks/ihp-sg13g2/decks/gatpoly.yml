rules:
  - id: Gat.a
    check: min_width
    layers: [GatPoly]
    value: 0.13
  - id: Gat.a1
    check: min_gate_length
    layers: [GatPoly, GatPolyOverNsdActivNoTGO]
    value: 0.13
  - id: Gat.a2
    check: min_gate_length
    layers: [GatPoly, GatPolyOverPsdActivNoTGO]
    value: 0.13
  - id: Gat.a3
    check: min_gate_length
    layers: [GatPoly, GatPolyOverNsdActivTGO]
    value: 0.45
  - id: Gat.a4
    check: min_gate_length
    layers: [GatPoly, GatPolyOverPsdActivTGO]
    value: 0.40
  - id: Gat.b
    check: min_space
    layers: [GatPoly]
    value: 0.18
  - id: Gat.b
    check: min_notch
    layers: [GatPoly]
    value: 0.18
  - id: Gat.b1
    check: min_space
    layers: [GatPolyHV]
    value: 0.25
  - id: Gat.c
    check: min_enclosure
    layers: [GatPolyNoSRAM, Activ]
    value: 0.18
    params:
      metric: euclidian
      interacting_only: 1
  - id: Gat.c
    check: forbidden
    layers: [GatPolyInsideActiv]
    value: 0.0
  - id: Gat.d
    check: min_space
    layers: [GatPoly, Activ]
    value: 0.07
    params:
      abutting: report
  - id: Gat.e
    check: min_area
    layers: [GatPoly]
    value: 0.09
    params:
      touching: separate
  - id: Gat.f
    check: forbidden
    layers: [GatPolyOverActivNotRect]
    value: 0.0
  - id: Gat.g
    check: min_width
    layers: [GatPoly]
    value: 0.16
    params:
      angle: bent
      length: 0.39
  - id: GFil.a
    check: max_width
    layers: [GatPoly.filler]
    value: 5.00
    params:
      span: narrowest
  - id: GFil.b
    check: min_width
    layers: [GatPoly.filler]
    value: 0.70
  - id: GFil.c
    check: min_space
    layers: [GatPoly.filler]
    value: 0.80
