      boundary: EdgeSeal.boundary
  - id: GFil.i
    check: max_area
    layers: [GatPoly.nofill]
    value: 160000.0
    params:
      touching: separate
  - id: GFil.j
    check: min_enclosure
    layers: [GatPoly.filler, Activ.filler]
    value: 0.18
    params:
      metric: euclidian
      interacting_only: 1
