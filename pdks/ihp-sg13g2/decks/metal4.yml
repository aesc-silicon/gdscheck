rules:
  - id: M4.a
    check: min_width
    layers: [Metal4NoSealring]
    value: 0.20
  - id: M4.b
    check: min_space
    layers: [Metal4NoSealring]
    value: 0.21
  - id: M4.b
    check: min_notch
    layers: [Metal4NoSealring]
    value: 0.21
  - id: M4.c
    check: min_enclosure
    layers: [Metal4, Via3NoSealring]
    value: 0.005
  - id: M4.c1
    check: min_enclosure
    layers: [Metal4, Via3NoSealring]
    value: 0.05
    params:
      sides: adjacent
      trigger: 0.05
  - id: M4.d
    check: min_area
    layers: [Metal4NoSealring]
    value: 0.144
    params:
      touching: separate
  - id: M4.e
    check: min_space
    layers: [Metal4NoSealring]
    value: 0.24
    params:
      width: 0.39
      length: 1.00
  - id: M4.f
    check: min_space
    layers: [Metal4NoSealring]
    value: 0.60
    params:
      width: 10.00
      length: 10.00
  - id: M4.g
    check: min_width
    layers: [Metal4NoSealring]
    value: 0.24
    params:
      angle: bent
      length: 0.50
  - id: M4.i
    check: min_space
    layers: [Metal4NoSealring]
    value: 0.24
    params:
      angle: bent
  - id: M4.j
    check: min_density
    layers: [Metal4Density]
    value: 35.00
    layer_params:
      boundary: EdgeSeal.boundary
  - id: M4.k
    check: max_density
    layers: [Metal4Density]
    value: 60.00
    layer_params:
      boundary: EdgeSeal.boundary

  - id: M4Fil.a1
    check: min_width
    layers: [Metal4.filler]
    value: 1.00
  - id: M4Fil.a2
    check: max_length
    layers: [Metal4.filler]
    value: 5.00
  - id: M4Fil.b
    check: min_space
    layers: [Metal4.filler]
    value: 0.42
  - id: M4Fil.c
    check: min_space
    layers: [Metal4.filler, Metal4]
    value: 0.42
    params:
      abutting: report
  - id: M4Fil.d
    check: min_space
    layers: [Metal4.filler, TRANS]
    value: 1.00
    params:
      abutting: report
  - id: M4Fil.d
    check: min_enclosure
    layers: [TRANS, Metal4FillerInTRANS]
    value: 1.00
  - id: M4Fil.h
    check: min_density
    layers: [Metal4Density]
    value: 25.00
    params:
      scope: window
      window: 800.0
    layer_params:
      boundary: EdgeSeal.boundary
  - id: M4Fil.k
    check: max_density
    layers: [Metal4Density]
    value: 75.00
    params:
      scope: window
      window: 800.0
    layer_params:
      boundary: EdgeSeal.boundary
