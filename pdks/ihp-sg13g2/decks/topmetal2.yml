rules:
  - id: TM2.a
    check: min_width
    layers: [TopMetal2]
    value: 2.00
  - id: TM2.b
    check: min_space
    layers: [TopMetal2]
    value: 2.00
  - id: TM2.b
    check: min_notch
    layers: [TopMetal2]
    value: 2.00
  - id: TM2.bR
    check: min_space
    layers: [TopMetal2NotIND]
    value: 5.00
    params:
      width: 5.00
      length: 50.00
  - id: TM2.c
    check: min_density
    layers: [TopMetal2Density]
    value: 25.00
    layer_params:
      boundary: EdgeSeal.boundary
  - id: TM2.d
    check: max_density
    layers: [TopMetal2Density]
    value: 70.00
    layer_params:
      boundary: EdgeSeal.boundary

  - id: TM2Fil.a
    check: min_width
    layers: [TopMetal2.filler]
    value: 5.00
  - id: TM2Fil.a1
    check: max_length
    layers: [TopMetal2.filler]
    value: 10.00
  - id: TM2Fil.b
    check: min_space
    layers: [TopMetal2.filler]
    value: 3.00
  - id: TM2Fil.c
    check: min_space
    layers: [TopMetal2.filler, TopMetal2]
    value: 3.00
    params:
      abutting: report
  - id: TM2Fil.d
    check: min_space
    layers: [TopMetal2.filler, TRANS]
    value: 4.90
    params:
      abutting: report
  - id: TM2Fil.d
    check: min_enclosure
    layers: [TRANS, TopMetal2FillerInTRANS]
    value: 4.90
