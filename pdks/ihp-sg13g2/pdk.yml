name: IHP SG13G2
version: "1.0"

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every per-layer deck
  - name: core
    path: suites/core.yml
    description: Geometric DRC - main minus antenna and density/fill
  - name: precheck
    path: suites/precheck.yml
    description: IHP open-source precheck subset
  - name: density
    path: suites/density.yml
    description: Dummy-fill density checks
  - name: antenna
    path: suites/antenna.yml
    description: Antenna checks only

decks:
  - name: offgrid
    path: decks/offgrid.yml
    description: Off-grid geometry (5 nm grid)
  - name: forbidden
    path: decks/forbidden.yml
    description: Forbidden layers
  - name: pin
    path: decks/pin.yml
    description: Pins and labels
  - name: lbe
    path: decks/lbe.yml
    description: LBE layer
  - name: pad
    path: decks/pad.yml
    description: Bond pads

  - name: activ
    path: decks/activ.yml
    description: Active area
  - name: tgo
    path: decks/tgo.yml
    description: Thick gate oxide (HV devices)
  - name: gatpoly
    path: decks/gatpoly.yml
    description: Gate poly
  - name: extblock
    path: decks/extblock.yml
    description: Extension-implant block (EXTBlock)
  - name: cont
    path: decks/cont.yml
    description: Contacts
  - name: contbar
    path: decks/contbar.yml
    description: Contact bars
  - name: salblock
    path: decks/salblock.yml
    description: Salicide block
  - name: nsdblock
    path: decks/nsdblock.yml
    description: n+ S/D implant block
  - name: psd
    path: decks/psd.yml
    description: p+ S/D implant (pSD)
  - name: resistor
    path: decks/resistor.yml
    description: Poly resistors (Rsil/Rppd/Rhigh)
  - name: nmosi
    path: decks/nmosi.yml
    description: Isolated NMOS (nBuLay-isolated PWell)
  - name: npn
    path: decks/npn.yml
    description: Bipolar npn HBT (npnG2, npn13G2/L/V)
  - name: sdiod
    path: decks/sdiod.yml
    description: Schottky diode (nBuLay/PWell:block/nSD:block/SalBlock ContBar)
  - name: nwell
    path: decks/nwell.yml
    description: N-well
  - name: pwellblock
    path: decks/pwellblock.yml
    description: P-well block
  - name: nbulay
    path: decks/nbulay.yml
    description: N-buried layer
  - name: nbulayblock
    path: decks/nbulayblock.yml
    description: N-buried-layer block
  - name: metal1
    path: decks/metal1.yml
    description: Metal 1
  - name: metal2
    path: decks/metal2.yml
    description: Metal 2
  - name: metal3
    path: decks/metal3.yml
    description: Metal 3
  - name: metal4
    path: decks/metal4.yml
    description: Metal 4
  - name: metal5
    path: decks/metal5.yml
    description: Metal 5
  - name: via1
    path: decks/via1.yml
    description: Via 1
  - name: via2
    path: decks/via2.yml
    description: Via 2
  - name: via3
    path: decks/via3.yml
    description: Via 3
  - name: via4
    path: decks/via4.yml
    description: Via 4
  - name: topvia1
    path: decks/topvia1.yml
    description: Top via 1
  - name: topmetal1
    path: decks/topmetal1.yml
    description: Top metal 1
  - name: topvia2
    path: decks/topvia2.yml
    description: Top via 2
  - name: topmetal2
    path: decks/topmetal2.yml
    description: Top metal 2
  - name: passiv
    path: decks/passiv.yml
    description: Passivation
  - name: sealring
    path: decks/sealring.yml
    description: Seal ring
  - name: slit
    path: decks/slit.yml
    description: Metal slotting (slits)
  - name: lu
    path: decks/lu.yml
    description: Latch-up
  - name: antenna
    path: decks/antenna.yml
    description: Antenna (Ant.a–i, full §7.1)
  - name: mim
    path: decks/mim.yml
    description: MIM capacitor

connectivity:
  - connector: Cont
    layers: [GatPoly]
  - connector: Cont
    layers: [Activ]
  - connector: Cont
    layers: [Metal1]
  - connector: Via1
    layers: [Metal1]
  - connector: Via1
    layers: [Metal2]
  - connector: Via2
    layers: [Metal2]
  - connector: Via2
    layers: [Metal3]
  - connector: Via3
    layers: [Metal3]
  - connector: Via3
    layers: [Metal4]
  - connector: Via4
    layers: [Metal4]
  - connector: Via4
    layers: [Metal5]
  - connector: TopVia1
    layers: [Metal5]
  - connector: TopVia1
    layers: [TopMetal1]
  - connector: TopVia2
    layers: [TopMetal1]
  - connector: TopVia2
    layers: [TopMetal2]
  - connector: NActivInNWell
    layers: [NWell, NWellMergedNoSRAM, Activ]
  - connector: NWellNBuLay
    layers: [nBuLay, nBuLayMerged, nBuLayRegions, NWell]

virtual_layers:
  - name: Pad
    op: union
    layers:
      - Passiv
      - Passiv.sbump
      - Passiv.pillar
      - dfpad
  # Lazy: an eager virtual keeps its result's outer ring only, and a bump pad with a
  # hole is exactly what Padb.f's circle test must see.
  - name: SBumpPad
    op: intersection
    mode: lazy
    layers: [Passiv.sbump, dfpad]
  - name: CuPillarPad
    op: intersection
    mode: lazy
    layers: [Passiv.pillar, dfpad]
  - name: SBumpPadBadShape
    op: not_circle_or_octagon
    mode: lazy
    layers: [SBumpPad]
  - name: CuPillarPadBadShape
    op: not_circle
    mode: lazy
    layers: [CuPillarPad]
  # Padc.a: table 6.1 allows openings of 35, 40 and 45 µm - a pad is one of them, or
  # it is the violation; Padc.b: 45 µm openings keep 50, the others 40.
  - name: CuPillarPad35Wide
    op: with_bbox_max
    mode: lazy
    min: 35.0
    max: 35.005
    layers: [CuPillarPad]
  - name: CuPillarPad35
    op: with_bbox_min
    mode: lazy
    min: 35.0
    max: 35.005
    layers: [CuPillarPad35Wide]
  - name: CuPillarPad40Wide
    op: with_bbox_max
    mode: lazy
    min: 40.0
    max: 40.005
    layers: [CuPillarPad]
  - name: CuPillarPad40
    op: with_bbox_min
    mode: lazy
    min: 40.0
    max: 40.005
    layers: [CuPillarPad40Wide]
  - name: CuPillarPad45Wide
    op: with_bbox_max
    mode: lazy
    min: 45.0
    max: 45.005
    layers: [CuPillarPad]
  - name: CuPillarPad45
    op: with_bbox_min
    mode: lazy
    min: 45.0
    max: 45.005
    layers: [CuPillarPad45Wide]
  - name: CuPillarPadNot45
    op: not_overlapping
    mode: lazy
    layers: [CuPillarPad, CuPillarPad45]
  - name: CuPillarPadSized
    op: union
    mode: lazy
    layers: [CuPillarPad35, CuPillarPad40, CuPillarPad45]
  - name: CuPillarPadOffSize
    op: not_overlapping
    mode: lazy
    layers: [CuPillarPad, CuPillarPadSized]
  # MIM.d reads the vias lying on the plate, whole - a via over the plate's edge is
  # enclosed by nothing there; MIM.h a plate no via lies over.
  - name: TopVia1OnMIM
    op: overlapping
    mode: lazy
    layers: [TopVia1, MIM]
  - name: ViaOnMIMAny
    op: union
    mode: lazy
    layers: [TopVia1, Vmim]
  - name: MIMNoVia
    op: not_overlapping
    mode: lazy
    layers: [MIM, ViaOnMIMAny]
  - name: CuPillarPadGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 29.995
    layers: [CuPillarPad]
  - name: PadcDBad
    op: intersection
    mode: lazy
    layers: [CuPillarPadGrown, SealActiv]

  - name: ContNoSealring
    op: difference
    mode: lazy
    layers:
      - Cont
      - EdgeSeal

  - name: Via1NoSealring
    op: difference
    mode: lazy
    layers: [Via1, EdgeSeal]
  - name: Via2NoSealring
    op: difference
    mode: lazy
    layers: [Via2, EdgeSeal]
  - name: Via3NoSealring
    op: difference
    mode: lazy
    layers: [Via3, EdgeSeal]
  - name: Via4NoSealring
    op: difference
    mode: lazy
    layers: [Via4, EdgeSeal]
  - name: TopVia1NoSealring
    op: difference
    mode: lazy
    layers: [TopVia1, EdgeSeal]
  # Section 6.10: the standard metal rules are not checked within EdgeSeal regions -
  # the metal outside the seal ring is what they read, cut at the seal's edge like the
  # vias (IHP's deck reads `Metal1.outside(EdgeSeal)` for its area and endcap rules;
  # dropping whole regions would stitch the power net of a whole die for it).
  - name: Metal1NoSealring
    op: difference
    mode: lazy
    layers: [Metal1, EdgeSeal]
  - name: Metal2NoSealring
    op: difference
    mode: lazy
    layers: [Metal2, EdgeSeal]
  - name: Metal3NoSealring
    op: difference
    mode: lazy
    layers: [Metal3, EdgeSeal]
  - name: Metal4NoSealring
    op: difference
    mode: lazy
    layers: [Metal4, EdgeSeal]
  - name: Metal5NoSealring
    op: difference
    mode: lazy
    layers: [Metal5, EdgeSeal]
  # MnFil.d: a filler lying whole inside a TRANS is enclosed by the value, as the
  # Activ:filler rules read their markers (figure 5.6).
  - name: Metal1FillerInTRANS
    op: inside
    mode: lazy
    layers: [Metal1.filler, TRANS]
  - name: Metal2FillerInTRANS
    op: inside
    mode: lazy
    layers: [Metal2.filler, TRANS]
  - name: Metal3FillerInTRANS
    op: inside
    mode: lazy
    layers: [Metal3.filler, TRANS]
  - name: Metal4FillerInTRANS
    op: inside
    mode: lazy
    layers: [Metal4.filler, TRANS]
  - name: Metal5FillerInTRANS
    op: inside
    mode: lazy
    layers: [Metal5.filler, TRANS]
  - name: TopMetal1FillerInTRANS
    op: inside
    mode: lazy
    layers: [TopMetal1.filler, TRANS]
  - name: TopMetal2FillerInTRANS
    op: inside
    mode: lazy
    layers: [TopMetal2.filler, TRANS]
  # The metal density rules read the metal as it is made: drawn, filler and mask, less
  # the slits cut into wide metal (section 7.3), as IHP's density deck has it.
  - name: Metal1Made
    op: union
    mode: lazy
    layers: [Metal1, Metal1.filler, Metal1.mask]
  - name: Metal1Density
    op: difference
    mode: lazy
    layers: [Metal1Made, Metal1.slit]
  - name: Metal2Made
    op: union
    mode: lazy
    layers: [Metal2, Metal2.filler, Metal2.mask]
  - name: Metal2Density
    op: difference
    mode: lazy
    layers: [Metal2Made, Metal2.slit]
  - name: Metal3Made
    op: union
    mode: lazy
    layers: [Metal3, Metal3.filler, Metal3.mask]
  - name: Metal3Density
    op: difference
    mode: lazy
    layers: [Metal3Made, Metal3.slit]
  - name: Metal4Made
    op: union
    mode: lazy
    layers: [Metal4, Metal4.filler, Metal4.mask]
  - name: Metal4Density
    op: difference
    mode: lazy
    layers: [Metal4Made, Metal4.slit]
  - name: Metal5Made
    op: union
    mode: lazy
    layers: [Metal5, Metal5.filler, Metal5.mask]
  - name: Metal5Density
    op: difference
    mode: lazy
    layers: [Metal5Made, Metal5.slit]
  - name: TopMetal1Made
    op: union
    mode: lazy
    layers: [TopMetal1, TopMetal1.filler, TopMetal1.mask]
  - name: TopMetal1Density
    op: difference
    mode: lazy
    layers: [TopMetal1Made, TopMetal1.slit]
  - name: TopMetal2Made
    op: union
    mode: lazy
    layers: [TopMetal2, TopMetal2.filler, TopMetal2.mask]
  - name: TopMetal2Density
    op: difference
    mode: lazy
    layers: [TopMetal2Made, TopMetal2.slit]
  - name: TopVia2NoSealring
    op: difference
    mode: lazy
    layers: [TopVia2, EdgeSeal]

  - name: PassivInSeal
    op: inside_ring
    layers: [Passiv, EdgeSeal]

  - name: TopMetal2NotIND
    op: difference
    mode: lazy
    layers: [TopMetal2, IND]

  - name: ActivOrGatPoly
    op: union
    mode: lazy
    layers: [Activ, GatPoly]

  - name: ContSquare
    op: square
    mode: lazy
    layers: [ContNoSealring]
  - name: ContBar
    op: not_square
    mode: lazy
    layers: [ContNoSealring]

  - name: ContOnGatPoly
    op: intersection
    mode: lazy
    layers: [ContSquare, GatPoly]
  - name: ContOnActiv
    op: intersection
    mode: lazy
    layers: [ContSquare, Activ]
  - name: ContOnActivNoSRAM
    op: not_overlapping
    mode: lazy
    layers: [ContOnActiv, SRAM]
  # Cnt.c: 0.07 in the analog flow, 0.05 inside DigiBnd (section 8.1.2).
  - name: ContOnActivAna
    op: not_inside
    mode: lazy
    layers: [ContOnActivNoSRAM, DigiBnd]
  - name: ContOnActivDig
    op: inside
    mode: lazy
    layers: [ContOnActivNoSRAM, DigiBnd]
  # Cnt.g1: the Cont on N+Activ, N+ by drawn nSD or by default (section 4.2).
  - name: ContOnNsdActiv
    op: intersection
    mode: lazy
    layers: [ContSquare, NActFull]
  - name: ContOnPsdActiv
    op: intersection
    mode: lazy
    layers: [ContSquare, Activ, pSD]

  - name: ContBarOnGatPoly
    op: intersection
    mode: lazy
    layers: [ContBar, GatPoly]
  - name: ContBarOnActiv
    op: intersection
    mode: lazy
    layers: [ContBar, Activ]
  - name: ContBarOnNsdActiv
    op: intersection
    mode: lazy
    layers: [ContBar, NActiv]
  - name: ContBarOnPsdActiv
    op: intersection
    mode: lazy
    layers: [ContBar, Activ, pSD]

  - name: PsdActivInNWell
    op: intersection
    mode: lazy
    layers: [Activ, pSD, NWell]
  - name: PsdActivInNWellTGO
    op: intersection
    mode: lazy
    layers: [PsdActivInNWell, ThickGateOx]
  - name: PsdActivInNWellNoTGO
    op: difference
    mode: lazy
    layers: [PsdActivInNWell, ThickGateOx]
  - name: NsdActiv
    op: intersection
    mode: lazy
    layers: [Activ, nSD]
  - name: NsdActivTGO
    op: intersection
    mode: lazy
    layers: [NsdActiv, ThickGateOx]
  - name: NsdActivNoTGO
    op: difference
    mode: lazy
    layers: [NsdActiv, ThickGateOx]
  - name: ActivDefaultN
    op: difference
    mode: lazy
    layers: [Activ, nSD.block, pSD]
  - name: NActFull
    op: union
    mode: lazy
    layers: [NsdActiv, ActivDefaultN]
  - name: NActFullNoTGO
    op: difference
    mode: lazy
    layers: [NActFull, ThickGateOx]
  - name: NActFullTGO
    op: intersection
    mode: lazy
    layers: [NActFull, ThickGateOx]
  # Section 4.2: N+Activ = Activ AND nSD, nSD = NOT (pSD OR nSD:block) OR nSD:drawing -
  # an Activ under nSD:block with no nSD drawn is no N+.
  - name: NActiv
    op: union
    mode: lazy
    layers: [NsdActiv, ActivDefaultN]
  - name: NActivInNWell
    op: intersection
    mode: lazy
    layers: [NActiv, NWell]
  - name: NActivInNWellNoTGO
    op: difference
    mode: lazy
    layers: [NActivInNWell, ThickGateOx]
  - name: NActivInNWellTGO
    op: intersection
    mode: lazy
    layers: [NActivInNWell, ThickGateOx]
  # Section 4.2: PWell = NOT (NWell OR PWell:block) OR PWell:drawing - under a
  # PWell:block an Activ is in no well at all.
  - name: NActivInPWell
    op: difference
    mode: lazy
    layers: [NActiv, NWell, PWell.block]
  - name: PsdActivInNWellTGOAna
    op: not_inside
    mode: lazy
    layers: [PsdActivInNWellTGO, DigiBnd]
  - name: PsdActivInNWellTGODig
    op: inside
    mode: lazy
    layers: [PsdActivInNWellTGO, DigiBnd]
  - name: NActFullTGOAna
    op: not_inside
    mode: lazy
    layers: [NActFullTGO, DigiBnd]
  - name: NActFullTGODig
    op: inside
    mode: lazy
    layers: [NActFullTGO, DigiBnd]
  - name: NActivInNWellTGOAna
    op: not_inside
    mode: lazy
    layers: [NActivInNWellTGO, DigiBnd]
  - name: NActivInNWellTGODig
    op: inside
    mode: lazy
    layers: [NActivInNWellTGO, DigiBnd]
  # NW.e: the NWell tie of section 4.2, (Activ AND nSD) inside NWell - N+ by drawn nSD
  # or by default, and only a shape lying whole in the well, edge on the well's edge
  # included.  One crossing the well edge is no tie "surrounded entirely by NWell";
  # its outside part is external N+Activ (NW.d).
  - name: NWellTie
    op: inside
    mode: lazy
    layers: [NActFull, NWell]
  - name: NWellTieNoTGO
    op: difference
    mode: lazy
    layers: [NWellTie, ThickGateOx]
  - name: NWellTieTGO
    op: intersection
    mode: lazy
    layers: [NWellTie, ThickGateOx]
  - name: NWellTieTGOAna
    op: not_inside
    mode: lazy
    layers: [NWellTieTGO, DigiBnd]
  - name: NWellTieTGODig
    op: inside
    mode: lazy
    layers: [NWellTieTGO, DigiBnd]
  # NW.d: external N+Activ - the N+ outside every well, which a shape crossing the well
  # edge has at a distance of nothing.
  - name: NActExt
    op: difference
    mode: lazy
    layers: [NActFull, NWell]
  - name: NActExtNoTGO
    op: difference
    mode: lazy
    layers: [NActExt, ThickGateOx]
  - name: NActExtTGO
    op: intersection
    mode: lazy
    layers: [NActExt, ThickGateOx]
  - name: NActExtTGOAna
    op: not_inside
    mode: lazy
    layers: [NActExtTGO, DigiBnd]
  - name: NActExtTGODig
    op: inside
    mode: lazy
    layers: [NActExtTGO, DigiBnd]
  - name: ActivInNWell
    op: intersection
    mode: lazy
    layers: [Activ, NWell]
  - name: pSDNoSRAM
    op: difference
    mode: lazy
    layers: [pSD, SRAM]
  - name: Gate
    op: intersection
    mode: lazy
    layers: [Activ, GatPoly]
  - name: NTapNoGate
    op: difference
    mode: lazy
    layers: [NActivInNWell, Gate]
  - name: PTapNoGate
    op: difference
    mode: lazy
    layers: [PsdActivInPWell, Gate]
  - name: NTapNoGateOutSRAM
    op: not_overlapping
    mode: lazy
    layers: [NTapNoGate, SRAM]
  - name: PTapNoGateOutSRAM
    op: not_overlapping
    mode: lazy
    layers: [PTapNoGate, SRAM]
  # pSD.g: "when forming abutted tie" - the tap that touches a tap of the other
  # polarity; a tap on its own is Act.d's.
  - name: NTapAbutted
    op: interacting
    mode: lazy
    layers: [NTapNoGateOutSRAM, PsdActiv]
  - name: PTapAbutted
    op: interacting
    mode: lazy
    layers: [PTapNoGateOutSRAM, NActiv]
  - name: ActivNoSRAM
    op: difference
    mode: lazy
    layers: [Activ, SRAM]
  - name: ActivOutsidePsd
    op: difference
    mode: lazy
    layers: [ActivNoSRAM, pSD]
  - name: ActivStraddlePsd
    op: overlapping
    mode: lazy
    layers: [ActivNoSRAM, ActivOutsidePsd]
  - name: TieCandidate
    op: overlapping
    mode: lazy
    layers: [ActivStraddlePsd, pSD]
  - name: TieOverlap
    op: intersection
    mode: lazy
    layers: [TieCandidate, pSD]
  - name: TieOverlapOpened
    op: open
    mode: lazy
    radius: 0.149
    layers: [TieOverlap]
  - name: TieTooNarrow
    op: not_overlapping
    mode: lazy
    layers: [TieOverlap, TieOverlapOpened]
  - name: ContOnNWellTie
    op: intersection
    mode: lazy
    layers: [Cont, NActivInNWell]

  - name: PsdActiv
    op: intersection
    mode: lazy
    layers: [Activ, pSD]
  - name: NsdActivInPWell
    op: difference
    mode: lazy
    layers: [NActiv, NWell, PWell.block]
  - name: NsdActivInPWellTGO
    op: intersection
    mode: lazy
    layers: [NsdActivInPWell, ThickGateOx]
  - name: NsdActivInPWellNoTGO
    op: difference
    mode: lazy
    layers: [NsdActivInPWell, ThickGateOx]
  - name: PsdActivInPWell
    op: difference
    mode: lazy
    layers: [PsdActiv, NWell, PWell.block]
  - name: ContOnSubstrateTie
    op: intersection
    mode: lazy
    layers: [Cont, PsdActivInPWell]
  # NW.f: the substrate tie of section 4.2, P+Activ inside PWell, and PWell is what is
  # neither NWell nor PWell:block - a P+Activ under a block is no tie.
  - name: SubstrateTie
    op: difference
    mode: lazy
    layers: [PsdActiv, NWellOrPWellBlk]
  - name: SubstrateTieTGO
    op: intersection
    mode: lazy
    layers: [SubstrateTie, ThickGateOx]
  - name: SubstrateTieNoTGO
    op: difference
    mode: lazy
    layers: [SubstrateTie, ThickGateOx]
  - name: SubstrateTieTGOAna
    op: not_inside
    mode: lazy
    layers: [SubstrateTieTGO, DigiBnd]
  - name: SubstrateTieTGODig
    op: inside
    mode: lazy
    layers: [SubstrateTieTGO, DigiBnd]
  - name: PsdActivInPWellTGO
    op: intersection
    mode: lazy
    layers: [PsdActivInPWell, ThickGateOx]
  - name: PsdActivInPWellNoTGO
    op: difference
    mode: lazy
    layers: [PsdActivInPWell, ThickGateOx]

  - name: NActivX1
    op: intersection
    mode: lazy
    layers: [NActiv, NWellOrPWellBlk]
  - name: PsdActivX1
    op: intersection
    mode: lazy
    layers: [PsdActiv, NWellOrPWellBlk]
  - name: PsdActivX1Touch
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.0
    layers: [PsdActivX1]
  - name: AbuttedNTap
    op: overlapping
    mode: lazy
    layers: [NActivX1, PsdActivX1Touch]
  - name: PsdActivX1Grown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.29
    layers: [PsdActivX1]
  - name: NTapDeep
    op: difference
    mode: lazy
    layers: [AbuttedNTap, PsdActivX1Grown]
  - name: PsdFBad
    op: not_overlapping
    mode: lazy
    layers: [AbuttedNTap, NTapDeep]
  - name: ActivTouchPsd
    op: overlapping
    mode: lazy
    layers: [Activ, pSD]
  - name: PsdC1Target
    op: difference
    mode: lazy
    layers: [ActivTouchPsd, NWell, PWell.block, EdgeSeal]

  - name: GatPolyRes
    op: union
    mode: lazy
    layers: [GatPoly, PolyRes]
  - name: SalBlockClean
    op: difference
    mode: lazy
    layers: [SalBlock, Recog.esd, nSD.block]
  - name: pSDnSD
    op: intersection
    mode: lazy
    layers: [pSD, nSD]
  - name: RhighA
    op: intersection
    mode: lazy
    layers: [GatPolyRes, pSDnSD, SalBlockClean]
  # The resistor's SalBlock, whole: a Cont is read against the block as drawn, not the
  # part of it the recognition covers.
  - name: SalBlockRhigh
    op: overlapping
    mode: lazy
    layers: [SalBlock, RhighA]
  # Rsil = RES + GatPoly (section 6.2); the EXTBlock is Rsil.e's, not the recognition's.
  - name: RsilBase
    op: intersection
    mode: lazy
    layers: [GatPolyRes, RES]
  - name: RsilAll
    op: not_overlapping
    mode: lazy
    layers: [RsilBase, SalBlock]
  - name: RsilNotNWell
    op: not_overlapping
    mode: lazy
    layers: [RsilAll, NWell]
  - name: Rsil
    op: not_overlapping
    mode: lazy
    layers: [RsilNotNWell, nBuLay]
  - name: GPRsilExtended
    op: overlapping
    mode: lazy
    layers: [GatPolyRes, Rsil]
  # Rsil.c, IHP's reading: RES outside the resistor's poly and under no Cont.  The
  # manual's "RES extension over GatPoly 0.00" - the RES stopping short of the poly's
  # long edge - wants the resistor's length direction, which no op here has (the
  # heads run out of the RES at both ends by construction).
  - name: RsilResProtrusion
    op: difference
    mode: lazy
    layers: [RES, GPRsilExtended]
  - name: RsilResProtrusionNoCont
    op: not_overlapping
    mode: lazy
    layers: [RsilResProtrusion, Cont]
  - name: Rppd0
    op: intersection
    mode: lazy
    layers: [GatPolyRes, pSD, SalBlockClean]
  - name: ActivOrNsd
    op: union
    mode: lazy
    layers: [Activ, nSD]
  - name: RppdAll
    op: not_overlapping
    mode: lazy
    layers: [Rppd0, ActivOrNsd]
  - name: GPRppdExtended
    op: overlapping
    mode: lazy
    layers: [GatPolyRes, RppdAll]
  - name: SalBlockRppd
    op: overlapping
    mode: lazy
    layers: [SalBlock, RppdAll]
  - name: RppdCont
    op: intersection
    mode: lazy
    layers: [Cont, GPRppdExtended]
  - name: SalBlockRppdGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.20
    layers: [SalBlockRppd]
  - name: RppdContTooFar
    op: not_overlapping
    mode: lazy
    layers: [RppdCont, SalBlockRppdGrown]
  - name: GPRhighExtended
    op: overlapping
    mode: lazy
    layers: [GatPolyRes, RhighA]
  - name: RhighCont
    op: intersection
    mode: lazy
    layers: [Cont, GPRhighExtended]
  - name: SalBlockRhighGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.20
    layers: [SalBlockRhigh]
  - name: RhighContTooFar
    op: not_overlapping
    mode: lazy
    layers: [RhighCont, SalBlockRhighGrown]
  - name: RhighRecogBase
    op: intersection
    mode: lazy
    layers: [EXTBlock, pSDnSD]
  - name: RhighRecog
    op: overlapping
    mode: lazy
    layers: [RhighRecogBase, GatPoly]
  - name: RhighRecogGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.0
    layers: [RhighRecog]
  # Rhi.b: the resistor's pSD and nSD shapes, whole, are identical - whatever one has
  # beyond the other, anywhere along it, is the mismatch.
  - name: RhighNsd
    op: overlapping
    mode: lazy
    layers: [nSD, RhighRecogGrown]
  - name: NsdMismatchAtRhigh
    op: difference
    mode: lazy
    layers: [RhighNsd, pSD]
  - name: RhighPsd
    op: overlapping
    mode: lazy
    layers: [pSD, RhighRecogGrown]
  - name: PsdMismatchAtRhigh
    op: difference
    mode: lazy
    layers: [RhighPsd, nSD]

  - name: PsdRingHole
    op: holes
    mode: lazy
    layers: [pSD]
  # Act.e: the empty area an Activ ring encloses - its hole less any Activ island in
  # it, which IHP's deck reads the same way (holes minus Activ).
  - name: ActivHole
    op: holes
    mode: lazy
    layers: [Activ]
  - name: ActivHoleEmpty
    op: difference
    mode: lazy
    layers: [ActivHole, Activ]
  # pSD.l: the empty area of a pSD hole, less what pSD lies in it (figure 5.10).
  - name: PsdHole
    op: holes
    mode: lazy
    layers: [pSD]
  - name: PsdHoleEmpty
    op: difference
    mode: lazy
    layers: [PsdHole, pSD]
  - name: NpnTieHole
    op: with_text
    mode: lazy
    layers: [PsdRingHole, TEXT]
    text: "npn*"
  - name: NpnTieNoTrans
    op: not_overlapping
    mode: lazy
    layers: [NpnTieHole, TRANS]
  - name: TransInTie
    op: overlapping
    mode: lazy
    layers: [TRANS, NpnTieHole]
  - name: NpnTieHoleGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.5
    layers: [NpnTieHole]
  - name: NpnTieRingActiv
    op: overlapping
    mode: lazy
    layers: [PsdActiv, NpnTieHoleGrown]
  - name: GatPolyNoSRAM
    op: difference
    mode: lazy
    layers: [GatPoly, SRAM]
  - name: TransG2
    op: with_text
    mode: lazy
    layers: [TRANS, TEXT]
    text: "npn13G2"
  - name: TransG2L
    op: with_text
    mode: lazy
    layers: [TRANS, TEXT]
    text: "npn13G2L"
  - name: TransG2V
    op: with_text
    mode: lazy
    layers: [TRANS, TEXT]
    text: "npn13G2V"
  - name: EmitG2
    op: overlapping
    mode: lazy
    layers: [EmWind, TransG2]
  - name: EmitG2L
    op: overlapping
    mode: lazy
    layers: [EmWind, TransG2L]
  - name: EmitG2V
    op: overlapping
    mode: lazy
    layers: [EmWind, TransG2V]

  - name: SchottkyBlock
    op: intersection
    mode: lazy
    layers: [SalBlock, nSD.block, PWell.block, nBuLay]
  - name: SchottkyContBar
    op: overlapping
    mode: lazy
    layers: [ContBar, SchottkyBlock]

  - name: NWellOrPWellBlk
    op: union
    mode: lazy
    layers: [NWell, PWell.block]
  - name: ActivInNBuLay
    op: intersection
    mode: lazy
    layers: [Activ, nBuLay]
  - name: IsoPWellAct
    op: difference
    mode: lazy
    layers: [ActivInNBuLay, NWellOrPWellBlk]
  - name: NWellNBuLay
    op: intersection
    mode: lazy
    layers: [NWell, nBuLay]
  - name: nSDBlockIso
    op: overlapping
    mode: lazy
    layers: [nSD.block, IsoPWellAct]
  - name: NWellRing
    op: with_holes
    mode: lazy
    layers: [NWell]
  - name: SalBlockIso
    op: overlapping
    mode: lazy
    layers: [SalBlock, IsoPWellAct]
  - name: NSDBlockIsoGrown
    op: grow
    slack: 0.005
    mode: lazy
    radius: 0.145
    layers: [nSDBlockIso]
  - name: NSDBlockUncov
    op: difference
    mode: lazy
    layers: [NSDBlockIsoGrown, SalBlockIso]
  - name: NmosiGBad
    op: intersection
    mode: lazy
    layers: [NSDBlockUncov, Activ]

  - name: ActivFillerInPWellBlock
    op: intersection
    mode: lazy
    layers: [Activ.filler, PWell.block]
  - name: nSDBlockAndSalBlock
    op: intersection
    mode: lazy
    layers: [nSD.block, SalBlock]
  # AFil.d, AFil.e, AFil.i: figure 5.6 measures the filler's distance to a well, a
  # TRANS and a PWell block edge from inside as well as from outside, so a filler
  # lying whole inside one is enclosed by the value.  A filler crossing the edge is
  # in neither reading, as IHP's deck has it.
  - name: ActivFillerInNWell
    op: inside
    mode: lazy
    layers: [Activ.filler, NWell]
  # Section 4.2: nBuLay = (((NWell >= 3.0 µm) sized by 1.0 µm/side) OR nBuLay:drawing)
  # AND NOT nBuLay:block.  The sizing is inward - the generated nBuLay lies 1.0 inside
  # the well's edge, IHP's `sized(-1.5).sized(0.5)`; grown outward, every N+Activ 0.62
  # from a wide well (NW.d) would be an NBL.e - so: shrink by 1.5 (a well under 3.0
  # vanishes), grow back by 0.5.
  - name: NWellShrunk
    op: shrink
    mode: lazy
    radius: 1.4975
    layers: [NWell]
  - name: NWellInset
    op: grow
    mode: lazy
    radius: 0.4975
    layers: [NWellShrunk]
  - name: nBuLayAll
    op: union
    mode: lazy
    layers: [NWellInset, nBuLay]
  - name: nBuLayDerived
    op: difference
    mode: lazy
    layers: [nBuLayAll, nBuLay.block]
  - name: ActivFillerInNBuLay
    op: inside
    mode: lazy
    layers: [Activ.filler, nBuLayDerived]
  - name: ActivFillerInTRANS
    op: inside
    mode: lazy
    layers: [Activ.filler, TRANS]
  - name: ActivFillerWithinPWellBlock
    op: inside
    mode: lazy
    layers: [Activ.filler, PWell.block]

  - name: GatPolyOverActiv
    op: intersection
    mode: lazy
    layers: [GatPoly, Activ]
  - name: ThickGateOxOverActiv
    op: intersection
    mode: lazy
    layers: [ThickGateOx, Activ]
  - name: ActivOutsideTGO
    op: difference
    mode: lazy
    layers: [Activ, ThickGateOx]
  - name: GatPolyOverActivOutsideTGO
    op: difference
    mode: lazy
    layers: [GatPolyOverActiv, ThickGateOx]
  - name: GatPolyOverActivTGO
    op: intersection
    mode: lazy
    layers: [GatPolyOverActiv, ThickGateOx]
  # Gat.b1: the polys of the 3.3 V transistors, whole - figure 5.8 draws b1 between the
  # ends of two such polys outside their Activs.
  - name: GatPolyHV
    op: overlapping
    mode: lazy
    layers: [GatPoly, GatPolyOverActivTGO]
  # Gat.f: no 45° or 90° angle in the gate - the gate region is a rectangle, or it is
  # the violation, as IHP's deck reads it.
  - name: GatPolyOverActivNotRect
    op: not_rectangle
    mode: lazy
    layers: [GatPolyOverActiv]
  # Gat.c, GFil.j: a poly lying whole inside the active has no end cap at all.
  - name: GatPolyInsideActiv
    op: inside
    mode: lazy
    layers: [GatPolyNoSRAM, Activ]
  - name: GatPolyFillerInsideActivFiller
    op: inside
    mode: lazy
    layers: [GatPoly.filler, Activ.filler]

  # "NWell regions separated by less than 0.62 will be merged": a close of 0.309 a side
  # bridges 0.615 and leaves 0.62, the next grid step, two regions.
  - name: NWellMerged
    op: close
    mode: lazy
    radius: 0.309
    layers: [NWell]
  - name: NWellNoSRAM
    op: difference
    mode: lazy
    layers: [NWell, SRAM]
  - name: NWellMergedNoSRAM
    op: close
    mode: lazy
    radius: 0.309
    layers: [NWellNoSRAM]
  - name: PsdActivInNWellNoTGONoSRAM
    op: not_overlapping
    mode: lazy
    layers: [PsdActivInNWellNoTGO, SRAM]
  # NBL.b: "merge if less than 1.50" - two nBuLay exactly 1.50 apart stay two (NBL.c's).
  - name: nBuLayMerged
    op: close
    mode: lazy
    radius: 0.7475
    layers: [nBuLay]
  # NBL.c/d, note 1: drawn as well as generated nBuLay regions are considered.
  - name: nBuLayRegions
    op: close
    mode: lazy
    radius: 0.7475
    layers: [nBuLayDerived]

  - name: SealActiv
    op: intersection
    mode: lazy
    layers: [Activ, EdgeSeal]
  - name: SealpSD
    op: intersection
    mode: lazy
    layers: [pSD, EdgeSeal]
