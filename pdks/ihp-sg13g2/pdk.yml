virtual_layers:
  Pad: Passiv or Passiv.sbump or Passiv.pillar or dfpad
  # Lazy: an eager virtual keeps its result's outer ring only, and a bump pad with a
  # hole is exactly what Padb.f's circle test must see.
  SBumpPad: Passiv.sbump and dfpad
  CuPillarPad: Passiv.pillar and dfpad
  SBumpPadBadShape: SBumpPad not_circle_or_octagon
  CuPillarPadBadShape: CuPillarPad not_circle
  # Padc.a: table 6.1 allows openings of 35, 40 and 45 µm - a pad is one of them, or
  # it is the violation; Padc.b: 45 µm openings keep 50, the others 40.
  CuPillarPad35Wide: CuPillarPad with_bbox_max min 35.0 max 35.005
  CuPillarPad35: CuPillarPad35Wide with_bbox_min min 35.0 max 35.005
  CuPillarPad40Wide: CuPillarPad with_bbox_max min 40.0 max 40.005
  CuPillarPad40: CuPillarPad40Wide with_bbox_min min 40.0 max 40.005
  CuPillarPad45Wide: CuPillarPad with_bbox_max min 45.0 max 45.005
  CuPillarPad45: CuPillarPad45Wide with_bbox_min min 45.0 max 45.005
  CuPillarPadNot45: CuPillarPad not_overlapping CuPillarPad45
  CuPillarPadSized: CuPillarPad35 or CuPillarPad40 or CuPillarPad45
  CuPillarPadOffSize: CuPillarPad not_overlapping CuPillarPadSized
  # MIM.d reads the vias lying on the plate, whole - a via over the plate's edge is
  # enclosed by nothing there; MIM.h a plate no via lies over.
  TopVia1OnMIM: TopVia1 overlapping MIM
  ViaOnMIMAny: TopVia1 or Vmim
  MIMNoVia: MIM not_overlapping ViaOnMIMAny
  CuPillarPadGrown: CuPillarPad within 29.995
  PadcDBad: CuPillarPadGrown and SealActiv

  ActivNoSealring: Activ not EdgeSeal
  ContNoSealring: Cont not EdgeSeal

  Via1NoSealring: Via1 not EdgeSeal
  Via2NoSealring: Via2 not EdgeSeal
  Via3NoSealring: Via3 not EdgeSeal
  Via4NoSealring: Via4 not EdgeSeal
  TopVia1NoSealring: TopVia1 not EdgeSeal
  # Section 6.10: the standard metal rules are not checked within EdgeSeal regions -
  # the metal outside the seal ring is what they read, cut at the seal's edge like the
  # vias (IHP's deck reads `Metal1.outside(EdgeSeal)` for its area and endcap rules;
  # dropping whole regions would stitch the power net of a whole die for it).
  Metal1NoSealring: Metal1 not EdgeSeal
  Metal2NoSealring: Metal2 not EdgeSeal
  Metal3NoSealring: Metal3 not EdgeSeal
  Metal4NoSealring: Metal4 not EdgeSeal
  Metal5NoSealring: Metal5 not EdgeSeal
  # MnFil.d: a filler lying whole inside a TRANS is enclosed by the value, as the
  # Activ:filler rules read their markers (figure 5.6).
  Metal1FillerInTRANS: Metal1.filler inside TRANS
  Metal2FillerInTRANS: Metal2.filler inside TRANS
  Metal3FillerInTRANS: Metal3.filler inside TRANS
  Metal4FillerInTRANS: Metal4.filler inside TRANS
  Metal5FillerInTRANS: Metal5.filler inside TRANS
  TopMetal1FillerInTRANS: TopMetal1.filler inside TRANS
  TopMetal2FillerInTRANS: TopMetal2.filler inside TRANS
  # The metal density rules read the metal as it is made: drawn, filler and mask, less
  # the slits cut into wide metal (section 7.3), as IHP's density deck has it.
  Metal1Made: Metal1 or Metal1.filler or Metal1.mask
  Metal1Density: Metal1Made not Metal1.slit
  Metal2Made: Metal2 or Metal2.filler or Metal2.mask
  Metal2Density: Metal2Made not Metal2.slit
  Metal3Made: Metal3 or Metal3.filler or Metal3.mask
  Metal3Density: Metal3Made not Metal3.slit
  Metal4Made: Metal4 or Metal4.filler or Metal4.mask
  Metal4Density: Metal4Made not Metal4.slit
  Metal5Made: Metal5 or Metal5.filler or Metal5.mask
  Metal5Density: Metal5Made not Metal5.slit
  TopMetal1Made: TopMetal1 or TopMetal1.filler or TopMetal1.mask
  TopMetal1Density: TopMetal1Made not TopMetal1.slit
  TopMetal2Made: TopMetal2 or TopMetal2.filler or TopMetal2.mask
  TopMetal2Density: TopMetal2Made not TopMetal2.slit
  TopVia2NoSealring: TopVia2 not EdgeSeal

  PassivInSeal: Passiv inside_ring EdgeSeal

  TopMetal2NotIND: TopMetal2 not IND

  ActivOrGatPoly: Activ or GatPoly

  ContSquare: ContNoSealring square
  ContBar: ContNoSealring not_square

  ContOnGatPoly: ContSquare and GatPoly
  ContOnActiv: ContSquare and Activ
  ContOnActivNoSRAM: ContOnActiv not_overlapping SRAM
  # Cnt.c: 0.07 in the analog flow, 0.05 inside DigiBnd (section 8.1.2).
  ContOnActivAna: ContOnActivNoSRAM not_inside DigiBnd
  ContOnActivDig: ContOnActivNoSRAM inside DigiBnd
  # Cnt.g1: the Cont on N+Activ, N+ by drawn nSD or by default (section 4.2).
  ContOnNsdActiv: ContSquare and NActFull
  ContOnPsdActiv: ContSquare and Activ and pSD

  ContBarOnGatPoly: ContBar and GatPoly
  ContBarOnActiv: ContBar and Activ
  ContBarOnNsdActiv: ContBar and NActiv
  ContBarOnPsdActiv: ContBar and Activ and pSD

  PsdActivInNWell: Activ and pSD and NWell
  PsdActivInNWellTGO: PsdActivInNWell and ThickGateOx
  PsdActivInNWellNoTGO: PsdActivInNWell not ThickGateOx
  NsdActiv: Activ and nSD
  NsdActivTGO: NsdActiv and ThickGateOx
  NsdActivNoTGO: NsdActiv not ThickGateOx
  ActivDefaultN: Activ not nSD.block not pSD
  NActFull: NsdActiv or ActivDefaultN
  NActFullNoTGO: NActFull not ThickGateOx
  NActFullTGO: NActFull and ThickGateOx
  # Section 4.2: N+Activ = Activ AND nSD, nSD = NOT (pSD OR nSD:block) OR nSD:drawing -
  # an Activ under nSD:block with no nSD drawn is no N+.
  NActiv: NsdActiv or ActivDefaultN
  NActivInNWell: NActiv and NWell
  NActivInNWellNoTGO: NActivInNWell not ThickGateOx
  NActivInNWellTGO: NActivInNWell and ThickGateOx
  # Section 4.2: PWell = NOT (NWell OR PWell:block) OR PWell:drawing - under a
  # PWell:block an Activ is in no well at all.
  NActivInPWell: NActiv not NWell not PWell.block
  PsdActivInNWellTGOAna: PsdActivInNWellTGO not_inside DigiBnd
  PsdActivInNWellTGODig: PsdActivInNWellTGO inside DigiBnd
  NActFullTGOAna: NActFullTGO not_inside DigiBnd
  NActFullTGODig: NActFullTGO inside DigiBnd
  NActivInNWellTGOAna: NActivInNWellTGO not_inside DigiBnd
  NActivInNWellTGODig: NActivInNWellTGO inside DigiBnd
  # NW.e: the NWell tie of section 4.2, (Activ AND nSD) inside NWell - N+ by drawn nSD
  # or by default, and only a shape lying whole in the well, edge on the well's edge
  # included.  One crossing the well edge is no tie "surrounded entirely by NWell";
  # its outside part is external N+Activ (NW.d).
  NWellTie: NActFull inside NWell
  NWellTieNoTGO: NWellTie not ThickGateOx
  NWellTieTGO: NWellTie and ThickGateOx
  NWellTieTGOAna: NWellTieTGO not_inside DigiBnd
  NWellTieTGODig: NWellTieTGO inside DigiBnd
  # NW.d: external N+Activ - the N+ outside every well, which a shape crossing the well
  # edge has at a distance of nothing.
  NActExt: NActFull not NWell
  NActExtNoTGO: NActExt not ThickGateOx
  NActExtTGO: NActExt and ThickGateOx
  NActExtTGOAna: NActExtTGO not_inside DigiBnd
  NActExtTGODig: NActExtTGO inside DigiBnd
  ActivInNWell: Activ and NWell
  pSDNoSRAM: pSD not SRAM
  Gate: Activ and GatPoly
  NTapNoGate: NActivInNWell not Gate
  PTapNoGate: PsdActivInPWell not Gate
  NTapNoGateOutSRAM: NTapNoGate not_overlapping SRAM
  PTapNoGateOutSRAM: PTapNoGate not_overlapping SRAM
  # pSD.g: "when forming abutted tie" - the tap that touches a tap of the other
  # polarity; a tap on its own is Act.d's.
  NTapAbutted: NTapNoGateOutSRAM interacting PsdActiv
  PTapAbutted: PTapNoGateOutSRAM interacting NActiv
  ActivNoSRAM: Activ not SRAM
  ActivOutsidePsd: ActivNoSRAM not pSD
  ActivStraddlePsd: ActivNoSRAM overlapping ActivOutsidePsd
  TieCandidate: ActivStraddlePsd overlapping pSD
  TieOverlap: TieCandidate and pSD
  TieOverlapOpened: TieOverlap open 0.149
  TieTooNarrow: TieOverlap not_overlapping TieOverlapOpened
  ContOnNWellTie: Cont and NActivInNWell

  PsdActiv: Activ and pSD
  NsdActivInPWell: NActiv not NWell not PWell.block
  NsdActivInPWellTGO: NsdActivInPWell and ThickGateOx
  NsdActivInPWellNoTGO: NsdActivInPWell not ThickGateOx
  PsdActivInPWell: PsdActiv not NWell not PWell.block
  ContOnSubstrateTie: Cont and PsdActivInPWell
  # LU.c/LU.d (figure 7.4): an abutted tie is contacted through the tap of the other
  # polarity it shares an edge with and is read from that tap's Conts; a tie standing
  # alone - on an Activ no gate touches - is read from its own.
  ActivAtGate: Activ interacting GatPoly
  ContOnPsdActivInNWell: Cont and PsdActivInNWell
  ContOnNsdActivInPWell: Cont and NsdActivInPWell
  NWellTieAbuttedNoCont: NTapAbutted not_overlapping Cont
  NWellTieStandalone: NActivInNWell not_interacting ActivAtGate
  SubstrateTieAbuttedNoCont: PTapAbutted not_overlapping Cont
  SubstrateTieStandalone: PsdActivInPWell not_interacting ActivAtGate
  # NW.f: the substrate tie of section 4.2, P+Activ inside PWell, and PWell is what is
  # neither NWell nor PWell:block - a P+Activ under a block is no tie.
  SubstrateTie: PsdActiv not NWellOrPWellBlk
  SubstrateTieTGO: SubstrateTie and ThickGateOx
  SubstrateTieNoTGO: SubstrateTie not ThickGateOx
  SubstrateTieTGOAna: SubstrateTieTGO not_inside DigiBnd
  SubstrateTieTGODig: SubstrateTieTGO inside DigiBnd
  PsdActivInPWellTGO: PsdActivInPWell and ThickGateOx
  PsdActivInPWellNoTGO: PsdActivInPWell not ThickGateOx

  NActivX1: NActiv and NWellOrPWellBlk
  PsdActivX1: PsdActiv and NWellOrPWellBlk
  PsdActivX1Touch: PsdActivX1 within 0.0
  AbuttedNTap: NActivX1 overlapping PsdActivX1Touch
  PsdActivX1Grown: PsdActivX1 within 0.29
  NTapDeep: AbuttedNTap not PsdActivX1Grown
  PsdFBad: AbuttedNTap not_overlapping NTapDeep
  ActivTouchPsd: Activ overlapping pSD
  PsdC1Target: ActivTouchPsd not NWell not PWell.block not EdgeSeal

  GatPolyRes: GatPoly or PolyRes
  SalBlockClean: SalBlock not Recog.esd not nSD.block
  pSDnSD: pSD and nSD
  RhighA: GatPolyRes and pSDnSD and SalBlockClean
  # The resistor's SalBlock, whole: a Cont is read against the block as drawn, not the
  # part of it the recognition covers.
  SalBlockRhigh: SalBlock overlapping RhighA
  # Rsil = RES + GatPoly (section 6.2); the EXTBlock is Rsil.e's, not the recognition's.
  RsilBase: GatPolyRes and RES
  RsilAll: RsilBase not_overlapping SalBlock
  RsilNotNWell: RsilAll not_overlapping NWell
  Rsil: RsilNotNWell not_overlapping nBuLay
  GPRsilExtended: GatPolyRes overlapping Rsil
  # Rsil.c, "RES extension over GatPoly 0.00": the RES reaches the poly's long edges.
  # The poly outside the RES is the two heads and, where the RES stops short of a long
  # edge, a strip along it: the heads are the poly's full width (Rsil.a's 0.50 and up),
  # the strip is thin, and an opening by just under a quarter micron keeps the one and
  # not the other.
  RsilPolyOutsideRes: GPRsilExtended not RES
  RsilPolyHeads: RsilPolyOutsideRes open 0.245
  RsilPolyStrips: RsilPolyOutsideRes not RsilPolyHeads
  RsilResInset: RsilPolyStrips interacting RES
  Rppd0: GatPolyRes and pSD and SalBlockClean
  ActivOrNsd: Activ or nSD
  RppdAll: Rppd0 not_overlapping ActivOrNsd
  GPRppdExtended: GatPolyRes overlapping RppdAll
  SalBlockRppd: SalBlock overlapping RppdAll
  RppdCont: Cont and GPRppdExtended
  SalBlockRppdGrown: SalBlockRppd within 0.20
  RppdContTooFar: RppdCont not_overlapping SalBlockRppdGrown
  GPRhighExtended: GatPolyRes overlapping RhighA
  RhighCont: Cont and GPRhighExtended
  SalBlockRhighGrown: SalBlockRhigh within 0.20
  RhighContTooFar: RhighCont not_overlapping SalBlockRhighGrown
  RhighRecogBase: EXTBlock and pSDnSD
  RhighRecog: RhighRecogBase overlapping GatPoly
  RhighRecogGrown: RhighRecog within 0.0
  # Rhi.b: the resistor's pSD and nSD shapes, whole, are identical - whatever one has
  # beyond the other, anywhere along it, is the mismatch.
  RhighNsd: nSD overlapping RhighRecogGrown
  NsdMismatchAtRhigh: RhighNsd not pSD
  RhighPsd: pSD overlapping RhighRecogGrown
  PsdMismatchAtRhigh: RhighPsd not nSD

  PsdRingHole: pSD holes
  # Act.e: the empty area an Activ ring encloses - its hole less any Activ island in
  # it, which IHP's deck reads the same way (holes minus Activ).
  ActivHole: Activ holes
  ActivHoleEmpty: ActivHole not Activ
  # pSD.l: the empty area of a pSD hole, less what pSD lies in it (figure 5.10).
  PsdHole: pSD holes
  PsdHoleEmpty: PsdHole not pSD
  NpnTieHole: PsdRingHole with_text "npn*" TEXT
  NpnTieNoTrans: NpnTieHole not_overlapping TRANS
  # npnG2.b the other way round: the labelled TRANS must lie whole in a tie's hole -
  # the tie being the P+Activ ring, so a pSD-only ring holds nothing.
  NpnTrans: TRANS with_text "npn*" TEXT
  NpnTransOutsideTie: NpnTrans not_inside NpnTieHole
  TransInTie: TRANS overlapping NpnTieHole
  NpnTieHoleGrown: NpnTieHole within 0.5
  # npnG2.c: the tie's Activ is the ring round the hole - a P+Activ with a hole - not
  # any P+Activ near it.
  PsdActivRings: PsdActiv with_holes
  NpnTieRingActiv: PsdActivRings overlapping NpnTieHoleGrown
  GatPolyNoSRAM: GatPoly not SRAM
  TransG2: TRANS with_text "npn13G2" TEXT
  TransG2L: TRANS with_text "npn13G2L" TEXT
  TransG2V: TRANS with_text "npn13G2V" TEXT
  EmitG2: EmWind overlapping TransG2
  EmitG2L: EmWind overlapping TransG2L
  EmitG2V: EmWind overlapping TransG2V

  # Section 6.7: the diode is a ContBar *enclosed by* the stack - whole inside it - and
  # the nBuLay is section 4.2's, drawn or generated.
  SchottkyBlock: SalBlock and nSD.block and PWell.block and nBuLayDerived
  SchottkyContBar: ContBar inside SchottkyBlock
  # Section 6.7: NW.c1, NW.e1, PWB.f1, CntB.a and LU.d do not apply on the diode - the
  # bar itself, and the device's rings out to the P+ tie (2.85 past the bar in the
  # reference cell).
  SchottkyDevice: SchottkyBlock grow 2.5
  ContBarNoSchottky: ContBar not_overlapping SchottkyBlock
  PWellBlockNoSchottky: PWell.block not_overlapping SchottkyDevice
  NWellTieTGOAnaNoSchottky: NWellTieTGOAna not_overlapping SchottkyDevice
  PsdActivInNWellTGOAnaNoSchottky: PsdActivInNWellTGOAna not_overlapping SchottkyDevice
  NWellTieStandaloneNoSchottky: NWellTieStandalone not_overlapping SchottkyDevice

  NWellOrPWellBlk: NWell or PWell.block
  ActivInNBuLay: Activ and nBuLay
  IsoPWellActAll: ActivInNBuLay not NWellOrPWellBlk
  NWellNBuLay: NWell and nBuLay
  # Section 6.5: "these rules will only be tested inside a closed ring of NWell AND
  # nBuLay" - the Iso-PWell-Activ is the one lying in such a ring's hole, and nmosi.d's
  # ring is the one whose hole holds an Iso-PWell-Activ.
  NWellNBuLayRings: NWellNBuLay with_holes
  NWellNBuLayRingHoles: NWellNBuLayRings holes
  IsoPWellAct: IsoPWellActAll inside NWellNBuLayRingHoles
  NWellNBuLayIsoHoles: NWellNBuLayRingHoles covering IsoPWellAct
  NWellNBuLayIsoRing: NWellNBuLayRings interacting NWellNBuLayIsoHoles
  nSDBlockIso: nSD.block overlapping IsoPWellAct
  NWellRing: NWell with_holes
  # nmosi.c: the ring, and an NWell island lying in a ring's hole - inside the closed
  # ring, where section 6.5's rules apply; a plain NWell with no ring is not tested.
  NWellRingHoles: NWellRing holes
  NWellInRingHole: NWell inside NWellRingHoles
  NWellNmosi: NWellRing or NWellInRingHole
  SalBlockIso: SalBlock overlapping IsoPWellAct

  ActivFillerInPWellBlock: Activ.filler and PWell.block
  nSDBlockAndSalBlock: nSD.block and SalBlock
  # AFil.d, AFil.e, AFil.i: figure 5.6 measures the filler's distance to a well, a
  # TRANS and a PWell block edge from inside as well as from outside, so a filler
  # lying whole inside one is enclosed by the value.  A filler crossing the edge is
  # in neither reading, as IHP's deck has it.
  ActivFillerInNWell: Activ.filler inside NWell
  # Section 4.2: nBuLay = (((NWell >= 3.0 µm) sized by 1.0 µm/side) OR nBuLay:drawing)
  # AND NOT nBuLay:block.  The sizing is inward - the generated nBuLay lies 1.0 inside
  # the well's edge, IHP's `sized(-1.5).sized(0.5)`; grown outward, every N+Activ 0.62
  # from a wide well (NW.d) would be an NBL.e - so: shrink by 1.5 (a well under 3.0
  # vanishes), grow back by 0.5.
  NWellShrunk: NWell shrink 1.4975
  NWellInset: NWellShrunk grow 0.4975
  nBuLayAll: NWellInset or nBuLay
  nBuLayDerived: nBuLayAll not nBuLay.block
  ActivFillerInNBuLay: Activ.filler inside nBuLayDerived
  ActivFillerInTRANS: Activ.filler inside TRANS
  ActivFillerWithinPWellBlock: Activ.filler inside PWell.block

  GatPolyOverActiv: GatPoly and Activ
  ThickGateOxOverActiv: ThickGateOx and Activ
  ActivOutsideTGO: Activ not ThickGateOx
  GatPolyOverActivOutsideTGO: GatPolyOverActiv not ThickGateOx
  GatPolyOverActivTGO: GatPolyOverActiv and ThickGateOx
  # Gat.b1: the polys of the 3.3 V transistors, whole - figure 5.8 draws b1 between the
  # ends of two such polys outside their Activs.
  GatPolyHV: GatPoly overlapping GatPolyOverActivTGO
  # Gat.f: no 45° or 90° angle in the gate - the gate region is a rectangle, or it is
  # the violation, as IHP's deck reads it.
  GatPolyOverActivNotRect: GatPolyOverActiv not_rectangle
  # Gat.c, GFil.j: a poly lying whole inside the active has no end cap at all.
  GatPolyInsideActiv: GatPolyNoSRAM inside Activ
  GatPolyFillerInsideActivFiller: GatPoly.filler inside Activ.filler

  # "NWell regions separated by less than 0.62 will be merged": a close of 0.309 a side
  # bridges 0.615 and leaves 0.62, the next grid step, two regions.
  NWellMerged: NWell close 0.309
  NWellNoSRAM: NWell not SRAM
  NWellMergedNoSRAM: NWellNoSRAM close 0.309
  PsdActivInNWellNoTGONoSRAM: PsdActivInNWellNoTGO not_overlapping SRAM
  # NBL.b: "merge if less than 1.50" - two nBuLay exactly 1.50 apart stay two (NBL.c's).
  nBuLayMerged: nBuLay close 0.7475
  # NBL.c/d, note 1: drawn as well as generated nBuLay regions are considered.
  nBuLayRegions: nBuLayDerived close 0.7475
  # NBL.c/d, figure 5.3: a PWell:block adjoining a region extends it - the PWell
  # between runs from the block's far edge.
  PWellBlockAtNBuLay: PWell.block interacting nBuLayRegions
  nBuLayRegionsExt: nBuLayRegions or PWellBlockAtNBuLay
  PWellBlockAtNWell: PWell.block interacting NWell
  NWellExt: NWell or PWellBlockAtNWell

  SealActiv: Activ and EdgeSeal
  SealpSD: pSD and EdgeSeal
  SealMetal1: Metal1 and EdgeSeal
  SealMetal2: Metal2 and EdgeSeal
  SealMetal3: Metal3 and EdgeSeal
  SealMetal4: Metal4 and EdgeSeal
  SealMetal5: Metal5 and EdgeSeal
  SealTopMetal1: TopMetal1 and EdgeSeal
  SealTopMetal2: TopMetal2 and EdgeSeal
  SealCont: Cont and EdgeSeal
  SealVia1: Via1 and EdgeSeal
  SealVia2: Via2 and EdgeSeal
  SealVia3: Via3 and EdgeSeal
  SealVia4: Via4 and EdgeSeal
  SealTopVia1: TopVia1 and EdgeSeal
  SealTopVia2: TopVia2 and EdgeSeal

  # Seal.e/f: the Passiv ring outside the seal ring - a Passiv shape with a hole, the
  # seal in it - not every pad opening on the die.
  PassivRings: Passiv with_holes
  RingPassiv: PassivRings not_overlapping EdgeSeal

  PassivDfpad: Passiv and dfpad
  DfpadNoTopMetal2: dfpad not TopMetal2

  # The NFET gate of section 4.2: GatPoly over N+Activ, N+ by drawn nSD or by default
  # (Activ under neither pSD nor nSD:block), as IHP's deck reads it.
  GatPolyOverNsdActiv: GatPoly and NActFull
  GatPolyOverNsdActivTGO: GatPolyOverNsdActiv and ThickGateOx
  GatPolyOverNsdActivNoTGO: GatPolyOverNsdActiv not ThickGateOx
  GatPolyOverPsdActiv: GatPoly and Activ and pSD
  GatPolyOverPsdActivTGO: GatPolyOverPsdActiv and ThickGateOx
  GatPolyOverPsdActivNoTGO: GatPolyOverPsdActiv not ThickGateOx

  Metal1NoExempt: Metal1 not Passiv not MIM not IND
  Metal2NoExempt: Metal2 not Passiv not MIM not IND
  Metal3NoExempt: Metal3 not Passiv not MIM not IND
  Metal4NoExempt: Metal4 not Passiv not MIM not IND
  Metal5NoExempt: Metal5 not Passiv not MIM not IND
  TopMetal1NoExempt: TopMetal1 not Passiv not MIM not IND
  TopMetal2NoExempt: TopMetal2 not Passiv not MIM not IND
  PadDfpad: dfpad overlapping Passiv
  Metal1SlitOnPad: Metal1.slit and PadDfpad
  Metal2SlitOnPad: Metal2.slit and PadDfpad
  Metal3SlitOnPad: Metal3.slit and PadDfpad
  Metal4SlitOnPad: Metal4.slit and PadDfpad
  Metal5SlitOnPad: Metal5.slit and PadDfpad
  TopMetal1SlitOnPad: TopMetal1.slit and PadDfpad
  TopMetal2SlitOnPad: TopMetal2.slit and PadDfpad

  ActivNotGat: Activ not GatPoly
  PActivCon: ActivNotGat and pSD
  AntDpDiode: PActivCon and Recog.diode
  AntIError: AntDpDiode not Recog.esd not NWell not PWell.block
  # Section 4.2: PWell is also PWell:drawing, wherever it is drawn - in an NWell too.
  AntIErrorDrawn: AntDpDiode and PWell

  NActivCon: Activ not GatPoly not pSD not nSD.block
  AntDiode: NActivCon or PActivCon
  AntPolyField: GatPoly not Activ

  AntDnDiode: NActivCon and Recog.diode
  AntDantenna: AntDnDiode not NWell
  AntDpantenna: PActivCon and Recog.diode and NWell

