virtual_layers:
  Pad: Passiv or Passiv.sbump or Passiv.pillar or dfpad
  SBumpPad: Passiv.sbump and dfpad
  CuPillarPad: Passiv.pillar and dfpad
  SBumpPadBadShape: SBumpPad not_circle_or_octagon
  CuPillarPadBadShape: CuPillarPad not_circle
  CuPillarPadGrown: CuPillarPad within 29.995
  PadcDBad: CuPillarPadGrown and SealActiv

  ContNoSealring: Cont not EdgeSeal

  Via1NoSealring: Via1 not EdgeSeal
  Via2NoSealring: Via2 not EdgeSeal
  Via3NoSealring: Via3 not EdgeSeal
  Via4NoSealring: Via4 not EdgeSeal
  TopVia1NoSealring: TopVia1 not EdgeSeal
  TopVia2NoSealring: TopVia2 not EdgeSeal

  PassivInSeal: Passiv inside_ring EdgeSeal

  TopMetal2NotIND: TopMetal2 not IND

  ActivOrGatPoly: Activ or GatPoly

  ContSquare: ContNoSealring square
  ContBar: ContNoSealring not_square

  ContOnGatPoly: ContSquare and GatPoly
  ContOnActiv: ContSquare and Activ
  ContOnActivNoSRAM: ContOnActiv not_overlapping SRAM
  ContOnNsdActiv: ContSquare and Activ and nSD
  ContOnPsdActiv: ContSquare and Activ and pSD

  ContBarOnGatPoly: ContBar and GatPoly
  ContBarOnActiv: ContBar and Activ
  ContBarOnNsdActiv: ContBar and Activ and nSD
  ContBarOnPsdActiv: ContBar and Activ and pSD

  PsdActivInNWell: Activ and pSD and NWell
  PsdActivInNWellTGO: PsdActivInNWell and ThickGateOx
  PsdActivInNWellNoTGO: PsdActivInNWell not ThickGateOx
  NsdActiv: Activ and nSD
  NsdActivTGO: NsdActiv and ThickGateOx
  NsdActivNoTGO: NsdActiv not ThickGateOx
  ActivDefaultN: Activ not nSD.block not pSD
  NActFull: NsdActiv or ActivDefaultN
  NActFullNoTGO: NActFull not ThickGateOx
  NActFullTGO: NActFull and ThickGateOx
  NActiv: Activ not pSD
  NActivInNWell: NActiv and NWell
  NActivInNWellNoTGO: NActivInNWell not ThickGateOx
  NActivInNWellTGO: NActivInNWell and ThickGateOx
  NActivInPWell: NActiv not NWell
  PsdActivInNWellTGOAna: PsdActivInNWellTGO not_overlapping DigiBnd
  PsdActivInNWellTGODig: PsdActivInNWellTGO overlapping DigiBnd
  NActFullTGOAna: NActFullTGO not_overlapping DigiBnd
  NActFullTGODig: NActFullTGO overlapping DigiBnd
  NActivInNWellTGOAna: NActivInNWellTGO not_overlapping DigiBnd
  NActivInNWellTGODig: NActivInNWellTGO overlapping DigiBnd
  ActivInNWell: Activ and NWell
  pSDNoSRAM: pSD not SRAM
  Gate: Activ and GatPoly
  NTapNoGate: NActivInNWell not Gate
  PTapNoGate: PsdActivInPWell not Gate
  NTapNoGateOutSRAM: NTapNoGate not_overlapping SRAM
  PTapNoGateOutSRAM: PTapNoGate not_overlapping SRAM
  ActivNoSRAM: Activ not SRAM
  ActivOutsidePsd: ActivNoSRAM not pSD
  ActivStraddlePsd: ActivNoSRAM overlapping ActivOutsidePsd
  TieCandidate: ActivStraddlePsd overlapping pSD
  TieOverlap: TieCandidate and pSD
  TieOverlapOpened: TieOverlap open 0.149
  TieTooNarrow: TieOverlap not_overlapping TieOverlapOpened
  ContOnNWellTie: Cont and NActivInNWell

  PsdActiv: Activ and pSD
  NsdActivInPWell: NsdActiv not NWell
  NsdActivInPWellTGO: NsdActivInPWell and ThickGateOx
  NsdActivInPWellNoTGO: NsdActivInPWell not ThickGateOx
  PsdActivInPWell: PsdActiv not NWell
  ContOnSubstrateTie: Cont and PsdActivInPWell
  PsdActivInPWellTGO: PsdActivInPWell and ThickGateOx
  PsdActivInPWellNoTGO: PsdActivInPWell not ThickGateOx

  NActivX1: NActiv and NWellOrPWellBlk
  PsdActivX1: PsdActiv and NWellOrPWellBlk
  PsdActivX1Touch: PsdActivX1 within 0
  AbuttedNTap: NActivX1 overlapping PsdActivX1Touch
  PsdActivX1Grown: PsdActivX1 within 0.29
  NTapDeep: AbuttedNTap not PsdActivX1Grown
  PsdFBad: AbuttedNTap not_overlapping NTapDeep
  ActivTouchPsd: Activ overlapping pSD
  PsdC1Target: ActivTouchPsd not NWell not PWell.block not EdgeSeal

  GatPolyRes: GatPoly or PolyRes
  SalBlockClean: SalBlock not Recog.esd not nSD.block
  pSDnSD: pSD and nSD
  RhighA: GatPolyRes and pSDnSD and SalBlockClean
  SalBlockRhigh: SalBlock and RhighA
  RsilBase: GatPolyRes and RES and EXTBlock
  RsilAll: RsilBase not_overlapping SalBlock
  RsilNotNWell: RsilAll not_overlapping NWell
  Rsil: RsilNotNWell not_overlapping nBuLay
  GPRsilExtended: GatPolyRes overlapping Rsil
  RsilResProtrusion: RES not GPRsilExtended
  RsilResProtrusionNoCont: RsilResProtrusion not_overlapping Cont
  Rppd0: GatPolyRes and pSD and SalBlockClean
  ActivOrNsd: Activ or nSD
  RppdAll: Rppd0 not_overlapping ActivOrNsd
  GPRppdExtended: GatPolyRes overlapping RppdAll
  SalBlockRppd: SalBlock and RppdAll
  RppdCont: Cont and GPRppdExtended
  SalBlockRppdGrown: SalBlockRppd within 0.2
  RppdContTooFar: RppdCont not_overlapping SalBlockRppdGrown
  GPRhighExtended: GatPolyRes overlapping RhighA
  RhighCont: Cont and GPRhighExtended
  SalBlockRhighGrown: SalBlockRhigh within 0.2
  RhighContTooFar: RhighCont not_overlapping SalBlockRhighGrown
  NsdMismatch: nSD not pSD
  RhighRecogBase: EXTBlock and pSDnSD
  RhighRecog: RhighRecogBase overlapping GatPoly
  RhighRecogGrown: RhighRecog within 0
  NsdMismatchAtRhigh: NsdMismatch overlapping RhighRecogGrown

  PsdRingHole: pSD holes
  NpnTieHole: PsdRingHole with_text "npn*" TEXT
  NpnTieNoTrans: NpnTieHole not_overlapping TRANS
  TransInTie: TRANS overlapping NpnTieHole
  NpnTieHoleGrown: NpnTieHole within 0.5
  NpnTieRingActiv: PsdActiv overlapping NpnTieHoleGrown
  GatPolyNoSRAM: GatPoly not SRAM
  TransG2: TRANS with_text "npn13G2" TEXT
  TransG2L: TRANS with_text "npn13G2L" TEXT
  TransG2V: TRANS with_text "npn13G2V" TEXT
  EmitG2: EmWind overlapping TransG2
  EmitG2L: EmWind overlapping TransG2L
  EmitG2V: EmWind overlapping TransG2V

  SchottkyBlock: SalBlock and nSD.block and PWell.block and nBuLay
  SchottkyContBar: ContBar overlapping SchottkyBlock

  NWellOrPWellBlk: NWell or PWell.block
  ActivInNBuLay: Activ and nBuLay
  IsoPWellAct: ActivInNBuLay not NWellOrPWellBlk
  NWellNBuLay: NWell and nBuLay
  nSDBlockIso: nSD.block overlapping IsoPWellAct
  NWellRing: NWell with_holes
  SalBlockIso: SalBlock overlapping IsoPWellAct
  NSDBlockIsoGrown: nSDBlockIso within 0.145
  NSDBlockUncov: NSDBlockIsoGrown not SalBlockIso
  NmosiGBad: NSDBlockUncov and Activ

  ActivFillerInPWellBlock: Activ.filler and PWell.block
  nSDBlockAndSalBlock: nSD.block and SalBlock

  GatPolyOverActiv: GatPoly and Activ
  ThickGateOxOverActiv: ThickGateOx and Activ
  ActivOutsideTGO: Activ not ThickGateOx
  GatPolyOverActivOutsideTGO: GatPolyOverActiv not ThickGateOx
  GatPolyOverActivTGO: GatPolyOverActiv and ThickGateOx

  NWellMerged: NWell close 0.31
  NWellNoSRAM: NWell not SRAM
  NWellMergedNoSRAM: NWellNoSRAM close 0.31
  PsdActivInNWellNoTGONoSRAM: PsdActivInNWellNoTGO not_overlapping SRAM
  nBuLayMerged: nBuLay close 0.75

  SealActiv: Activ and EdgeSeal
  SealpSD: pSD and EdgeSeal
  SealMetal1: Metal1 and EdgeSeal
  SealMetal2: Metal2 and EdgeSeal
  SealMetal3: Metal3 and EdgeSeal
  SealMetal4: Metal4 and EdgeSeal
  SealMetal5: Metal5 and EdgeSeal
  SealTopMetal1: TopMetal1 and EdgeSeal
  SealTopMetal2: TopMetal2 and EdgeSeal
  SealCont: Cont and EdgeSeal
  SealVia1: Via1 and EdgeSeal
  SealVia2: Via2 and EdgeSeal
  SealVia3: Via3 and EdgeSeal
  SealVia4: Via4 and EdgeSeal
  SealTopVia1: TopVia1 and EdgeSeal
  SealTopVia2: TopVia2 and EdgeSeal

  RingPassiv: Passiv not_overlapping EdgeSeal

  PassivDfpad: Passiv and dfpad
  DfpadNoTopMetal2: dfpad not TopMetal2

  GatPolyOverNsdActiv: GatPoly and Activ and nSD
  GatPolyOverNsdActivTGO: GatPolyOverNsdActiv and ThickGateOx
  GatPolyOverNsdActivNoTGO: GatPolyOverNsdActiv not ThickGateOx
  GatPolyOverPsdActiv: GatPoly and Activ and pSD
  GatPolyOverPsdActivTGO: GatPolyOverPsdActiv and ThickGateOx
  GatPolyOverPsdActivNoTGO: GatPolyOverPsdActiv not ThickGateOx

  Metal1NoExempt: Metal1 not Passiv not MIM not IND
  Metal2NoExempt: Metal2 not Passiv not MIM not IND
  Metal3NoExempt: Metal3 not Passiv not MIM not IND
  Metal4NoExempt: Metal4 not Passiv not MIM not IND
  Metal5NoExempt: Metal5 not Passiv not MIM not IND
  TopMetal1NoExempt: TopMetal1 not Passiv not MIM not IND
  TopMetal2NoExempt: TopMetal2 not Passiv not MIM not IND
  PadDfpad: dfpad overlapping Passiv
  Metal1SlitOnPad: Metal1.slit and PadDfpad
  Metal2SlitOnPad: Metal2.slit and PadDfpad
  Metal3SlitOnPad: Metal3.slit and PadDfpad
  Metal4SlitOnPad: Metal4.slit and PadDfpad
  Metal5SlitOnPad: Metal5.slit and PadDfpad
  TopMetal1SlitOnPad: TopMetal1.slit and PadDfpad
  TopMetal2SlitOnPad: TopMetal2.slit and PadDfpad

  ActivNotGat: Activ not GatPoly
  PActivCon: ActivNotGat and pSD
  AntDpDiode: PActivCon and Recog.diode
  AntIError: AntDpDiode not Recog.esd not NWell not PWell.block

  NActivCon: Activ not GatPoly not pSD not nSD.block
  AntDiode: NActivCon or PActivCon
  AntPolyField: GatPoly not Activ

  AntDnDiode: NActivCon and Recog.diode
  AntDantenna: AntDnDiode not NWell
  AntDpantenna: PActivCon and Recog.diode and NWell

  # Ant.h: a dantenna in an NWell, unless it belongs to an isolation structure tagged
  # `isolbox` - the chain of antenna.drc.
  AntHCand: AntDnDiode not Recog.esd
  AntHNactNwell: NActivCon and (NWell or PWell.block)
  AntHSchottky: nBuLay and Recog.diode and NWell and nSD.block
  AntHIsolbox1: (nBuLay interacting Recog.diode interacting AntHNactNwell)
    or (Recog.diode interacting nBuLay interacting AntHNactNwell)
  AntHIsolbox: AntHIsolbox1 not_interacting AntHSchottky with_text "isolbox" TEXT
  AntHError: AntHCand not_interacting AntHIsolbox and NWell

