  ACTNotInSRAMRest: ACT not SRAMALL
  ACTNotInSRAMWhole: ACTNotInSRAMPart not_interacting ACTNotInSRAMRest
  ACTNotInSRAM: ACT not ACTNotInSRAMWhole
