  PPACTnw: PPACT and NW1
  ACTNoPickup: ACT not NPPickup not PPPickup
  IOOX: DGOX or TGOX
  GATECore: GATE not DGOX not TGOX
  GATEDG: GATE and DGOX
  GATETG: GATE and TGOX
  ACTInTGOX: ACT inside TGOX
  NW1xTGOX: NW1 interacting TGOX
  NW1DNW: NW1 overlapping DNW
  NW1NoRes: NW1 not_interacting NW1res
  ACTSAB: ACT and SAB
  GATENoInd: GATE not INDALL
  NPACTButted: NPACT interacting PPACT
  PPACTButted: PPACT interacting NPACT
  ACTSD: ACT not POLY
  NW1IO: NW1 overlapping IOOX
  NW1Core: NW1 not_overlapping IOOX
  CTNoSRAM: CT not SRAMALL
  GATENat: GATEDev and PSUB
  GATENatCore: GATENat not DGOX not TGOX
  GATENatDG: GATENat and DGOX
  GATENatTG: GATENat and TGOX
  POLYNat: POLY overlapping PSUB
  NPPP: NP or PP
  RACT: ACT and ACTres
  RACTns: RACT and SAB
  RACTnsP: RACTns and PP
  RPO: POLY and POLYres
  RPOns: RPO and SAB
  NW1R: NW1 and NW1res
  # PW is the chip minus (NW1 or PSUB); near a DNW is all the DNW rules need of it.
  DNWHalo: DNW grow 1.5
  PWNearDNW: DNWHalo not NW1 not PSUB
  # TPW (PW inside DNW), clipped to the DNW: the same regions wherever DNW-En.1 holds.
  TPWell: DNW not NW1 not PSUB
  PWUnderIOOX: PWNearDNW and IOOX
  CTonPPPickup: CT interacting PPPickup
  TPWellFloating: TPWell not_interacting CTonPPPickup
  # Where NW1 and DNW overlap: a connector whose every point lies in both (report A).
  NW1onDNW: NW1 and DNW
  NSDOutNW1: NPACT not POLY not NW1
  NW1inRes: NW1 and NW1res
  NW1Cut: NW1 not NW1res
  # The runset's LVNW0 and MVNW0 or HVNW0: the wells without their resistor parts.
  NW1CoreCut: NW1Cut and NW1Core
  NW1IOCut: NW1Cut and NW1IO
  NW1NotInSRAM: NW1 not_inside SRAMALL
  NTapWithCT: NPPickup covering CT
  NW1Floating: NW1 not_interacting NTapWithCT
  # The runset's MOS: the N+ and P+ gates and the source/drain pieces touching them.
  PMOSGate: PPACT and POLY
  PPACTNoPoly: PPACT not POLY
  PMOSSD: PPACTNoPoly interacting PMOSGate
  NMOSGate: NPACT and POLY
  NPACTNoPoly: NPACT not POLY
  NMOSSD: NPACTNoPoly interacting NMOSGate
  NMOSAA: NMOSGate or NMOSSD
  MOSAA: PMOSGate or PMOSSD or NMOSGate or NMOSSD
  # The runset's AA_LDMOS.
