  # stretches, their middles, and the whole walls holding them.
  NPACTinPOLY.edges: NPACT.edges and ACTinPOLY.edges
  NPACTinPOLYmid.edges: NPACTinPOLY.edges centers 99%
  NPACTside.edges: NPACT.edges interacting_edges NPACTinPOLYmid.edges
  PPACTinPOLY.edges: PPACT.edges and ACTinPOLY.edges
  PPACTinPOLYmid.edges: PPACTinPOLY.edges centers 99%
  PPACTside.edges: PPACT.edges interacting_edges PPACTinPOLYmid.edges
  ACTside.edges: NPACTside.edges or PPACTside.edges
  ACTsideNoSRAM.edges: ACTside.edges outside_part SRAMALL
  # PO INSIDE EDGE AA: the poly walls inside the active, boundary stretches excluded.
  POLYinACTAll.edges: POLY.edges inside_part ACT
  POLYinACT.edges: POLYinACTAll.edges not ACT.edges
  GATEwall.edges: POLYinACT.edges and GATE.edges
  NVT3.edges: NVT3 edges
  PVT3.edges: PVT3 edges
  NVT1.edges: NVT1 edges
  PVT1.edges: PVT1 edges
  ULLD.edges: ULLD edges
  DGOX.edges: DGOX edges
  TGOX.edges: TGOX edges
  # NVT3-S.2: gate walls on active outside NVT3.
  ACTnoNVT3.edges: ACTnoNVT3 edges
  POLYinACTnoNVT3All.edges: POLY.edges inside_part ACTnoNVT3
  POLYinACTnoNVT3.edges: POLYinACTnoNVT3All.edges not ACTnoNVT3.edges
  GATEwallNoNVT3.edges: POLYinACTnoNVT3.edges and GATE.edges
  # NVT3-Ex.1 / PVT3-Ex.1: gate walls on N+ (P+) active inside NVT3 (PVT3).
  NPACTxNVT3.edges: NPACTxNVT3 edges
  POLYinNPACTxNVT3All.edges: POLY.edges inside_part NPACTxNVT3
  POLYinNPACTxNVT3.edges: POLYinNPACTxNVT3All.edges not NPACTxNVT3.edges
  GATEwallNVT3.edges: POLYinNPACTxNVT3.edges and GATE.edges
  PPACTxPVT3.edges: PPACTxPVT3 edges
  POLYinPPACTxPVT3All.edges: POLY.edges inside_part PPACTxPVT3
  POLYinPPACTxPVT3.edges: POLYinPPACTxPVT3All.edges not PPACTxPVT3.edges
  GATEwallPVT3.edges: POLYinPPACTxPVT3.edges and GATE.edges
  # NVT1-Ex.1 / PVT1-Ex.1: poly walls on N+ (P+) active inside NVT1 (PVT1).
  NPACTxNVT1.edges: NPACTxNVT1 edges
  POLYinNPACTxNVT1All.edges: POLY.edges inside_part NPACTxNVT1
  POLYinNPACTxNVT1.edges: POLYinNPACTxNVT1All.edges not NPACTxNVT1.edges
  PPACTxPVT1.edges: PPACTxPVT1 edges
  POLYinPPACTxPVT1All.edges: POLY.edges inside_part PPACTxPVT1
  POLYinPPACTxPVT1.edges: POLYinPPACTxPVT1All.edges not PPACTxPVT1.edges
  # NVT1-S.2 / PVT1-S.2: poly walls on N+ or P+ active outside NVT1 (PVT1).
  NPACTnoNVT1.edges: NPACTnoNVT1 edges
  POLYinNPACTnoNVT1All.edges: POLY.edges inside_part NPACTnoNVT1
  POLYinNPACTnoNVT1.edges: POLYinNPACTnoNVT1All.edges not NPACTnoNVT1.edges
  PPACTnoNVT1.edges: PPACTnoNVT1 edges
  POLYinPPACTnoNVT1All.edges: POLY.edges inside_part PPACTnoNVT1
  POLYinPPACTnoNVT1.edges: POLYinPPACTnoNVT1All.edges not PPACTnoNVT1.edges
  POLYinACTnoNVT1.edges: POLYinNPACTnoNVT1.edges or POLYinPPACTnoNVT1.edges
  NPACTnoPVT1.edges: NPACTnoPVT1 edges
  POLYinNPACTnoPVT1All.edges: POLY.edges inside_part NPACTnoPVT1
  POLYinNPACTnoPVT1.edges: POLYinNPACTnoPVT1All.edges not NPACTnoPVT1.edges
  PPACTnoPVT1.edges: PPACTnoPVT1 edges
  POLYinPPACTnoPVT1All.edges: POLY.edges inside_part PPACTnoPVT1
  POLYinPPACTnoPVT1.edges: POLYinPPACTnoPVT1All.edges not PPACTnoPVT1.edges
  POLYinACTnoPVT1.edges: POLYinNPACTnoPVT1.edges or POLYinPPACTnoPVT1.edges
  # Ex.2: the Vt-covered implanted active's walls that touch a gate.
  NPACTxNVT3onGATE.edges: NPACTxNVT3.edges and GATE.edges
  NPACTxNVT3onGATEmid.edges: NPACTxNVT3onGATE.edges centers 99%
  NPACTxNVT3side.edges: NPACTxNVT3.edges interacting_edges NPACTxNVT3onGATEmid.edges
  NPACTxNVT3sideNoSRAM.edges: NPACTxNVT3side.edges outside_part SRAMALL
  PPACTxPVT3onGATE.edges: PPACTxPVT3.edges and GATE.edges
  PPACTxPVT3onGATEmid.edges: PPACTxPVT3onGATE.edges centers 99%
  PPACTxPVT3side.edges: PPACTxPVT3.edges interacting_edges PPACTxPVT3onGATEmid.edges
  PPACTxPVT3sideNoSRAM.edges: PPACTxPVT3side.edges outside_part SRAMALL
  NPACTxNVT1onGATE.edges: NPACTxNVT1.edges and GATE.edges
  NPACTxNVT1onGATEmid.edges: NPACTxNVT1onGATE.edges centers 99%
  NPACTxNVT1side.edges: NPACTxNVT1.edges interacting_edges NPACTxNVT1onGATEmid.edges
  PPACTxPVT1onGATE.edges: PPACTxPVT1.edges and GATE.edges
  PPACTxPVT1onGATEmid.edges: PPACTxPVT1onGATE.edges centers 99%
  PPACTxPVT1side.edges: PPACTxPVT1.edges interacting_edges PPACTxPVT1onGATEmid.edges
  # S.4: non-salicided active not inside the implant.
  ACTSABoutNVT3.edges: ACTSABoutNVT3 edges
  ACTSABoutPVT3.edges: ACTSABoutPVT3 edges
  ACTSABoutNVT1.edges: ACTSABoutNVT1 edges
  # ULLD: the runset's local AA is PACT or NACT.
  NPPPACT.edges: NPPPACT edges
  POLYinNPPPACTAll.edges: POLY.edges inside_part NPPPACT
  POLYinNPPPACT.edges: POLYinNPPPACTAll.edges not NPPPACT.edges
  NPPPACTinPOLYAll.edges: NPPPACT.edges inside_part POLY
  NPPPACTinPOLY.edges: NPPPACTinPOLYAll.edges not POLY.edges
  NPPPACTinPOLYmid.edges: NPPPACTinPOLY.edges centers 99%
  NPPPACTside.edges: NPPPACT.edges interacting_edges NPPPACTinPOLYmid.edges
  NPPPACTsideX.edges: NPPPACTside.edges with_angle min 0 max 1
  NPPPACTsideY.edges: NPPPACTside.edges with_angle min 90 max 91
  NPPPACTsideNearX.edges: NPPPACTsideX.edges inside_part GATEAlongXBand
  NPPPACTsideNearY.edges: NPPPACTsideY.edges inside_part GATEAlongYBand
  NPPPACTsideNear.edges: NPPPACTsideNearX.edges or NPPPACTsideNearY.edges
  NPPPACTsideFar.edges: NPPPACTside.edges not NPPPACTsideNear.edges
  # DGOX-En.2 / TGOX-En.2: MOS walls touching a gate inside the oxide.
  MOSAA.edges: MOSAA edges
  GATEinDGOX.edges: GATEinDGOX edges
  MOSonGATEinDGOX.edges: MOSAA.edges and GATEinDGOX.edges
  MOSonGATEinDGOXmid.edges: MOSonGATEinDGOX.edges centers 99%
  MOSsideDGOX.edges: MOSAA.edges interacting_edges MOSonGATEinDGOXmid.edges
  GATEinTGOX.edges: GATEinTGOX edges
  MOSonGATEinTGOX.edges: MOSAA.edges and GATEinTGOX.edges
  MOSonGATEinTGOXmid.edges: MOSonGATEinTGOX.edges centers 99%
  MOSsideTGOX.edges: MOSAA.edges interacting_edges MOSonGATEinTGOXmid.edges

