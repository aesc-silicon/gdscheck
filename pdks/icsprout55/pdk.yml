  LDNACT: NPACT and LDMOS
  LDPACTGated: LDPACT interacting POLY
  LDNACTGated: LDNACT interacting POLY
  LDPACTBare: LDPACT not_interacting POLY
  LDNACTBare: LDNACT not_interacting POLY
