    layers: [ESDNMOS, ESDGATE]
  - name: ESDPSD
    op: difference
    mode: lazy
    layers: [ESDPMOS, ESDGATE]
  - name: ESDSAB
    op: intersection
    mode: lazy
    layers: [SAB, ESDIOE]
  - name: ESDNSDSal
    op: difference
    mode: lazy
    layers: [ESDNSD, ESDSAB]
  - name: ESDPSDSal
    op: difference
    mode: lazy
    layers: [ESDPSD, ESDSAB]
  # ESD MOS source: salicided S/D touching the gate; drain: salicided S/D the SAB
  # keeps off the gate.
  - name: ESDNS
    op: interacting
    mode: lazy
    layers: [ESDNSDSal, ESDGATE]
  - name: ESDND
    op: not_interacting
    mode: lazy
    layers: [ESDNSDSal, ESDGATE]
  - name: ESDPS
    op: interacting
    mode: lazy
    layers: [ESDPSDSal, ESDGATE]
  - name: ESDPD
    op: not_interacting
    mode: lazy
    layers: [ESDPSDSal, ESDGATE]
  - name: ESDNDrainSD
    op: interacting
    mode: lazy
    layers: [ESDNSD, ESDND]
  - name: ESDNDrain
    op: interacting
    mode: lazy
    layers: [ESDNDrainSD, ESDCT]
  - name: ESDPDrainSD
    op: interacting
    mode: lazy
    layers: [ESDPSD, ESDPD]
  - name: ESDPDrain
    op: interacting
    mode: lazy
    layers: [ESDPDrainSD, ESDCT]
  - name: ESDMOSS
    op: union
    mode: lazy
    layers: [ESDNS, ESDPS]
  - name: ESDMOSD
    op: union
    mode: lazy
    layers: [ESDND, ESDPD]
  # The drain opening: a hole of the ESD SAB with no SAB in it (HOLES INNER EMPTY).
  - name: ESDSABHoles
    op: holes
    mode: lazy
    layers: [ESDSAB]
  - name: ESDSABHole
    op: not_covering
    mode: lazy
    layers: [ESDSABHoles, ESDSAB]
  - name: ESDSABHO
    op: union
    mode: lazy
    layers: [ESDSABHole, ESDMOSD]
  - name: ESDCTS
    op: not_overlapping
    mode: lazy
    layers: [ESDCT, ESDSABHO]
  - name: ESDCTD
    op: inside
    mode: lazy
    layers: [ESDCT, ESDSABHO]
  - name: ESDGATEPOLY
    op: covering
    mode: lazy
    layers: [POLY, ESDGATE]
  - name: ESDACT
    op: covering
    mode: lazy
    layers: [ACT, ESDGATE]
  - name: ESDNGATETG
    op: intersection
    mode: lazy
    layers: [ESDGATE, ESDNACT, TGOX]
  - name: ESDNGATEHV
    op: difference
    mode: lazy
    layers: [ESDNGATETG, DGOX]
  # ESD-A.2: the innermost holes of ESD, less the ESD inside them.
  - name: ESDHoles
    op: holes
    mode: lazy
    layers: [ESD]
  - name: ESDWithHoles
    op: with_holes
    mode: lazy
    layers: [ESD]
  - name: ESDHoleInner
    op: not_covering
    mode: lazy
    layers: [ESDHoles, ESDWithHoles]
  - name: ESDHoleEmpty
    op: difference
    mode: lazy
    layers: [ESDHoleInner, ESD]
  - name: RDLonALPAD
    op: intersection
    mode: lazy
    layers: [RDL, ALPAD]
  # A well tap beside the gate it may carry: a tap spanning a channel (an n-type
  # varactor) is looked up on the diffusion, not under the poly.
  - name: NW1TapConn
    op: difference
    mode: lazy
    layers: [NPPickup, POLY]
  - name: NW1resSTI
    op: overlapping
    mode: lazy
    layers: [NW1res, NW1RSTI]

edge_layers:
  # --- review G: edge layers ---
  - name: ESDGATE.edges
    op: edges
    layers: [ESDGATE]
  - name: ESDGATEPOLY.edges
    op: edges
    layers: [ESDGATEPOLY]
  - name: ESDNGATE.edges
    op: inside_part
    layers: [ESDGATE.edges, ESDNMOS]
  - name: ESDPGATE.edges
    op: inside_part
    layers: [ESDGATE.edges, ESDPMOS]
  # ESD gate edges along the poly: the finger (channel) width.
  - name: ESDNGATEW
    op: and
    layers: [ESDNGATE.edges, ESDGATEPOLY.edges]
  - name: ESDPGATEW
    op: and
    layers: [ESDPGATE.edges, ESDGATEPOLY.edges]
  - name: ESDNGATEHV.edges
    op: edges
    layers: [ESDNGATEHV]
  - name: ESDACT.edges
    op: edges
    layers: [ESDACT]
  # 3.3V ESD NMOS gate edges along the active: the channel length.
  - name: ESDNGATEHVL
    op: and
    layers: [ESDNGATEHV.edges, ESDACT.edges]
  # --- review C: edge layers ---
  - name: ACT.edges
    op: edges
    layers: [ACT]
  - name: POLY.edges
    op: edges
    layers: [POLY]
  - name: NW1.edges
    op: edges
    layers: [NW1]
  - name: RACTns.edges
    op: edges
    layers: [RACTns]
  - name: RACTnsCut
    op: not
    layers: [RACTns.edges, ACT.edges]
  - name: RPOns.edges
    op: edges
    layers: [RPOns]
  - name: RPOnsCut
    op: not
    layers: [RPOns.edges, POLY.edges]
  - name: NWResAABody.edges
    op: edges
    layers: [NWResAABody]
  - name: NWResAABodyCut
    op: not
    layers: [NWResAABody.edges, NW1.edges]
  - name: NW1RNoSAB.edges
    op: edges
    layers: [NW1RNoSAB]
  - name: NW1RNoSABCut
    op: not
    layers: [NW1RNoSAB.edges, NW1.edges]
  - name: ACTresNoSAB.edges
    op: edges
    layers: [ACTresNoSAB]
  - name: ACTresNoSABInACT
    op: inside_part
    layers: [ACTresNoSAB.edges, ACT]
  - name: ACTresNoSABCut
    op: not
    layers: [ACTresNoSABInACT, ACT.edges]
  - name: ACTresR4X.edges
    op: edges
    layers: [CTonAAResNoSAB]
  - name: ACTresR4Shared
    op: and
    layers: [ACTresNoSABCut, ACTresR4X.edges]
  - name: ACTresR4SharedMid
    op: centers
    layers: [ACTresR4Shared]
    fraction: 0.99
  - name: ACTresR4Bad
    op: not_interacting_edges
    layers: [ACTresNoSABCut, ACTresR4SharedMid]
  - name: POLYresNoSAB.edges
    op: edges
    layers: [POLYresNoSAB]
  - name: POLYresNoSABInPOLY
    op: inside_part
    layers: [POLYresNoSAB.edges, POLY]
  - name: POLYresNoSABCut
    op: not
    layers: [POLYresNoSABInPOLY, POLY.edges]
  - name: POLYresR3X.edges
    op: edges
    layers: [CTonPOResNoSAB]
  - name: POLYresR3Shared
    op: and
    layers: [POLYresNoSABCut, POLYresR3X.edges]
  - name: POLYresR3SharedMid
    op: centers
    layers: [POLYresR3Shared]
    fraction: 0.99
  - name: POLYresR3Bad
    op: not_interacting_edges
    layers: [POLYresNoSABCut, POLYresR3SharedMid]
  - name: SAB.edges
    op: edges
    layers: [SAB]
  - name: NWR.edges
    op: edges
    layers: [NWR]
  - name: SABInNWR
    op: inside_part
    layers: [SAB.edges, NWR]
  - name: SABInNWRCut
    op: not
    layers: [SABInNWR, NWR.edges]
  - name: NWResS2X.edges
    op: edges
    layers: [CTonACTxNW1resGrow]
  - name: NWResS2Shared
    op: and
    layers: [SABInNWRCut, NWResS2X.edges]
  - name: NWResS2SharedMid
    op: centers
    layers: [NWResS2Shared]
    fraction: 0.99
  - name: NWResS2Bad
    op: not_interacting_edges
    layers: [SABInNWRCut, NWResS2SharedMid]
  - name: NW1res.edges
    op: edges
    layers: [NW1res]
  - name: NW1xACTcovNW1R.edges
    op: edges
    layers: [NW1xACTcovNW1R]
  - name: NW1resInNWS4
    op: inside_part
    layers: [NW1res.edges, NW1xACTcovNW1R]
  - name: NW1resInNWS4Cut
    op: not
    layers: [NW1resInNWS4, NW1xACTcovNW1R.edges]
  - name: NWResS4X.edges
    op: edges
    layers: [NP]
  - name: NWResS4Shared
    op: and
    layers: [NW1resInNWS4Cut, NWResS4X.edges]
  - name: NWResS4SharedMid
    op: centers
    layers: [NWResS4Shared]
    fraction: 0.99
  - name: NWResS4Bad
    op: not_interacting_edges
    layers: [NW1resInNWS4Cut, NWResS4SharedMid]
  - name: ACTxCTonNWRSTIGrow.edges
    op: edges
    layers: [ACTxCTonNWRSTIGrow]
  - name: NWRSTI.edges
    op: edges
    layers: [NWRSTI]
  - name: ACTInNWRSTI
    op: inside_part
    layers: [ACTxCTonNWRSTIGrow.edges, NWRSTI]
  - name: ACTInNWRSTICut
    op: not
    layers: [ACTInNWRSTI, NWRSTI.edges]
  - name: NWStiEn1X.edges
    op: edges
    layers: [CTonNWRSTIGrow]
  - name: NWStiEn1Shared
    op: and
    layers: [ACTInNWRSTICut, NWStiEn1X.edges]
  - name: NWStiEn1SharedMid
    op: centers
    layers: [NWStiEn1Shared]
    fraction: 0.99
  - name: NWStiEn1Bad
    op: not_interacting_edges
    layers: [ACTInNWRSTICut, NWStiEn1SharedMid]
  # --- review B: edge layers ---
  # Channel widths: the gate walls on the poly (runset GATE_*_W).
  - name: GATEDevCore.edges
    op: edges
    layers: [GATEDevCoreChk]
  - name: GATEDevCoreW
    op: and
    layers: [GATEDevCore.edges, POLY.edges]
  - name: GATEDevIO1.edges
    op: edges
    layers: [GATEDevIO1Chk]
  - name: GATEDevIO1W
    op: and
    layers: [GATEDevIO1.edges, POLY.edges]
  - name: GATEDevIO2.edges
    op: edges
    layers: [GATEDevIO2Chk]
  - name: GATEDevIO2W
    op: and
    layers: [GATEDevIO2.edges, POLY.edges]
  # NP-S.5: a PMOS gate's walls on its poly; PP-S.5: the poly walls on N+ACT.
  - name: PGATEDev.edges
    op: edges
    layers: [PGATEDevChk]
  - name: PGATEDevW
    op: and
    layers: [PGATEDev.edges, POLY.edges]
  - name: POLYinNPACT
    op: inside_part
    layers: [POLY.edges, NPACTNotInSRAM]
  - name: NP.edges
    op: edges
    layers: [NP]
  - name: PP.edges
    op: edges
    layers: [PP]
  - name: ACTonPPEdge
    op: and
    layers: [ACT.edges, PP.edges]
  - name: NPPPButt
    op: and
    layers: [NP.edges, PP.edges]
  - name: NPPPButtUnsil
    op: inside_part
    layers: [NPPPButt, SABACTPOLY]
  - name: SABonPOLY
    op: and
    layers: [SAB.edges, POLY.edges]
  - name: SABonACT
    op: and
    layers: [SAB.edges, ACT.edges]

