connectivity:
  # ORDERED as the antenna runset connects: an antenna rule reads the net partway up
  # the stack (its own step, or a level), so the steps up to RDL are its levels.
  - connector: CTConn
    layers: [POLY]
  - connector: CTConn
    layers: [ACTSD]
  - connector: CTConn
    layers: [MET1Conn]
  - connector: VIA1Conn
    layers: [MET1Conn]
  - connector: VIA1Conn
    layers: [MET2Conn]
  - connector: VIA2Conn
    layers: [MET2Conn]
  - connector: VIA2Conn
    layers: [MET3Conn]
  - connector: VIA3Conn
    layers: [MET3Conn]
  - connector: VIA3Conn
    layers: [MET4Conn]
  - connector: VIA4Conn
    layers: [MET4Conn]
  - connector: VIA4Conn
    layers: [MET5Conn]
  - connector: T4V2Conn
    layers: [MET5Conn]
  - connector: T4V2Conn
    layers: [T4M2Conn]
  - connector: RDV
    layers: [T4M2Conn]
  - connector: RDV
    layers: [RDL]
  # DRC only, after every antenna level: pads, wells, and the layers net-gated DRC
  # rules look their nets up on. A layer such a rule reads must be listed here.
  - connector: RDV
    layers: [ALPAD]
  - connector: RDLonALPAD
    layers: [RDL, ALPAD]
  - connector: NW1TapConn
    layers: [NW1, ACTSD]
  - connector: NW1
    layers: [NW1Core, NW1IO]
  - connector: NW1onDNW
    layers: [NW1, DNW]
  - connector: CTConn
    layers: [CTNoSRAM]
  - connector: VIA1Conn
    layers: [VIA1Net]
  - connector: VIA2Conn
    layers: [VIA2Net]
  - connector: VIA3Conn
    layers: [VIA3Net]
  - connector: VIA4Conn
    layers: [VIA4Net]

