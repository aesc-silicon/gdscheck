  ULLDnoPVT3: ULLD not_interacting PVT3
  # The runset's local AA of the ULLD rules: PACT or NACT.
  NPPPACT: NPACT or PPACT
  # Bands reaching 0.2 along a gate's AA-end edges (ULLD-Ex.3a): x for gates whose
  # AA-end edges run along x, y for the others; the hair takes in the edge itself.
  GATEAlongX: GATEDev grow_x 0.2
  GATEAlongXBand: GATEAlongX grow_y 0.001
  GATEAlongY: GATEDev grow_y 0.2
  GATEAlongYBand: GATEAlongY grow_x 0.001
  GATEinDGOX: GATEDev inside DGOX
  GATEinTGOX: GATEDev inside TGOX
  # Runset GATE: a poly-on-active piece whose two sides are each a contacted S/D or
  # one shared with a second gate (GATE1), or any poly on active in LDMOS (GATE2).
  ACTGated: ACT interacting GATE
  ACTGatedSD: ACTGated not POLY
  ACTSDShared: ACTGatedSD interacting 2 GATE
  CTorBar: CT or CTbar
  ACTSDContacted: ACTGatedSD interacting CTorBar
  ACTSDTerm: ACTSDShared or ACTSDContacted
  GATEDevPair: GATE interacting 2 ACTSDTerm
  GATEDevLD: GATE and LDMOS
