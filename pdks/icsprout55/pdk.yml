# Drawn (65nm) values; the fab shrinks the GDS by 0.9 at mask making.  Metal option
# 1P6M_5Ic_1T4Mc, as the tech LEF N551P6M.
name: ICsprout 55nm
version: "0.1"

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every per-layer deck
  - name: block
    path: suites/block.yml
    description: An IP block - main without the chip-edge rules

