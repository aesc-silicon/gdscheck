rules:
  - id: MET2-W.1
    check: min_width
    layers: [MET2NoSlot]
    value: 0.1
  - id: MET2-W.1
    check: max_width
    layers: [MET2NoSlot]
    value: 12
    params:
      span: narrowest
  - id: MET2-W.2
    check: min_width
    layers: [MET2NoSlot]
    value: 0.19
    params:
      angle: bent
  - id: MET2-S.1
    check: min_space
    layers: [MET2NoSlotNoSRAM]
    value: 0.1
  - id: MET2-S.1
    check: min_notch
    layers: [MET2NoSlotNoSRAM]
    value: 0.1
  - id: MET2-S.2
    check: min_space
    layers: [MET2Wide0p42, MET2All]
    value: 0.15
    params:
      length: 0.419
      pairs: any
  - id: MET2-S.3
    check: min_space
    layers: [MET2Wide1p5, MET2All]
    value: 0.5
    params:
      length: 1.499
      pairs: any
  - id: MET2-S.4
    check: min_space
    layers: [MET2NoSlot]
    value: 0.19
    params:
      angle: bent
