    params:
      op: uncovered
  - id: RV-En.2
    check: min_enclosure
    layers: [T4M2, RV]
    value: 1.5
    params:
      metric: euclidian
  - id: RV-En.3
    check: forbidden
    layers: [RV, RDL]
    value: 0.0
    params:
      op: uncovered
  - id: RV-En.4
    check: min_enclosure
    layers: [RDL, RV]
    value: 1.5
    params:
      metric: euclidian
