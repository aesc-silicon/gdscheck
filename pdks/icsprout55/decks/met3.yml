    check: forbidden
    layers: [MET3dmBad]
    value: 0.0
  - id: MET3dm-S.1
    check: min_space
    layers: [MET3dm2x2]
    value: 0.8
  - id: MET3dm-S.2
    check: min_space
    layers: [MET3dm2x2, MET3NoSlot]
