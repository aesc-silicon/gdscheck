      interacting_only: 1
      metric: euclidian
  - id: MET3dm-S.13
    check: min_space
    layers: [MET3dm, CHIPBLK]
    value: 2.5
    params:
      abutting: report
  - id: MET3dm-S.13
    check: min_enclosure
    layers: [CHIPBLK, MET3dm]
    value: 2.5
    params:
      interacting_only: 1
      metric: euclidian
