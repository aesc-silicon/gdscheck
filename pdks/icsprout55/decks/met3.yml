rules:
  - id: MET3-W.1
    check: min_width
    layers: [MET3NoSlot]
    value: 0.1
  - id: MET3-W.1
    check: max_width
    layers: [MET3NoSlot]
    value: 12
    params:
      span: narrowest
  - id: MET3-W.2
    check: min_width
    layers: [MET3NoSlot]
    value: 0.19
    params:
      angle: bent
  - id: MET3-S.1
    check: min_space
    layers: [MET3NoSlot]
    value: 0.1
  - id: MET3-S.1
    check: min_notch
    layers: [MET3NoSlot]
    value: 0.1
  - id: MET3-S.2
    check: min_space
    layers: [MET3Wide0p42, MET3All]
    value: 0.15
    params:
      length: 0.419
      pairs: any
  - id: MET3-S.3
    check: min_space
    layers: [MET3Wide1p5, MET3All]
    value: 0.5
    params:
      length: 1.499
      pairs: any
  - id: MET3-S.4
    check: min_space
    layers: [MET3NoSlot]
    value: 0.19
    params:
      angle: bent
  - id: MET3-A.1
    check: min_area
    layers: [MET3NoSlot]
    value: 0.052
    params:
      touching: separate
  - id: MET3-A.2
    check: min_area
    layers: [MET3NoSlot]
    value: 0.18
    params:
      scope: hole
