    params:
      abutting: report
  - id: MET3dm-S.3
    check: min_space
    layers: [MET3dm1x1]
    value: 0.3
  - id: MET3dm-S.4
    check: min_space
    layers: [MET3dm1x1, MET3NoSlot]
    value: 3
    params:
      abutting: report
  - id: MET3dm-S.5
    check: min_space
    layers: [MET3dmBar]
    value: 0.25
  - id: MET3dm-S.6
    check: min_space
    layers: [MET3dmBar, MET3NoSlot]
    value: 0.3
    params:
      abutting: report
  - id: MET3dm-S.7
    check: min_space
    layers: [MET3dm, MET3All]
    value: 0.6
    params:
      width: 1.499
      length: 1.499
  - id: MET3dm-S.8
    check: min_space
    layers: [MET3dm, MET3NoSlot]
    value: 0.4
    params:
      angle: bent
