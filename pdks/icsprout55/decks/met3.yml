    check: min_space
    layers: [MET3]
    value: 0.15
    params:
      width: 0.42
      length: 0.42
  - id: MET3-S.3
    check: min_space
    layers: [MET3]
    value: 0.5
    params:
      width: 1.5
      length: 1.5
