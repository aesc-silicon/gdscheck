    check: max_width
    layers: [MET3]
    value: 12
    params:
      span: narrowest
  - id: MET3-W.2
    check: min_width
    layers: [MET3]
    value: 0.19
    params:
      angle: bent
  - id: MET3-S.1
    check: min_space
    layers: [MET3NoInd]
