rules:
  - id: T2V2-W.1
    check: exact_width
    layers: [T2V2Sq]
    value: 0.2
  - id: T2V2-W.2
    check: min_width
    layers: [T2V2bar]
    value: 0.2
  - id: T2V2-W.2
    check: max_width
    layers: [T2V2bar]
    value: 0.2
    params:
      span: narrowest
  - id: T2V2-S.1
    check: min_space
    layers: [T2V2]
    value: 0.2
  - id: T2V2-En.1
    check: forbidden
    layers: [T2V2, T2M1]
    value: 0.0
    params:
      op: uncovered
  - id: T2V2-En.3
    check: forbidden
    layers: [T2V2, T2M2]
    value: 0.0
    params:
      op: uncovered
  - id: T2V2-R.3
    check: no_angle
    layers: [T2V2]
    value: 0.0
