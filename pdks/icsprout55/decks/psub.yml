rules:
  - id: PSUB-W.1
    check: min_width
    layers: [PSUB]
    value: 0.47
  - id: PSUB-W.2
    check: min_gate_length
    layers: [ACTNat, GATENat]
    value: 0.5
  - id: PSUB-W.3a
    check: min_gate_length
    layers: [POLYNat, GATENatCore]
    value: 0.2
  - id: PSUB-W.3b
    check: min_gate_length
    layers: [POLYNat, GATENatDG]
    value: 0.8
  - id: PSUB-W.3b
    check: max_gate_length
    layers: [POLYNat, GATENatDG]
    value: 20
  - id: PSUB-W.3c
    check: min_gate_length
    layers: [POLYNat, GATENatTG]
    value: 1
  - id: PSUB-S.1
    check: min_space
    layers: [PSUB]
    value: 0.47
  - id: PSUB-S.1
    check: min_notch
    layers: [PSUB]
    value: 0.47
  - id: PSUB-S.2
    check: min_space
    layers: [PSUB, NPACT]
    value: 0.36
    params:
      abutting: report
  - id: PSUB-S.3
    check: min_space
    layers: [PSUB, NW1]
    value: 1.15
  - id: PSUB-En.1
    check: min_enclosure
    layers: [PSUB, ACTNat]
    value: 0.285
    params:
      metric: euclidian
  - id: PSUB-En.1
    check: max_enclosure
    layers: [PSUB, ACTNat]
    value: 0.285
    params:
      metric: euclidian
  - id: PSUB-Ex.1
    check: min_enclosure
    layers: [POLY, ACTNatNoInd]
    value: 0.32
    params:
      metric: euclidian
      interacting_only: 1
  - id: PSUB-A.1
    check: min_area
    layers: [PSUB]
    value: 0.6
    params:
      touching: separate
  - id: PSUB-A.2
    check: min_area
    layers: [PSUB]
    value: 0.6
    params:
      scope: hole
  - id: PSUB-R.1
    check: forbidden
    layers: [PSUB, NW1]
    value: 0.0
    params:
      op: overlap
  - id: PSUB-R.1
    check: forbidden
    layers: [PSUB, DNW]
    value: 0.0
    params:
      op: overlap
  - id: PSUB-R.2
    check: forbidden
    layers: [PSUBNoInd, PP]
    value: 0.0
    params:
      op: overlap
