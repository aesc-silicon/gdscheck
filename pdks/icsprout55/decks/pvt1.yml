rules:
  - id: PVT1-W.1
    check: min_width
    layers: [PVT1]
    value: 0.18
  - id: PVT1-S.1
    check: min_space
    layers: [PVT1]
    value: 0.18
  - id: PVT1-S.1
    check: min_notch
    layers: [PVT1]
    value: 0.18
  - id: PVT1-Ex.1
    check: min_enclosure
    layers: [PVT1, GATE]
    value: 0.18
    params:
      metric: euclidian
      interacting_only: 1
    layer_params:
      over: ACT
  - id: PVT1-Ex.2
    check: min_enclosure
    layers: [PVT1, ACT]
    value: 0.15
    params:
      metric: euclidian
      interacting_only: 1
    layer_params:
      over: POLY
  - id: PVT1-A.1
    check: min_area
    layers: [PVT1]
    value: 0.18
    params:
      touching: separate
  - id: PVT1-A.2
    check: min_area
    layers: [PVT1]
    value: 0.18
    params:
      scope: hole
  - id: PVT1-R.1
    check: forbidden
    layers: [PVT1, PSUB]
    value: 0.0
    params:
      op: overlap
