rules:
  - id: T4M1-W.1
    check: min_width
    layers: [T4M1]
    value: 0.4
  - id: T4M1-W.1
    check: max_width
    layers: [T4M1NoPadInd]
    value: 20
    params:
      span: narrowest
  - id: T4M1-S.1
    check: min_space
    layers: [T4M1NoInd]
    value: 0.4
  - id: T4M1-S.1
    check: min_notch
    layers: [T4M1NoInd]
    value: 0.4
  - id: T4M1-S.2
    check: min_space
    layers: [T4M1]
    value: 0.5
    params:
      length: 1.999
  - id: T4M1-A.1
    check: min_area
    layers: [T4M1]
    value: 0.4
    params:
      touching: separate
  - id: T4M1-A.2
    check: min_area
    layers: [T4M1]
    value: 0.6
    params:
      scope: hole
  - id: T4M1dm-W.1
    check: forbidden
    layers: [T4M1dmBad]
    value: 0.0
  - id: T4M1dm-S.1
    check: min_space
    layers: [T4M1dm2x2, T4M1dm]
    value: 0.8
  - id: T4M1dm-S.2
    check: min_space
    layers: [T4M1dm2x2, T4M1]
    value: 10
    params:
      abutting: report
  - id: T4M1dm-S.3
    check: min_space
    layers: [T4M1dm1x1, T4M1dm]
    value: 0.4
  - id: T4M1dm-S.4
    check: min_space
    layers: [T4M1dm1x1, T4M1]
    value: 0.6
    params:
      abutting: report
  - id: T4M1dm-S.5
    check: min_space
    layers: [T4M1dmBar, T4M1dm]
    value: 0.4
  - id: T4M1dm-S.6
    check: min_space
    layers: [T4M1dmBar, T4M1]
    value: 0.6
    params:
      abutting: report
  - id: T4M1dm-S.7
    check: min_space
    layers: [T4M1dm, T4M1]
    value: 0.6
    params:
      width: 1.5
      length: 1.5
      abutting: report
  - id: T4M1dm-S.9
    check: min_space
    layers: [T4M1dm, FUSEALL]
    value: 3
    params:
      abutting: report
  - id: T4M1dm-S.9
    check: forbidden
    layers: [T4M1dm, FUSEALL]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.10
    check: min_space
    layers: [T4M1dm, BMIM]
    value: 2
    params:
      abutting: report
  - id: T4M1dm-S.10
    check: forbidden
    layers: [T4M1dm, BMIM]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.11
    check: min_space
    layers: [T4M1dm, LOGO]
    value: 0.1
    params:
      abutting: report
  - id: T4M1dm-S.11
    check: forbidden
    layers: [T4M1dm, LOGO]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.12
    check: min_space
    layers: [T4M1dm, INDALL]
    value: 3
    params:
      abutting: report
  - id: T4M1dm-S.12
    check: forbidden
    layers: [T4M1dm, INDALL]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.14
    check: min_space
    layers: [T4M1dm, T4M1dmb]
    value: 2
    params:
      abutting: report
  - id: T4M1dm-S.14
    check: forbidden
    layers: [T4M1dm, T4M1dmb]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.15
    check: min_space
    layers: [T4M1dm, DMYBLK]
    value: 2
    params:
      abutting: report
  - id: T4M1dm-S.15
    check: forbidden
    layers: [T4M1dm, DMYBLK]
    value: 0.0
    params:
      op: overlap
  - id: T4M1dm-S.13
    check: min_enclosure
    layers: [CHIPBLK, T4M1dm]
    value: 2.5
    params:
      interacting_only: 1
      metric: euclidian
