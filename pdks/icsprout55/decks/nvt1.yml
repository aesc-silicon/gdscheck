rules:
  - id: NVT1-W.1
    check: min_width
    layers: [NVT1]
    value: 0.18
  - id: NVT1-S.1
    check: min_space
    layers: [NVT1]
    value: 0.18
  - id: NVT1-S.1
    check: min_notch
    layers: [NVT1]
    value: 0.18
  - id: NVT1-S.4
    check: min_space
    layers: [NVT1, ACTSAB]
    value: 0.21
    params:
      abutting: report
  - id: NVT1-Ex.1
    check: min_enclosure
    layers: [NVT1, GATE]
    value: 0.18
    params:
      metric: euclidian
      interacting_only: 1
    layer_params:
      over: ACT
  - id: NVT1-Ex.2
    check: min_enclosure
    layers: [NVT1, ACT]
    value: 0.15
    params:
      metric: euclidian
      interacting_only: 1
    layer_params:
      over: POLY
  - id: NVT1-A.1
    check: min_area
    layers: [NVT1]
    value: 0.18
    params:
      touching: separate
  - id: NVT1-A.2
    check: min_area
    layers: [NVT1]
    value: 0.18
    params:
      scope: hole
  - id: NVT1-R.1
    check: forbidden
    layers: [NVT1, PSUB]
    value: 0.0
    params:
      op: overlap
  - id: NVT1-R.1
    check: forbidden
    layers: [NVT1, DGOX]
    value: 0.0
    params:
      op: overlap
  - id: NVT1-R.1
    check: forbidden
    layers: [NVT1, TGOX]
    value: 0.0
    params:
      op: overlap
  - id: NVT1-R.1
    check: forbidden
    layers: [NVT1, PPACT]
    value: 0.0
    params:
      op: overlap
