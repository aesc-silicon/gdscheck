rules:
  - id: NVT3-W.1
    check: min_width
    layers: [NVT3]
    value: 0.18
  - id: NVT3-S.1
    check: min_space
    layers: [NVT3.edges, NVT3.edges]
    value: 0.18
  - id: NVT3-S.2
    check: min_space
    layers: [GATEwallNoNVT3.edges, NVT3.edges]
    value: 0.18
  - id: NVT3-S.3
    check: min_space
    layers: [ACTsideNoSRAM.edges, NVT3.edges]
    value: 0.15
  - id: NVT3-S.4
    check: min_space
    layers: [ACTSABoutNVT3.edges, NVT3.edges]
    value: 0.21
  - id: NVT3-Ex.1
    check: min_enclosure
    layers: [NVT3.edges, GATEwallNVT3.edges]
    value: 0.18
  - id: NVT3-Ex.2
    check: min_enclosure
    layers: [NVT3.edges, NPACTxNVT3sideNoSRAM.edges]
    value: 0.15
  - id: NVT3-A.1
    check: min_area
    layers: [NVT3NotInSRAM]
    value: 0.18
    params:
      touching: separate
  - id: NVT3-A.2
    check: min_area
    layers: [NVT3]
    value: 0.18
    params:
      scope: hole
  - id: NVT3-R.1
    check: forbidden
    layers: [NVT3, PSUB]
    value: 0.0
    params:
      op: overlap
  - id: NVT3-R.1
    check: forbidden
    layers: [NVT3, PPACTnw]
    value: 0.0
    params:
      op: overlap
  - id: NVT3-R.1
    check: forbidden
    layers: [NVT3, NVT1]
    value: 0.0
    params:
      op: overlap
  - id: NVT3-R.1
    check: forbidden
    layers: [NVT3, DGOX]
    value: 0.0
    params:
      op: overlap
  - id: NVT3-R.1
    check: forbidden
    layers: [NVT3, TGOX]
    value: 0.0
    params:
      op: overlap
