rules:
  - id: T2V1-W.1
    check: exact_width
    layers: [T2V1Sq]
    value: 0.2
  - id: T2V1-W.2
    check: min_width
    layers: [T2V1bar]
    value: 0.2
  - id: T2V1-W.2
    check: max_width
    layers: [T2V1bar]
    value: 0.2
    params:
      span: narrowest
  - id: T2V1-S.1
    check: min_space
    layers: [T2V1]
    value: 0.2
  - id: T2V1-En.1
    check: forbidden
    layers: [T2V1, MET1, MET2, MET3, MET4, MET5, MET6, MET7, MET8]
    value: 0.0
    params:
      op: uncovered
  - id: T2V1-En.3
    check: forbidden
    layers: [T2V1, T2M1]
    value: 0.0
    params:
      op: uncovered
  - id: T2V1-R.3
    check: no_angle
    layers: [T2V1]
    value: 0.0
