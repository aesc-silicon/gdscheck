rules:
  - id: T4M2-W.1
    check: min_width
    layers: [T4M2NoSlot]
    value: 0.4
  - id: T4M2-W.1
    check: forbidden
    layers: [T4M2Over20Chk]
    value: 0.0
  - id: T4M2-S.1
    check: min_space
    layers: [T4M2NoSlot]
    value: 0.4
  - id: T4M2-S.1
    check: min_notch
    layers: [T4M2NoSlot]
    value: 0.4
  - id: T4M2-S.2
    check: min_space
    layers: [T4M2Wide2, T4M2All]
    value: 0.5
    params:
      length: 1.999
      pairs: any
  - id: T4M2-A.1
    check: min_area
    layers: [T4M2NoSlot]
    value: 0.4
    params:
      touching: separate
  - id: T4M2-A.2
    check: min_area
    layers: [T4M2NoSlot]
    value: 0.6
    params:
      scope: hole
  - id: T4M2dm-W.1
    check: forbidden
    layers: [T4M2dmBad]
    value: 0.0
  - id: T4M2dm-S.1
    check: min_space
    layers: [T4M2dm2x2]
    value: 0.8
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.2
    check: min_space
    layers: [T4M2dm2x2, T4M2NoSlot]
    value: 10
    params:
      abutting: report
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.3
    check: min_space
    layers: [T4M2dm1x1]
    value: 0.4
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.4
    check: min_space
    layers: [T4M2dm1x1, T4M2NoSlot]
    value: 0.6
    params:
      abutting: report
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.5
    check: min_space
    layers: [T4M2dmBar]
    value: 0.4
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.6
    check: min_space
    layers: [T4M2dmBar, T4M2NoSlot]
    value: 0.6
    params:
      abutting: report
    layer_params:
      gap_outside: INDALL
  - id: T4M2dm-S.7
    check: min_space
    layers: [T4M2dm, T4M2All]
    value: 0.6
    params:
      width: 1.499
      length: 1.499
  - id: T4M2dm-S.8
    check: min_space
    layers: [T4M2dm, T4M2NoSlot]
    value: 0.4
    params:
      angle: bent
  - id: T4M2dm-S.9
    check: min_space
    layers: [T4M2dm, FUSEALL]
    value: 3
    params:
      abutting: report
  - id: T4M2dm-S.9
    check: min_enclosure
    layers: [FUSEALL, T4M2dm]
    value: 3
    params:
      interacting_only: 1
      metric: euclidian
  - id: T4M2dm-S.10
    check: min_space
    layers: [T4M2dm, BMIM]
    value: 2
    params:
      abutting: report
  - id: T4M2dm-S.10
    check: min_enclosure
    layers: [BMIM, T4M2dm]
    value: 2
    params:
      interacting_only: 1
      metric: euclidian
  - id: T4M2dm-S.11
    check: min_space
    layers: [T4M2dm, LOGO]
    value: 0.1
    params:
      abutting: report
  - id: T4M2dm-S.11
    check: min_enclosure
    layers: [LOGO, T4M2dm]
    value: 0.1
    params:
      interacting_only: 1
      metric: euclidian
  - id: T4M2dm-S.12
    check: min_space
    layers: [T4M2dm, INDALL]
    value: 3
    params:
      abutting: report
  - id: T4M2dm-S.12
    check: min_enclosure
    layers: [INDALL, T4M2dm]
    value: 3
    params:
      interacting_only: 1
      metric: euclidian
  - id: T4M2dm-S.13
    check: min_space
    layers: [T4M2dm, CHIPBLK]
    value: 2.5
    params:
      abutting: report
  - id: T4M2dm-S.13
    check: min_enclosure
    layers: [CHIPBLK, T4M2dm]
    value: 2.5
    params:
      interacting_only: 1
      metric: euclidian
  - id: T4M2dm-S.14
    check: min_space
    layers: [T4M2dm, T4M2dmb]
    value: 2
    params:
      abutting: report
  - id: T4M2dm-S.15
    check: min_space
    layers: [T4M2dm, DMYBLK]
    value: 2
    params:
      abutting: report
