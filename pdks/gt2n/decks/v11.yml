# V11, the via from M11 to M12, from techlib/gt2_tech.lef: the runset has no rules
# above M6.  .1 and .2 are the cut of V11_0 and Via11Array, 56 x 360 nm; .5 the cut
# layer's SPACING, read every way; .7 and .8 the cut inside each metal, as an
# ENCLOSURE of 0 holds it; and each metal's enclosure along its length, Via11Array's.
rules:
  - id: V11.1.LEF
    check: min_width
    layers: [V11]
    value: 0.056
    params:
      facing: x
  - id: V11.2.LEF
    check: min_width
    layers: [V11]
    value: 0.36
    params:
      facing: y
  - id: V11.5.LEF
    check: min_space
    layers: [V11]
    value: 0.056
  - id: V11.7.LEF
    check: forbidden
    layers: [V11OutsideM11]
    value: 0.0
  - id: V11.8.LEF
    check: forbidden
    layers: [V11OutsideM12]
    value: 0.0
  - id: V11.M11.EN.LEF
    check: min_enclosure
    layers: [M11, V11]
    value: 0.012
    params:
      facing: y
      interacting_only: 1
  - id: V11.M12.EN.LEF
    check: min_enclosure
    layers: [M12, V11]
    value: 0.012
    params:
      facing: x
      interacting_only: 1
