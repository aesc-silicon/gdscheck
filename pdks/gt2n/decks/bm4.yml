# BM4, backside, routed horizontally, from techlib/gt2_tech.lef: the runset connects
# the backside and checks none of it.  The rules read as M6's do, with the LEF's
# values: .1 WIDTH, .3 SPACING, .4 the EOLKEEPOUT's forward extension, .5
# CORNERSPACING, .6 RECTONLY.  The LEF gives BM4 no MINSIZE or AREA, so there is no .2.
rules:
  - id: BM4.1.LEF
    check: min_width
    layers: [BM4]
    value: 0.36
    params:
      facing: y
  - id: BM4.3.LEF
    check: min_space
    layers: [BM4]
    value: 0.36
    params:
      facing: y
  - id: BM4.3.LEF
    check: min_notch
    layers: [BM4]
    value: 0.36
    params:
      facing: y
  - id: BM4.4.LEF
    check: min_space
    layers: [BM4]
    value: 0.45
    params:
      facing: x
  - id: BM4.4.LEF
    check: min_notch
    layers: [BM4]
    value: 0.45
    params:
      facing: x
  - id: BM4.5.LEF
    check: min_space
    layers: [BM4]
    value: 0.45
    params:
      facing: none
  - id: BM4.6.LEF
    check: forbidden
    layers: [BM4Bent]
    value: 0.0
