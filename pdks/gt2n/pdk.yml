# GT2N, the 2 nm nanosheet PDK with backside power delivery from the Georgia Institute
# of Technology (initial release).  Its IC Validator runset (icv_runset/gt2_main.drc.rs)
# is GT3's with seven values changed - a 14 nm gate on a 42 nm pitch, a 16 nm SDCON and
# VBPR, an 8 nm active - and a deck for the five threshold-voltage layers, so this PDK
# extends gt3: the decks that changed are here, the rest are GT3's files.
#
# The runset checks nothing above M6.  V6 to RDL are checked from the technology LEF
# (techlib/gt2_tech.lef) instead, their ids marked `.LEF`: M6's rules on each layer, with
# the LEF's values.
#
# The backside stack, BV0 to BRDL, joins the buried power rail from below.  The runset
# connects it and checks none of it; this PDK checks it from the LEF as well, the
# same way. Additional well and area constraints come from techlib/gt2_techfile.tf,
# with `.TF` ids. See docs/source/pdks/gt2n.rst for the source audit.
name: GT2N
version: "0.1"
extends: gt3

suites:
  - name: main
    path: suites/main.yml
    description: Every deck, front and back
  - name: feol
    path: suites/feol.yml
    description: Front end and middle of line, through V0 (a standard cell)
  - name: beol
    path: suites/beol.yml
    description: Routing stack, M1 to RDL
  - name: backside
    path: suites/backside.yml
    description: Backside stack, BV0 to BRDL (tech LEF and technology file)

