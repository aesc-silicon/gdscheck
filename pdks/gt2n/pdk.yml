virtual_layers:
  # GATE.2: a gate missing from a row.  Closing the gates along x fills every space
  # between two that face each other within 1 µm; less the gates and the 28 nm spaces
  # either side of each, what is left is a space wider than GATE.2's.  A row's ends and
  # the space between rows are never filled.
  GateRun: GATE grow_x 0.5 shrink_x 0.5
  GateMissing: GateRun not (GATE grow_x 0.014)

  # V6 and above, from the tech LEF: a bent metal, and a via not wholly inside a metal
  # it joins, which an ENCLOSURE of 0 across the metal still forbids.
  M7Bent: M7 not_rectangle
  M8Bent: M8 not_rectangle
  M9Bent: M9 not_rectangle
  M10Bent: M10 not_rectangle
  M11Bent: M11 not_rectangle
  M12Bent: M12 not_rectangle
  M13Bent: M13 not_rectangle
  V6OutsideM6: V6 not_inside M6
  V6OutsideM7: V6 not_inside M7
  V7OutsideM7: V7 not_inside M7
  V7OutsideM8: V7 not_inside M8
  V8OutsideM8: V8 not_inside M8
  V8OutsideM9: V8 not_inside M9
  V9OutsideM9: V9 not_inside M9
  V9OutsideM10: V9 not_inside M10
  V10OutsideM10: V10 not_inside M10
  V10OutsideM11: V10 not_inside M11
  V11OutsideM11: V11 not_inside M11
  V11OutsideM12: V11 not_inside M12
  V12OutsideM12: V12 not_inside M12
  V12OutsideM13: V12 not_inside M13
  V13OutsideM13: V13 not_inside M13
  V13OutsideRDL: V13 not_inside RDL

  # The backside, from the tech LEF, as above.
  BM1Bent: BM1 not_rectangle
  BM2Bent: BM2 not_rectangle
  BM3Bent: BM3 not_rectangle
  BM4Bent: BM4 not_rectangle
  BV0OutsideBPR: BV0 not_inside BPR
  BV0OutsideBM1: BV0 not_inside BM1
  BV1OutsideBM1: BV1 not_inside BM1
  BV1OutsideBM2: BV1 not_inside BM2
  BV2OutsideBM2: BV2 not_inside BM2
  BV2OutsideBM3: BV2 not_inside BM3
  BV3OutsideBM3: BV3 not_inside BM3
  BV3OutsideBM4: BV3 not_inside BM4
  BV4OutsideBM4: BV4 not_inside BM4
  BV4OutsideBRDL: BV4 not_inside BRDL

