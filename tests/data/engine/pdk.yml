# Check-level test PDK.  Where tests/data/synthetic exercises deck and suite
# *resolution*, this one exercises the checks themselves: two anonymous layers and
# one rule per thing being measured, so a pattern's expected answer follows from the
# geometry alone and not from any foundry's reading of it.
name: Engine
version: "1.0"

decks:
  - name: min_enclosure
    path: decks/min_enclosure.yml
  - name: min_array_space
    path: decks/min_array_space.yml
  - name: max_space
    path: decks/max_space.yml

# Cells checked as delivered: a violation inside a placed `PADLIB_*` instance is
# reported waived for ENC.proj, and for nothing else.
waivers:
  - cells: ["PADLIB_*"]
    rules: [ENC.proj]
    reason: library cell

layers:
  - name: Outer
    gds_layer: 1
    gds_datatype: 0
  - name: Inner
    gds_layer: 2
    gds_datatype: 0
  - name: Via
    gds_layer: 3
    gds_datatype: 0
