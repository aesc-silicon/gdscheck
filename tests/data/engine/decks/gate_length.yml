# The width of Outer between chosen walls, chosen by the boundary of Inner: the shared
# walls at least 1 µm, the unshared and the shared at most 3 µm, and the shared once
# more outside Via and once more over runs longer than 3 µm.
rules:
  - id: G.min
    check: min_gate_length
    layers: [Outer, Inner]
    value: 1.0
  - id: G.max_shared
    check: max_gate_length
    layers: [Outer, Inner]
    value: 3.0
  - id: G.max_unshared
    check: max_gate_length
    layers: [Outer, Inner]
    value: 3.0
    params:
      walls: unshared
  - id: G.outside
    check: min_gate_length
    layers: [Outer, Inner]
    value: 1.0
    layer_params:
      outside: Via
  - id: G.len
    check: min_gate_length
    layers: [Outer, Inner]
    value: 1.0
    params:
      length: 3.0
