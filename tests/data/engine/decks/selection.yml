# A selection read whole: the enclosure of what of Inner less Diode lies in Outer.
# SEL.reach builds Inner at a far larger halo than Diode, so a tile's copy of Inner
# reaches past the Diode that cuts it.
rules:
  - id: SEL.enc
    check: min_enclosure
    layers: [Outer, InnerBareInOuter]
    value: 0.24
    params:
      metric: euclidian
  - id: SEL.reach
    check: min_space
    layers: [Inner]
    value: 5.0
  # The two halves of an edge cut at a boundary, counted: one marker per edge.
  - id: SEL.in
    check: forbidden
    layers: [InnerEdgesInOuter]
    value: 0.0
  - id: SEL.out
    check: forbidden
    layers: [InnerEdgesOutOuter]
    value: 0.0
