# A `forbidden` past a boundary is a whole-layout check, so it cannot see a lazy
# (tiled) virtual layer — run_drc must reject this deck up front.
rules:
  - id: BAD.1
    check: forbidden
    layers: [Grown]
    value: 0.0
    params:
      op: beyond
