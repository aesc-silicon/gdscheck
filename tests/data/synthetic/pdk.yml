# Minimal synthetic PDK for PDK-agnostic engine tests (deck/suite resolution).
# Intentionally tiny so expected rule sets are obvious; independent of any foundry.
name: Synthetic
version: "1.0"

suites:
  - name: full
    path: suites/full.yml
  - name: subset
    path: suites/subset.yml
  - name: exclude
    path: suites/exclude.yml
  - name: badrule
    path: suites/badrule.yml
  - name: badexclude
    path: suites/badexclude.yml
  - name: baddeck
    path: suites/baddeck.yml

decks:
  - name: deckA
    path: decks/deckA.yml
  - name: deckB
    path: decks/deckB.yml
  # A `forbidden` past a boundary pointed at a lazy virtual layer — must be rejected.
  - name: badlazy
    path: decks/badlazy.yml

virtual_layers:
  # Both are LayerA NOT LayerB; which is materialised in the layout and which is built
  # per tile in the merge cache is decided by the checks that read them.
  GlobalDiff: LayerA not LayerB
  LazyDiff: LayerA not LayerB
  # `inside`: LayerA restricted to the area enclosed by the LayerB ring (filled).
  InsideRing: LayerA inside_ring LayerB
  # A derivation that only exists in the tiled cache: no whole-layout check can read it.
  Grown: LayerA grow 1.0

layers:
  - name: LayerA
    gds_layer: 1
    gds_datatype: 0
  - name: LayerB
    gds_layer: 2
    gds_datatype: 0
