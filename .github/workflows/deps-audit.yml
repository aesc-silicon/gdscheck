name: Dependency Audit

on:
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
